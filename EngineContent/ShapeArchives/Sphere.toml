# 🧩 Engine shape: A one-metre UV sphere, 32 segments and 16 rings.
#    Read by Frontier/Engine/Geometry/ShapeArchive.cpp; the Construct dialog offers it and the Scene Viewport lays it out from the
#    reserve of the scene archive. Bake the distance volume after any change of [shape], [tessellation] or [distance]:
#    build/ShapeArchiveBake EngineContent/ShapeArchives

[shape]
name        = "Sphere"
primitive   = "sphere"
glyph       = "Sphere"
description = "A one-metre UV sphere, 32 segments and 16 rings."
size_m      = [1.00, 1.00, 1.00]   # [m] bounding box

[tessellation]
segments = 32   # [-] around the axis
rings    = 16   # [-] pole to pole (sphere) or around the tube (torus)

# 📝 MaterialSpecification channels (linear albedo); the object's material slot starts from these.
[surface]
name           = "Sphere surface"
albedo         = [0.55, 0.55, 0.55]
roughness      = 0.5
metalness      = 0.0
specular       = 0.04
coat           = 0.0
coat_roughness = 0.0
incandescence  = [0.0, 0.0, 0.0]
transmission   = 0.0

[distance]
voxel_m = 0.03125   # [m] voxel of the baked signed distance volume
archive = "Sphere.sdfspace"

[cards]
density = 12.0   # [texel/m] surface cards (the illumination's surface store)
