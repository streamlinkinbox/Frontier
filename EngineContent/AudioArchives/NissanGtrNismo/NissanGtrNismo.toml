# Frontier acoustic structure — Nissan GT-R Nismo (first cut, row A2 / HTML editor)
# Loaded by AcousticStructure::Load (Engine/PlatformInterchange) and embedded verbatim in Tools/AudioEditor/index.html.
# Tune in the editor, Export, drop the file here; identity between the worklet and the C++ is the A5–A7 proof.
# units: [Hz] [rpm] [m] [mm] [s] [K] [bar] [°] [-]   (crank angles are degrees over the 720° four-stroke cycle)

[vehicle]
name                   = "Nissan GT-R Nismo"            # display name
engine                 = "VR38DETT 3.8 L 60° V6, twin IHI turbos, titanium exhaust" # one-line engine description
cylinder_count         = 6                              # number of cylinders
firing_order           = [1, 2, 3, 4, 5, 6]             # cylinder numbers in firing sequence, even 720/N intervals
bank_of_cylinder       = [1, 0, 1, 0, 1, 0]             # bank per cylinder number (0 = left pipe, 1 = right pipe)
idle_rpm               = 650.0                          # [rpm]
redline_rpm            = 7100.0                         # [rpm] fuel cut
peak_power_rpm         = 6800.0                         # [rpm]
peak_torque_rpm        = 3600.0                         # [rpm]
peak_torque_nm         = 652.0                          # [N·m]
inertia_kgm2           = 0.6                            # [kg·m²] effective rotating inertia seen by the free-rev powertrain
friction_nm            = 35.0                           # [N·m] friction torque at zero rpm
friction_per_krpm_nm   = 10.0                           # [N·m] friction torque increase per 1000 rpm

[combustion]
evo_deg                = 132.0                          # [°] exhaust valve opens this many degrees after the firing TDC
blowdown_deg           = 22.0                           # [°] crank angle to the blowdown pressure peak
bark_deg               = 7.0                            # [°] crank angle to the fast combustion-only front peak
displacement_deg       = 90.0                           # [°] crank angle to the exhaust-stroke displacement peak (from BDC)
blowdown_amp           = 1.0
bark_amp               = 0.4                            # scaled by load^1.5
displacement_amp       = 0.35
pumping_amp            = 0.06                           # blowdown amplitude without combustion, throttle closed
pumping_open_amp       = 0.2                            # added blowdown amplitude without combustion at wide-open throttle (limiter)
jitter_amp             = 0.05                           # cycle-to-cycle amplitude deviation (1 σ) at full load
jitter_deg             = 0.8                            # [°] cycle-to-cycle timing deviation (1 σ) at full load
idle_jitter_boost      = 2.2                            # both deviations grow by this factor toward zero load
misfire_probability    = 0.008                          # per firing at full load; ×4 toward zero load
discharge_noise        = 0.3                            # turbulent blowdown noise gated by the pulse
pop_level              = 0.5                            # overrun pop / crackle amplitude
pop_rate_hz            = 12.0                           # [Hz] overrun pop rate at redline right after lift
pop_decay_s            = 0.8                            # [s] overrun crackle fades with this time constant

[exhaust]
temperature_idle_k     = 740.0                          # [K] port gas temperature at idle
temperature_wot_k      = 1150.0                         # [K] port gas temperature at full load
thermal_lag_s          = 3.5                            # [s]
head_reflection        = 0.6                            # pressure reflection at the (mostly closed) exhaust valves
merge                  = 0.7                            # 0 = separate bank systems … 1 = full Y-merge ahead of the tail pipes
saturation_drive       = 2.0                            # tanh drive on the exhaust bus
bank_pan               = 0.35                           # 0 = both pipes centred … 1 = hard left/right

[exhaust.primary]
length_m               = 0.3                            # [m] head to collector
diameter_mm            = 40.0                           # [mm]
temperature_drop_k     = 0.0                            # [K] below the port temperature

[exhaust.collector]
length_m               = 1.8                            # [m] collector to silencer
diameter_mm            = 76.0                           # [mm]
temperature_drop_k     = 250.0                          # [K]

[exhaust.tail]
length_m               = 1.6                            # [m] silencer to tip
diameter_mm            = 90.0                           # [mm] sets the radiation corner
temperature_drop_k     = 400.0                          # [K]

[exhaust.muffler]
transmission           = 0.65                           # amplitude passed through the silencer
cutoff_hz              = 4200.0                         # [Hz] silencer low-pass corner

[exhaust.turbine]
enabled                = true                           # turbine between primary and collector
transmission           = 0.5
cutoff_hz              = 1800.0                         # [Hz]
reflection             = 0.45                           # pressure reflection back into the manifold

[induction]
runner_length_m        = 0.3                            # [m] valve to plenum
runner_diameter_mm     = 40.0                           # [mm]
temperature_k          = 330.0                          # [K] charge temperature
valve_reflection       = 0.85
plenum_reflection      = -0.5                           # runner end into the plenum
plenum_hz              = 120.0                          # [Hz] plenum / airbox Helmholtz resonance
plenum_q               = 3.0
level                  = 0.2
hiss_level             = 0.1                            # throttle-body discharge noise

[mechanical]
clatter_level          = 0.3                            # valve seating clatter
clatter_hz             = 4200.0                         # [Hz] clatter resonance
whine_order            = 31.0                           # gear whine order relative to crank speed (0 = none)
whine_level            = 0.012
inverter_hz            = 0.0                            # [Hz] hybrid inverter carrier (0 = none)
inverter_level         = 0.0

[turbo]
enabled                = true                           # forced-induction layer
shaft_idle_rpm         = 20000.0                        # [rpm]
shaft_max_rpm          = 165000.0                       # [rpm]
spool_up_s             = 0.55                           # [s]
spool_down_s           = 1.0                            # [s]
boost_max_bar          = 1.1                            # [bar]
whine_level            = 0.35                           # compressor whistle
recirculation_level    = 0.6                            # blow-off / recirculation hiss on lift

[body]
resonance_hz           = [64.0, 105.0]                  # [Hz] structure-borne boom resonances
q                      = 8.0
level                  = 0.35

[mix]
exhaust                = 1.0                            # bus levels (listener presets multiply these)
induction              = 1.0
mechanical             = 1.0
body                   = 1.0
output_gain            = 2.0                            # before the limiter
