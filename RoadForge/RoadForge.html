* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 'DM Sans', system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #2c2c2c; border-radius: 8px; } ::-webkit-scrollbar-track { background: transparent; }

#app { display: grid; grid-template-rows: var(--top-h) 1fr; grid-template-columns: var(--panel-w) 1fr var(--right-w); height: 100vh; }
/* ---------------- top bar ---------------- */
#topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .logo { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(160deg, #313131, #242424); border: 1px solid #3a3a3a; display: grid; place-items: center; color: var(--accent-a); }
.brand h1 { font-size: 15px; font-weight: 500; color: var(--text-strong); margin: 0; letter-spacing: 0.2px; }
.brand .sub { font-size: 9px; color: var(--text-dim); letter-spacing: 1.4px; text-transform: uppercase; white-space: nowrap; }
.brand input { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px; color: var(--text-strong); font-size: 13px; width: 160px; }
.brand input:hover, .brand input:focus { border-color: var(--line-2); outline: none; background: #1a1a1a; }
.tools { display: flex; align-items: center; gap: 4px; padding: 4px; background: #141414; border: 1px solid var(--line); border-radius: 12px; }
.tbtn { height: 34px; min-width: 34px; padding: 0 9px; white-space: nowrap; border-radius: 9px; display: inline-flex; align-items: center; gap: 7px; color: var(--text); font-size: 12px; }
.tbtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tbtn:hover { background: var(--hover); color: var(--text-strong); }
.tbtn.on { background: #2a2a2a; color: var(--text-strong); box-shadow: inset 0 0 0 1px #3d3d3d; }
.tbtn.on svg { color: var(--accent-a); }
.tbtn[disabled] { opacity: 0.35; cursor: default; }
.spacer { flex: 1; }
.stats { font-family: var(--mono); font-size: 11px; color: var(--text-dim); display: flex; gap: 14px; padding: 0 10px; white-space: nowrap; }
.stats b { color: var(--text-strong); font-weight: 400; }
.sep { width: 1px; height: 28px; background: var(--line); margin: 0 4px; }
kbd { font-family: var(--mono); font-size: 10px; background: #222; border: 1px solid #333; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: #aaa; }

/* ---------------- panels ---------------- */
.panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#right { border-right: 0; border-left: 1px solid var(--line); background: radial-gradient(ellipse at 80% 0%, #1b1b1b, #171717 42%, #141414); display: grid; grid-template-rows: minmax(160px, 38%) 1fr; min-height: 0; }
.ph { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.ph .title { font-size: 10px; letter-spacing: 1.7px; text-transform: uppercase; color: var(--eyebrow); }
.ph .count { font-size: 10px; color: var(--text-faint); font-family: var(--mono); }
.search { margin: 0 12px 8px; height: 36px; background: var(--panel-2); border: 1px solid #282828; border-radius: 7px; display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--text-dim); }
.search input { flex: 1; background: none; border: 0; outline: none; color: var(--text-strong); font-size: 12px; }
.search svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.scroll { overflow: auto; min-height: 0; flex: 1; padding-bottom: 20px; }
.group { padding: 10px 12px 0; }
.group > .gh { display: flex; align-items: center; gap: 8px; padding: 6px 6px; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--label); cursor: pointer; }
.group > .gh .count { margin-left: auto; color: var(--text-faint); font-family: var(--mono); letter-spacing: 0; }
.group > .gh svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; transition: transform 0.15s; }
.group.closed > .gh svg.chev { transform: rotate(-90deg); }
.group.closed > .rows { display: none; }
.row { height: 43px; margin: 3px 4px; border-radius: 7px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px; color: var(--text); cursor: pointer; border: 1px solid transparent; position: relative; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); border-color: var(--sel-line); color: var(--text-strong); }
.row.sel::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: #b9b9b9; }
.row .ico { width: 26px; height: 26px; border-radius: 8px; background: #1f1f1f; border: 1px solid #2c2c2c; display: grid; place-items: center; flex: none; }
.row .ico svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.row .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
.row .meta { font-size: 10px; color: var(--text-faint); font-family: var(--mono); }
.row .eye { opacity: 0; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; color: var(--text-dim); }
.row:hover .eye, .row .eye.off { opacity: 1; }
.row .eye svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.row .eye.off { color: var(--text-faint); }
.tpl { height: auto; padding: 9px 10px 9px 12px; align-items: flex-start; }
.tpl .name { white-space: normal; font-size: 12px; line-height: 1.3; }
.tpl .blurb { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; white-space: normal; }
.warn { color: #d6a078; } .err { color: #e07a6b; }
.diag { font-size: 11px; padding: 6px 14px; color: var(--text-dim); }

/* ---------------- layer stack ---------------- */
#layers { border-bottom: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.layer { height: 46px; margin: 3px 8px; border-radius: 9px; border: 1px solid transparent; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 10px; cursor: pointer; }
.layer:hover { background: var(--hover); }
.layer.sel { background: var(--sel); border-color: var(--sel-line); }
.layer .ico { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(160deg, #313131, #242424); border: 1px solid #3a3a3a; display: grid; place-items: center; }
.layer .ico svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.layer .lname { flex: 1; font-size: 12.5px; color: var(--text-strong); }
.layer .lsub { font-size: 10px; color: var(--text-dim); }
.layer .drag { color: var(--text-faint); font-size: 14px; letter-spacing: -2px; }

/* ---------------- inspector ---------------- */
#inspector { display: flex; flex-direction: column; min-height: 0; }
.card { margin: 10px 12px; padding: 18px 19px; border-radius: 18px; background: var(--card); border: 1px solid var(--card-line); }
.card h2 { font-size: 12px; font-weight: 500; color: #c9c9c9; margin: 0 0 4px; }
.eyebrow { font-size: 9px; letter-spacing: 1.7px; text-transform: uppercase; color: var(--eyebrow); margin-bottom: 6px; }
.h1 { font-size: 28px; font-weight: 400; color: var(--text-strong); line-height: 1.1; margin: 2px 0 6px; }
.metric { font-size: 36px; font-weight: 300; color: var(--text-strong); font-family: var(--mono); }
.muted { font-size: 10px; color: var(--text-dim); }
.section-label { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: #8d8d8d; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
.section-label::after { content: ''; flex: 1; height: 1px; background: #2c2c2c; }
.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; min-height: 30px; }
.field.col { grid-template-columns: 1fr; }
.field label { font-size: 11.5px; color: var(--text); }
.field .val { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); min-width: 44px; text-align: right; }
.toggle { width: 29px; height: 17px; border-radius: 17px; background: #424242; position: relative; flex: none; transition: background 0.15s; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 11px; height: 11px; border-radius: 50%; background: #a2a2a2; transition: transform 0.15s, background 0.15s; }
.toggle.on { background: #b2b2b2; } .toggle.on::after { background: #2d2d2d; transform: translateX(12px); }
input[type=range] { -webkit-appearance: none; width: 100%; height: 3px; background: #3a3a3a; border-radius: 3px; outline: none; margin: 8px 0; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #d8d8d8; border: 0; cursor: pointer; }
.range { display: grid; grid-template-columns: 1fr 50px; gap: 10px; align-items: center; }
.range .val { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); text-align: right; }
select.sel, input.num, input.txt { background: #252525; border: 1px solid #3a3a3a; border-radius: 8px; height: 28px; padding: 0 8px; color: var(--text-strong); font-size: 12px; outline: none; }
select.sel { min-width: 120px; } input.num { width: 72px; font-family: var(--mono); font-size: 11px; text-align: right; } input.txt { width: 100%; }
input.num:focus, input.txt:focus, select.sel:focus { border-color: #555; }
.vec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .vec input.num { width: 100%; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { height: 26px; padding: 0 11px; border-radius: 25px; border: 1px solid #3a3a3a; background: #252525; font-size: 11px; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
.pill:hover { color: var(--text-strong); border-color: #4a4a4a; } .pill.on { background: #b2b2b2; color: #1a1a1a; border-color: #b2b2b2; }
.pill svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
.btn { height: 30px; padding: 0 12px; border-radius: 9px; border: 1px solid #3a3a3a; background: #252525; color: var(--text-strong); font-size: 11.5px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: #2c2c2c; border-color: #4a4a4a; } .btn.danger:hover { border-color: #7a3b33; color: #e8a090; }
.btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.swatch { width: 28px; height: 20px; border-radius: 6px; border: 1px solid #3a3a3a; padding: 0; background: none; }
.swatch::-webkit-color-swatch-wrapper { padding: 0; } .swatch::-webkit-color-swatch { border: 0; border-radius: 5px; }
.obj-icon { width: 56px; height: 56px; border-radius: 17px; background: linear-gradient(160deg, #313131, #242424); border: 1px solid #3a3a3a; display: grid; place-items: center; margin-bottom: 10px; }
.obj-icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sub-list { display: flex; flex-direction: column; gap: 4px; }
.sub-item { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 9px; padding: 6px 8px; font-size: 11px; }
.sub-item .params { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; color: var(--text-dim); }
.sub-item .params input.num { width: 56px; height: 24px; }
.sub-item .x { width: 22px; height: 22px; border-radius: 6px; color: var(--text-dim); display: grid; place-items: center; } .sub-item .x:hover { background: #2a2a2a; color: #e8a090; }
.sub-item .x svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
.hint { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
.hint kbd { margin: 0 2px; }

/* ---------------- viewport ---------------- */
#viewport { position: relative; min-width: 0; min-height: 0; background: #0b0b0c; }
#gl { width: 100%; height: 100%; display: block; outline: none; }
#gl.tool-road, #gl.tool-rail, #gl.tool-block { cursor: crosshair; } #gl.tool-pan { cursor: grab; } #gl.grabbing { cursor: grabbing; }
.hud { position: absolute; pointer-events: none; }
.hud.bl { left: 16px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
.hud .chip { pointer-events: auto; background: rgba(22, 22, 22, 0.86); border: 1px solid #2f2f2f; border-radius: 10px; padding: 7px 11px; font-size: 11px; color: var(--text); backdrop-filter: blur(6px); display: flex; align-items: center; gap: 8px; }
.hud .chip b { color: var(--text-strong); font-weight: 500; }
.hud.tr { right: 16px; top: 14px; display: flex; gap: 6px; }
.hud .chip.err { border-color: #5a2d27; color: #e8a090; }
.toast { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: rgba(22, 22, 22, 0.92); border: 1px solid #2f2f2f; border-radius: 10px; padding: 8px 14px; font-size: 12px; color: var(--text-strong); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
.modal-bg { position: fixed; inset: 0; background: #080a1080; backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 50; }
.modal { width: 520px; max-width: 92vw; max-height: 86vh; overflow: auto; background: #1a1a1a; border: 1px solid #343434; border-radius: 18px; padding: 24px 26px; }
.modal h2 { margin: 0 0 6px; font-weight: 500; color: var(--text-strong); font-size: 16px; }
.modal p, .modal li { color: var(--text); font-size: 12.5px; line-height: 1.55; }
.modal .close { float: right; }
.menu { position: absolute; background: #252525; border: 1px solid #434343; border-radius: 10px; padding: 6px; z-index: 40; min-width: 180px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45); }
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 7px; color: var(--text-strong); font-size: 12px; }
.menu button:hover { background: #303030; }
.menu button svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }
#nogpu { position: absolute; inset: 0; display: none; place-items: center; background: #0f0f0f; z-index: 60; }
#nogpu .modal { text-align: center; }

@media (max-width: 1560px) { .tbtn span { display: none; } .tbtn { padding: 0 8px; } .brand .sub { display: none; } }
@media (max-width: 1280px) { .stats span:nth-child(3) { display: none; } }

</style>
</head>
<body>
<div id="app">

  <main id="viewport">
    <canvas id="gl" tabindex="0"></canvas>
    <div class="hud bl" id="hud-bl"></div>
    <div class="hud tr" id="hud-tr"></div>
    <div class="toast" id="toast"></div>
    <div id="nogpu"><div class="modal"><h2>WebGPU is not available</h2><p>RoadForge renders with WebGPU. Use a current Chromium-based browser (Chrome / Edge 113+), Firefox 141+, or Safari 26 and make sure hardware acceleration is enabled.</p><p id="nogpu-reason" class="muted"></p></div></div>
  </main>
  <aside id="right" class="panel">
    <section id="layers"></section>
    <section id="inspector"></section>
  </aside>

    cloverleaf: {
      name: 'Cloverleaf', blurb: 'Full cloverleaf: two motorways, four loop ramps (R 62 m) and four outer connectors (R 400 m) built parametrically around the crossing.',
      make() {
        const p = P('Cloverleaf');
        const H = 7.5, off = 10; // deck level of road B; carriageway centre offset from each axis
        const Rl = 62, Dl = 16, Lel = 40, Lp = 40; // loop radius, running offset from the mainline centreline, exit/entry taper, parallel run before the arc
        const Ro = 400, Do = 55, Leo = 150;        // outer connector radius, running offset, taper length (clears the loops: (Ro+Do)·√2 − Ro > loop extent)
        const SS = (u) => RF.smoothstep(0, 1, u);
        // carriageways: travel direction d, right-hand normal r (right-hand traffic: r = (-d.z, d.x)), centreline o = r * off
        const cw = {
          AE: { d: [1, 0], y: 0, name: 'Motorway A eastbound' }, AW: { d: [-1, 0], y: 0, name: 'Motorway A westbound' },
          BS: { d: [0, 1], y: H, name: 'Motorway B southbound' }, BN: { d: [0, -1], y: H, name: 'Motorway B northbound' },
        };
        for (const c of Object.values(cw)) { c.r = [-c.d[1], c.d[0]]; c.o = [c.r[0] * off, c.r[1] * off]; c.marks = []; }
        const byDir = (d) => Object.entries(cw).find(([, c]) => Math.abs(c.d[0] - d[0]) < 1e-6 && Math.abs(c.d[1] - d[1]) < 1e-6)[0];
        const at = (c, t, lat = 0) => [c.o[0] + c.d[0] * t + c.r[0] * lat, c.o[1] + c.d[1] * t + c.r[1] * lat];
        const tOf = (c, q) => (q[0] - c.o[0]) * c.d[0] + (q[1] - c.o[1]) * c.d[1];
        const addMark = (tag, t, kind) => { cw[tag].marks.push({ t, kind }); return `${tag}_${kind}`; };
        const ramps = [];
        for (const [fromTag, from] of Object.entries(cw)) {
          // --- loop (left turn): exit after the crossing on the right, 270° right-hand loop, merge from the right before the crossing of the target
          const toTag = byDir([-from.r[0], -from.r[1]]), to = cw[toTag];
          const X = [from.o[0] + to.o[0], from.o[1] + to.o[1]];
          const tDiv = tOf(from, X) + (Rl + Dl + Lp - Lel), tMer = tOf(to, X) - (Rl + Dl + Lp - Lel);
          const nA = addMark(fromTag, tDiv, 'loopDiv'), nB = addMark(toTag, tMer, 'loopMer');
          const c = [X[0] + (from.d[0] + from.r[0]) * (Rl + Dl + Lp), X[1] + (from.d[1] + from.r[1]) * (Rl + Dl + Lp)];
          const pts = [];
          for (let k = 1; k <= 3; k++) pts.push(at(from, tDiv + (Lel * k) / 4, Dl * SS(k / 4)));
          for (let i = 0; i <= 18; i++) { const a = (i / 18) * Math.PI * 1.5; pts.push([c[0] + Rl * (-from.r[0] * Math.cos(a) + from.d[0] * Math.sin(a)), c[1] + Rl * (-from.r[1] * Math.cos(a) + from.d[1] * Math.sin(a))]); }
          for (let k = 1; k <= 3; k++) pts.push(at(to, tMer - Lel + (Lel * k) / 4, Dl * (1 - SS(k / 4))));
          ramps.push({ id: `loop${fromTag}${toTag}`, a: nA, b: nB, profile: 'loop', pts, y0: from.y, y1: to.y, name: `Loop ${fromTag}→${toTag}` });
          // --- outer connector (right turn): exit well before the crossing, R 300 m quarter circle outside the loop, merge well after
          const to2Tag = byDir(from.r), to2 = cw[to2Tag];
          const X2 = [from.o[0] + to2.o[0], from.o[1] + to2.o[1]];
          const tDiv2 = tOf(from, X2) - (Ro + Do + Leo), tMer2 = tOf(to2, X2) + (Ro + Do + Leo);
          const nC = addMark(fromTag, tDiv2, 'outDiv'), nD = addMark(to2Tag, tMer2, 'outMer');
          const c2 = [X2[0] - from.d[0] * (Ro + Do) + from.r[0] * (Ro + Do), X2[1] - from.d[1] * (Ro + Do) + from.r[1] * (Ro + Do)];
          const pts2 = [];
          for (let k = 1; k <= 5; k++) pts2.push(at(from, tDiv2 + (Leo * k) / 6, Do * SS(k / 6)));
          for (let i = 0; i <= 12; i++) { const a = (i / 12) * Math.PI * 0.5; pts2.push([c2[0] + Ro * (-from.r[0] * Math.cos(a) + from.d[0] * Math.sin(a)), c2[1] + Ro * (-from.r[1] * Math.cos(a) + from.d[1] * Math.sin(a))]); }
          for (let k = 1; k <= 5; k++) pts2.push(at(to2, tMer2 - Leo + (Leo * k) / 6, Do * (1 - SS(k / 6))));
          ramps.push({ id: `outer${fromTag}${to2Tag}`, a: nC, b: nD, profile: 'ramp', pts: pts2, y0: from.y, y1: to2.y, name: `Connector ${fromTag}→${to2Tag}` });
        }
        // mainline nodes + segments (sorted by station)
        for (const [tag, c] of Object.entries(cw)) {
          const marks = [{ t: -900, kind: 'start' }, ...c.marks, { t: 900, kind: 'end' }].sort((u, v) => u.t - v.t);
          const ids = marks.map((m) => { const q = at(c, m.t); return N(p, `${tag}_${m.kind}`, q[0], c.y, q[1], { name: `${c.name} ${m.kind}` }); });
          for (let i = 0; i < ids.length - 1; i++) R(p, `${tag}r${i}`, ids[i], ids[i + 1], 'carriageway', [], { name: `${c.name} ${i + 1}` });
        }
        // ramps with a smooth grade between the two levels (by arc length)
        for (const rp of ramps) {
          const cum = [0]; for (let i = 1; i < rp.pts.length; i++) cum.push(cum[i - 1] + Math.hypot(rp.pts[i][0] - rp.pts[i - 1][0], rp.pts[i][1] - rp.pts[i - 1][1]));
          const L = cum[cum.length - 1];
          const pts = rp.pts.map((q, i) => [q[0], rp.y0 + (rp.y1 - rp.y0) * RF.smoothstep(0.12, 0.88, cum[i] / L), q[1]]);

        }
        return p;
      },
    },
