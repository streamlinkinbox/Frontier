<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frontier — Bald Eagle</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    canvas { display: block; }
    #ui { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
          background: rgba(12,14,18,.55); backdrop-filter: blur(8px); padding: 10px 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,.08); }
    #ui button { appearance: none; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #e9e6df; padding: 8px 14px; border-radius: 10px;
          font-size: 13px; letter-spacing: .02em; cursor: pointer; transition: background .15s, border-color .15s; }
    #ui button:hover { background: rgba(255,255,255,.14); }
    #ui button.on { background: #d9a520; color: #151209; border-color: #d9a520; }
    #ui .sep { width: 1px; background: rgba(255,255,255,.15); margin: 0 4px; }
    #ui label { color: #cfcac0; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    #hud { position: fixed; left: 16px; top: 14px; color: #e9e6df; font-size: 12px; opacity: .8; line-height: 1.5; text-shadow: 0 1px 2px #000; }
    #hud b { color: #f0c040; font-weight: 600; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #cfcac0; font-size: 14px; letter-spacing: .08em; }
  </style>
</head>
<body>
  <div id="loading">GROWING FEATHERS…</div>
  <div id="hud"><b>Bald eagle</b> · <i>Haliaeetus leucocephalus</i><br><span id="state">Idle</span><br>Drag to orbit · scroll to zoom · keys 1–6</div>
  <div id="ui">
    <button data-mode="idle" class="on">1 Idle</button>
    <button data-mode="walk">2 Walk</button>
    <button data-action="screech">3 Screech</button>
    <button data-action="headturn">4 Head turn</button>
    <div class="sep"></div>
    <button data-mode="flap">5 Flap</button>
    <button data-mode="glide">6 Glide</button>
    <div class="sep"></div>
    <label>Speed <input id="ts" type="range" min="0.05" max="1.5" step="0.05" value="1"><span id="tsv">1.00×</span></label>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
