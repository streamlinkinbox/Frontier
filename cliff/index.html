<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>FRONTIER · Cliff Forge</title>
<style>
  :root{
    --blue:#1f5eff; --blue-soft:#4d80ff;
    --bg:#0a0a0a; --panel:rgba(14,14,16,.82); --field:#000; --inset:#1a1a1a;
    --stroke:rgba(255,255,255,.08); --stroke-strong:#2e2e2e;
    --text:#fff; --dim:#9a9a9a; --faint:#5f5f5f;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
    --shadow:0 24px 60px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;
       -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select{font:inherit;color:inherit}
  svg{display:block}
  :focus-visible{outline:2px solid var(--blue-soft);outline-offset:2px;border-radius:8px}

  #view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  .ui > *{pointer-events:auto}

  /* ---------- brand ---------- */
  .brand{position:absolute;top:18px;left:20px;display:flex;align-items:center;gap:10px;
         padding:8px 14px 8px 10px;border-radius:999px;background:var(--panel);
         border:1px solid var(--stroke);backdrop-filter:blur(14px)}
  .brand .mark{width:26px;height:26px;border-radius:8px;background:var(--blue);display:grid;place-items:center}
  .brand .mark svg{width:15px;height:15px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .brand b{font-size:12px;font-weight:700;letter-spacing:.16em}
  .brand span{font-size:11px;color:var(--dim);letter-spacing:.08em;margin-left:2px}

  /* ---------- panel ---------- */
  #panel{position:absolute;top:70px;left:20px;bottom:20px;width:288px;display:flex;flex-direction:column;
         background:var(--panel);border:1px solid var(--stroke);border-radius:18px;
         backdrop-filter:blur(16px);box-shadow:var(--shadow);overflow:hidden;
         transition:transform .3s var(--ease),opacity .3s}
  #panel.hidden{transform:translateX(-110%);opacity:0;pointer-events:none}
  .panel-scroll{overflow-y:auto;padding:4px 14px 14px;scrollbar-width:thin;scrollbar-color:#333 transparent}
  .panel-scroll::-webkit-scrollbar{width:8px}
  .panel-scroll::-webkit-scrollbar-thumb{background:#2b2b2b;border-radius:4px}

  .sec{padding:12px 0 4px}
  .sec + .sec{border-top:1px solid var(--stroke)}
  .sec h3{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
          padding:2px 0 10px;display:flex;justify-content:space-between;align-items:center}
  .sec h3 em{font-style:normal;color:var(--blue-soft);letter-spacing:.04em;text-transform:none;font-size:10.5px}

  .ctl{display:block;margin-bottom:11px}
  .ctl .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .ctl .lab span{font-size:11.5px;color:var(--dim)}
  .ctl .lab b{font:600 11px/1 var(--mono);color:#fff;background:var(--inset);
              border:1px solid var(--stroke);border-radius:6px;padding:3px 6px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:#2a2a2a}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
      background:#fff;margin-top:-5px;box-shadow:0 0 0 3px rgba(31,94,255,.35);transition:box-shadow .15s}
  input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(31,94,255,.45)}
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#2a2a2a}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff;
      box-shadow:0 0 0 3px rgba(31,94,255,.35)}

  .row{display:flex;gap:8px;align-items:center}
  .field{height:32px;border-radius:999px;background:var(--field);border:1px solid var(--stroke);
         display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0;flex:1}
  .field:focus-within{border-color:var(--stroke-strong)}
  .field svg{width:13px;height:13px;stroke:var(--faint);stroke-width:2;fill:none;flex:none}
  .field input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:12px}
  .field input::placeholder{color:var(--faint)}
  .icon-btn{width:32px;height:32px;border-radius:999px;background:var(--inset);border:1px solid var(--stroke);
            display:grid;place-items:center;flex:none;transition:background .15s,transform .15s}
  .icon-btn:hover{background:var(--stroke-strong)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn svg{width:14px;height:14px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  .btn{height:32px;padding:0 14px;border-radius:999px;font-size:12px;font-weight:500;display:inline-flex;
       align-items:center;gap:7px;background:var(--inset);border:1px solid var(--stroke);
       transition:background .15s,transform .15s;white-space:nowrap}
  .btn:hover{background:#242424}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--blue);border-color:transparent}
  .btn.primary:hover{background:#2f6bff}
  .btn svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  .toggle{display:flex;align-items:center;justify-content:space-between;padding:6px 0;cursor:pointer}
  .toggle span{font-size:11.5px;color:var(--dim)}
  .toggle input{display:none}
  .toggle i{width:32px;height:18px;border-radius:999px;background:#2a2a2a;position:relative;
            transition:background .2s var(--ease);flex:none}
  .toggle i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
                   background:#8a8a8a;transition:transform .2s var(--ease),background .2s}
  .toggle input:checked + i{background:var(--blue)}
  .toggle input:checked + i::after{transform:translateX(14px);background:#fff}

  select{height:32px;border-radius:999px;background:var(--field);border:1px solid var(--stroke);
         padding:0 30px 0 12px;font-size:12px;font-weight:500;width:100%;cursor:pointer;
         appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%239a9a9a' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
         background-repeat:no-repeat;background-position:right 12px center}
  select:focus{outline:none;border-color:var(--stroke-strong)}

  /* ---------- right rail ---------- */
  .rail{position:absolute;top:18px;right:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .views{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);
         border:1px solid var(--stroke);backdrop-filter:blur(14px)}
  .views button{height:26px;padding:0 11px;border-radius:999px;font-size:11px;font-weight:500;color:var(--dim);
                transition:background .15s,color .15s}
  .views button:hover{color:#fff}
  .views button.on{background:#fff;color:#111}
  .actions{display:flex;gap:6px;padding:5px;border-radius:999px;background:var(--panel);
           border:1px solid var(--stroke);backdrop-filter:blur(14px)}

  /* ---------- stats ---------- */
  .stats{position:absolute;left:20px;bottom:20px;display:flex;gap:18px;padding:10px 16px;border-radius:14px;
         background:var(--panel);border:1px solid var(--stroke);backdrop-filter:blur(14px);
         font-size:11px;color:var(--faint);transition:transform .3s var(--ease),opacity .3s}
  #panel:not(.hidden) ~ .stats{transform:translateX(308px)}
  .stats b{display:block;font:600 13px/1.4 var(--mono);color:#fff}
  .stats i{font-style:normal;color:var(--faint)}

  .hint{position:absolute;right:20px;bottom:20px;font-size:10.5px;color:var(--faint);text-align:right;
        line-height:1.7;pointer-events:none}
  .hint kbd{font:600 9.5px/1 var(--mono);border:1px solid var(--stroke-strong);border-radius:4px;padding:2px 4px;color:var(--dim)}

  /* ---------- overlays ---------- */
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,6,8,.55);
           backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
  #loading.on{opacity:1}
  #loading .box{display:flex;align-items:center;gap:12px;padding:14px 22px;border-radius:999px;
                background:var(--panel);border:1px solid var(--stroke);font-size:12.5px;letter-spacing:.04em}
  #loading .spin{width:15px;height:15px;border-radius:50%;border:2px solid #2e2e2e;border-top-color:var(--blue);
                 animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  #toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);padding:10px 18px;border-radius:999px;
         background:var(--panel);border:1px solid var(--stroke);font-size:12px;backdrop-filter:blur(14px);
         opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:60}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:820px){
    #panel{width:250px;top:64px}
    .hint{display:none}
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="ui">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M3 18l6-9 4 5 3-4 5 8z"/><path d="M8 6l2 3"/></svg></div>
    <b>FRONTIER</b><span>CLIFF FORGE</span>
  </div>

  <aside id="panel">
    <div class="panel-scroll">

      <div class="sec">
        <h3>Rock type</h3>
        <select id="preset">
          <option value="limestone">Limestone quarry</option>
          <option value="sandstone">Sandstone mesa</option>
          <option value="granite">Granite pit</option>
          <option value="slate">Slate quarry</option>
        </select>
        <div class="ctl" style="margin-top:11px">
          <div class="lab"><span>Seed</span></div>
          <div class="row">
            <label class="field">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              <input id="seed" type="text" value="quarry-01" spellcheck="false" />
            </label>
            <button class="icon-btn" id="randomize" title="Randomise (R)">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="sec">
        <h3>Pit <em id="bench-info">4 benches</em></h3>
        <label class="ctl"><span class="lab"><span>Pit radius</span><b id="v-pitRadius">34.0</b></span>
          <input id="pitRadius" type="range" min="16" max="52" step="1" value="34"></label>
        <label class="ctl"><span class="lab"><span>Pit depth</span><b id="v-pitDepth">24.0</b></span>
          <input id="pitDepth" type="range" min="8" max="45" step="1" value="24"></label>
        <label class="ctl"><span class="lab"><span>Bench height</span><b id="v-benchHeight">5.5</b></span>
          <input id="benchHeight" type="range" min="2.5" max="12" step="0.5" value="5.5"></label>
        <label class="ctl"><span class="lab"><span>Bench width</span><b id="v-benchWidth">5.0</b></span>
          <input id="benchWidth" type="range" min="2" max="10" step="0.5" value="5"></label>
        <label class="ctl"><span class="lab"><span>Outline fray</span><b id="v-edgeFray">0.65</b></span>
          <input id="edgeFray" type="range" min="0" max="1.2" step="0.05" value="0.65"></label>
      </div>

      <div class="sec">
        <h3>Faces</h3>
        <label class="ctl"><span class="lab"><span>Rock roughness</span><b id="v-roughness">0.85</b></span>
          <input id="roughness" type="range" min="0" max="2" step="0.05" value="0.85"></label>
        <label class="ctl"><span class="lab"><span>Hard-band bulge</span><b id="v-bulge">0.90</b></span>
          <input id="bulge" type="range" min="0" max="2" step="0.05" value="0.9"></label>
        <label class="ctl"><span class="lab"><span>Strata thickness</span><b id="v-bandThickness">2.6</b></span>
          <input id="bandThickness" type="range" min="1" max="6" step="0.2" value="2.6"></label>
        <label class="ctl"><span class="lab"><span>Strata contrast</span><b id="v-strataContrast">1.00</b></span>
          <input id="strataContrast" type="range" min="0.3" max="1.6" step="0.05" value="1"></label>
      </div>

      <div class="sec">
        <h3>Rock rubble</h3>
        <label class="ctl"><span class="lab"><span>Chunk density</span><b id="v-rockDensity">1.00</b></span>
          <input id="rockDensity" type="range" min="0" max="2" step="0.05" value="1"></label>
        <label class="ctl"><span class="lab"><span>Chunk size</span><b id="v-rockScale">1.00</b></span>
          <input id="rockScale" type="range" min="0.3" max="2" step="0.05" value="1"></label>
        <div class="row" style="margin-top:4px">
          <button class="btn primary" id="generate" style="flex:1;justify-content:center">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
            Generate
          </button>
        </div>
      </div>

      <div class="sec">
        <h3>Scene</h3>
        <label class="toggle"><span>Haul road</span><input type="checkbox" id="road" checked><i></i></label>
        <label class="toggle"><span>Sump water</span><input type="checkbox" id="puddle" checked><i></i></label>
        <label class="toggle"><span>Shadows</span><input type="checkbox" id="shadows" checked><i></i></label>
        <label class="toggle"><span>Auto-orbit</span><input type="checkbox" id="autoRotate"><i></i></label>
      </div>

    </div>
  </aside>

  <div class="rail">
    <div class="views">
      <button data-view="overview" class="on">Overview</button>
      <button data-view="rim">Rim</button>
      <button data-view="face">Face</button>
      <button data-view="top">Top</button>
    </div>
    <div class="actions">
      <button class="btn" id="export-glb" title="Export binary glTF">GLB</button>
      <button class="btn" id="export-obj" title="Export OBJ with vertex colours">OBJ</button>
      <button class="btn" id="save-png" title="Save a PNG of this view">PNG</button>
    </div>
  </div>

  <div class="stats">
    <div>benches<b id="stat-benches">–</b></div>
    <div>bench h<b id="stat-benchh">–</b></div>
    <div>chunks<b id="stat-rocks">–</b></div>
    <div>triangles<b id="stat-tris">–</b></div>
    <div>build<b id="stat-ms">–</b></div>
  </div>

  <div class="hint">
    drag to orbit · scroll to zoom · right-drag to pan<br>
    <kbd>G</kbd> generate &nbsp; <kbd>R</kbd> randomise &nbsp; <kbd>space</kbd> orbit &nbsp; <kbd>H</kbd> hide panel
  </div>
</div>

<div id="loading"><div class="box"><div class="spin"></div>Forging cliff…</div></div>
<div id="toast"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
