name: Everest C++ binaries

on:
  push:
    branches:
      - main
      - arena/0b4c5376-frontier
      - arena/a0311b9c-frontier
      - arena/4356640b-frontier
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which systems to build: all, or windows (the binary to test, without the other two)'
        required: false
        default: all
        type: choice
        options:
          - all
          - windows

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A push builds all three, except on arena/4356640b-frontier (the session that tests the Windows window: Windows alone); a manual run may ask for Windows alone
        os: ${{ fromJSON((github.event.inputs.platforms == 'windows' || github.ref_name == 'arena/4356640b-frontier') && '["windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GLFW & Vulkan runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers

      - name: Install MoltenVK & Vulkan loader (macOS)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install vulkan-loader molten-vk

      - name: Configure CMake
        run: cmake -S Frontier -B build -DCMAKE_BUILD_TYPE=Release -DFRONTIER_ENABLE_GLFW=ON

      - name: Build Everest and validation
        id: build
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 2 2>&1 | tee build.log; then
            grep -E "error |Error |ERROR|fatal |FAILED|LNK[0-9]+" build.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Run C++ & Vulkan validation
        shell: bash
        run: |
          set -o pipefail
          if ! ctest --test-dir build -C Release --output-on-failure 2>&1 | tee ctest.log; then
            grep -E "FAIL|Error|Failed|Exception" ctest.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      # The package is staged and uploaded whenever the build itself worked, so that a validation that fails on this machine does not take the binary with it
      - name: Stage standalone test package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p dist/Everest/Archive
          mkdir -p dist/Everest/EngineContent/Fonts/SunReference
          mkdir -p dist/Everest/Experimental/Fluid/Samples
          mkdir -p dist/Everest/Projects
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp build/Release/Everest.exe dist/Everest/Everest.exe
            cp build/Release/EverestWindow.exe dist/Everest/EverestWindow.exe
          else
            cp build/Everest dist/Everest/Everest
            cp build/EverestWindow dist/Everest/EverestWindow
          fi
          cp Experimental/VehicleHmiPrototype/Archive/ControlVehicleBody.facet dist/Everest/Archive/
          cp Experimental/VehicleHmiPrototype/Archive/ControlVehicleTyre.facet dist/Everest/Archive/
          cp Experimental/VehicleHmiPrototype/Archive/ControlVehicleRim.facet dist/Everest/Archive/
          cp EngineContent/Fonts/SunReference/DMSans-Light.ttf dist/Everest/EngineContent/Fonts/SunReference/
          cp EngineContent/Fonts/SunReference/DMSans-Regular.ttf dist/Everest/EngineContent/Fonts/SunReference/
          cp Experimental/Fluid/Samples/*.gasscene.toml dist/Everest/Experimental/Fluid/Samples/
          # The window reads these next to itself: the interface's fonts and icons, and the project with its levels (the Lobby it opens on)
          cp -R EngineContent/. dist/Everest/EngineContent/
          cp -R Projects/Everest dist/Everest/Projects/
          rm -rf dist/Everest/Projects/Everest/Source
          cat > dist/Everest/README.txt <<'EOF'
          Project Everest — Vulkan 1.1 C++ test build (Frontier Editor, Fluid editor, Smoke & fire editor, 3D SDF World & tyre smoke)

          Headless CLI & PPM snapshot tool:
            Everest --archive Archive --render lobby.ppm
            Everest --archive Archive --navigate proving-grounds --render proving-grounds.ppm

          Interactive Vulkan 1.1 Frontier Editor (run it from inside this folder; it reads EngineContent and Projects next to itself):
            EverestWindow                                opens the Lobby: the studio with one vehicle
            EverestWindow --proving-grounds              opens the Proving Grounds level
            EverestWindow --archive Archive --fluid-editor [--preset tactical_ordnance]
            EverestWindow --archive Archive --smoke-editor [--preset inferno]

          Performance (F2):
            F2 opens the performance window: the optimized-execution switch (off until you turn it on), the live figures, and the A/B test
            ("Run the A/B test": four runs, one to two minutes: leave the window alone). It writes PerformanceLogs/ next to the program: one TOML log per run
            and <time>_ab-report.txt. "Copy the report" puts the report on the clipboard. Send those files (or the report) to compare.
            Shift+F2 renames the selected record in the Outliner.

          Frontier Editor (3D SDF World):
            - The Outliner lists the world's records. Solvers holds the two fire and smoke solvers: Fluid Volume and Fluid Plume.
            - Fluid editor (Fluid Volume): select the record, then the Inspector's Fluid Editor button or a double-click on its row. The window
              has the Outliner of its parts, the Pyro solver's own picture, an Inspector with the settings in three tabs (Source, Simulation, Rendering), the burst tools and
              the library of 18 presets. --fluid-editor opens it; --preset takes one of the 18 identities.
            - Smoke & fire editor (Fluid Plume): the tyres' plume of the ControlVehicle. --smoke-editor opens it; --preset takes one of its looks.
            - The tyres' smoke and fire are solved on a grid fixed to the world: the grid re-centres as the car drives and the smoke stays
              where the tyres laid it.
            - Driving: WASD drive, Space handbrake, B Burnout Line-Lock, Shift boost, C cycle camera, P toggle panels.
          EOF

      - name: Upload test binaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Everest-${{ runner.os }}
          path: dist/Everest/
          if-no-files-found: error
          retention-days: 30
