<text x="84" y="670" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start">What the tails say</text>
<text x="84" y="710" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#1e3a8a" font-weight="400" text-anchor="start">Path RNG · Temporal 1: mean 0.800349 ± 0.000623; worst-5% MSE share 6.6%; half means 0.800319 / 0.800379.</text>
<text x="84" y="744" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#065f46" font-weight="400" text-anchor="start">Selection RNG · Temporal 4: mean 0.814838 ± 0.000429; worst-5% MSE share 6.3%; half means 0.814432 / 0.815243.</text>
<text x="84" y="788" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#334155" font-weight="400" text-anchor="start">Both failed cells have narrow, consistently low cohort means—not a handful of high-MSE outliers. The baseline's lower-floor temporal cells</text>
<text x="84" y="814" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#334155" font-weight="400" text-anchor="start">and Path RNG / Temporal 4 pass partly under very large rare-cohort tails. This is distribution evidence, not pixel-history provenance or proof of asymptotic bias.</text>
<text x="84" y="848" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Whiskers: ±1 cohort SE. Bars: fraction of summed cohort MSE in the largest ceil(5% × 128) cohorts. Red rings mark failed fixed mean gates.</text>
</svg>