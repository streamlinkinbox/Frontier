<text x="82" y="525" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#334155" font-weight="400">Temporal 1: mean 0.813958 ± 0.014657  |  RMSE 3.76676  |  visible/occluded sample n=65331/198  |  mean history weight visible/occluded=0.80922/9.7126e-05  |  same-seed radiance states nonzero→zero=165, zero→nonzero=17</text>
