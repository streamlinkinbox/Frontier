<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>FRONTIER · Chat</title>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2')}

/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --stage:#5c6673;
  --win:#1c1c1d; --bar:#1c1c1d;
  --bub-in:#3a3b3c; --bub-out:#0d7df2; --blue:#0a7cff; --blue-h:#2b8dff;
  --t1:#e4e6eb; --t2:#b0b3b8; --t3:#8a8d91;
  --hov:rgba(255,255,255,.06); --sel:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09); --chip:#3a3b3c; --chip-h:#4e4f50;
}
[data-theme="light"]{
  --stage:#8e99a8;
  --win:#ffffff; --bar:#ffffff;
  --bub-in:#f0f0f0; --bub-out:#0a7cff; --blue:#0a7cff; --blue-h:#0066d6;
  --t1:#050505; --t2:#65676b; --t3:#8a8d91;
  --hov:rgba(0,0,0,.05); --sel:rgba(10,124,255,.1);
  --line:rgba(0,0,0,.1); --chip:#eff1f3; --chip-h:#e2e5e9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--stage);font-family:var(--font);color:var(--t1);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .35s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-radius:6px}
@keyframes pop{from{opacity:0;transform:translateY(5px)}}
@keyframes blink{0%,80%,100%{opacity:.35;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* ============================================================
   WINDOW
   ============================================================ */
.stage{position:fixed;inset:0;display:grid;place-items:center}
.scaler{width:1000px;height:750px;transform-origin:center;display:grid;place-items:center}
.win{width:936px;height:670px;background:var(--win);border-radius:14px;overflow:hidden;position:relative;
     display:grid;grid-template-columns:218px 510px 208px;grid-template-rows:57px minmax(0,1fr);
     box-shadow:0 26px 70px -18px rgba(0,0,0,.5);transition:background .35s}

/* ---------- top bar ---------- */
.bar{grid-column:1/4;display:flex;align-items:center;background:var(--bar);transition:background .35s}
.logo{width:22px;height:22px;border-radius:50%;background:var(--blue);display:grid;place-items:center;margin-left:15px;flex:none}
.logo svg{width:13px;height:13px}
.gsearch{display:flex;align-items:center;gap:11px;margin-left:214px;flex:1;min-width:0;color:var(--t2)}
.gsearch .ic{width:15px;height:15px;stroke-width:2;flex:none}
.gsearch input{background:none;border:0;outline:0;font-size:12.5px;color:var(--t1);width:200px}
.gsearch input::placeholder{color:var(--t2)}
.bar .gear{width:28px;height:28px;border-radius:50%;background:var(--chip);color:var(--t1);display:grid;place-items:center;flex:none;transition:background .15s}
.bar .gear:hover{background:var(--chip-h)}
.bar .gear .ic{width:15px;height:15px}
.bar .me{width:28px;height:28px;margin:0 15px 0 9px;flex:none}

/* ---------- avatars ---------- */
.av{border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden;letter-spacing:.01em}
.pair{position:relative;flex:none}
.pair .av{position:absolute}
.th .pair{width:36px;height:36px}
.th .pair.one .av{position:static;width:36px;height:36px;font-size:12px}
.th .pair.two .av{width:25px;height:25px;font-size:8px}
.th .pair.two .av:nth-child(1){left:0;top:0;z-index:1}
.th .pair.two .av:nth-child(2){left:11px;top:11px;border:2px solid var(--win)}

/* ============================================================
   SIDEBAR
   ============================================================ */
.side{position:relative;display:flex;flex-direction:column;min-width:0;padding-top:18px}
.threads{flex:1;min-height:0;overflow:auto;scrollbar-width:none}
.threads::-webkit-scrollbar{display:none}
.th{display:flex;align-items:center;gap:11px;height:47px;width:100%;padding:0 12px 0 15px;text-align:left;
    border-left:3px solid transparent;transition:background .13s;position:relative}
.th:hover{background:var(--hov)}
.th.on{background:var(--sel);border-left-color:var(--blue)}
.th.on{padding-left:12px}
.tmain{flex:1;min-width:0}
.tmain b{font-size:12.5px;font-weight:600;color:var(--t1);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.tmain span{font-size:11px;color:var(--t2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;line-height:1.3}
.th.un .tmain b{font-weight:700}
.th.un .tmain span{color:var(--t1);font-weight:600}
.pres{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#31a24c;border:2px solid var(--win)}
.bdg{position:absolute;right:-3px;bottom:-2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--blue);
     color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--win)}
.fab{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;
     background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px -4px rgba(10,124,255,.6);
     transition:background .15s,transform .14s var(--ease)}
.fab:hover{background:var(--blue-h)}
.fab:active{transform:translateX(-50%) scale(.93)}
.fab .ic{width:26px;height:26px;stroke-width:2.2}
.moon{position:absolute;left:14px;bottom:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
      color:var(--t2);transition:background .15s,color .15s}
.moon:hover{background:var(--hov);color:var(--t1)}
.moon .ic{width:16px}
.tip{position:absolute;left:-4px;bottom:48px;padding:5px 11px;border-radius:7px;background:var(--chip);color:var(--t1);
     font-size:11px;font-weight:500;white-space:nowrap;box-shadow:0 4px 14px -3px rgba(0,0,0,.5);pointer-events:none}

/* ============================================================
   MAIN
   ============================================================ */
.main{display:flex;flex-direction:column;min-width:0;position:relative}
.head{height:62px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px 0 14px}
.head h1{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.stack{display:flex;align-items:center;flex:none}
.stack .av{width:26px;height:26px;font-size:9px;border:2px solid var(--win);margin-left:-8px}
.stack .av:first-child{margin-left:0}
.stack .add{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;
            margin-left:-8px;border:2px solid var(--win);transition:transform .14s var(--ease)}
.stack .add:hover{transform:scale(1.1)}
.stack .add .ic{width:13px;height:13px;stroke-width:2.6}

.msgs{flex:1;min-height:0;overflow:auto;padding:0 10px 4px;display:flex;flex-direction:column;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.msgs .pad{flex:1 0 auto}
.grp{display:flex;align-items:flex-end;gap:14px;margin-top:14px;flex:none;animation:pop .22s var(--ease)}
.grp.out{flex-direction:row-reverse}
.grp .av{width:24px;height:24px;font-size:8.5px}
.grp .av.gh{visibility:hidden}
.bcol{min-width:0;max-width:372px;display:flex;flex-direction:column;gap:4px}
.grp.out .bcol{align-items:flex-end}
.bubble{padding:10px 14px;border-radius:18px;font-size:12.5px;line-height:1.46;background:var(--bub-in);color:var(--t1);
        overflow-wrap:break-word;width:fit-content;max-width:100%}
.grp.out .bubble{background:var(--bub-out);color:#fff}
.seen{font-size:10px;color:var(--t3);margin:3px 2px 0}
.grp.out .seen{text-align:right}
.typing .bubble{display:flex;gap:4px;padding:13px 15px;align-items:center}
.typing .bubble i{width:6px;height:6px;border-radius:50%;background:var(--t2);animation:blink 1.2s infinite}
.typing .bubble i:nth-child(2){animation-delay:.2s}.typing .bubble i:nth-child(3){animation-delay:.4s}

/* ---------- composer ---------- */
.comp{flex:none;display:flex;align-items:center;gap:0;padding:0 20px 24px 14px}
.cic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--blue);flex:none;transition:background .14s,transform .13s var(--ease)}
.cic:hover{background:var(--hov)}
.cic:active{transform:scale(.9)}
.cic .ic{width:17px;height:17px}
.pill{flex:1;min-width:0;height:30px;margin:0 9px;border-radius:15px;background:var(--chip);display:flex;align-items:center;padding:0 13px;transition:background .3s}
.pill input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:12.5px}
.pill input::placeholder{color:var(--t2)}
.send{color:var(--blue)}
.send[disabled]{opacity:.45;pointer-events:none}

/* ============================================================
   RIGHT PANEL
   ============================================================ */
.right{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:auto;scrollbar-width:none;padding:0 15px}
.right::-webkit-scrollbar{display:none}
.rhero{display:flex;flex-direction:column;align-items:center;padding-top:18px;flex:none}
.rhero .pair{width:92px;height:54px;margin-bottom:11px}
.rhero .pair.solo{width:54px}
.rhero .pair.solo .av{position:static;width:54px;height:54px;font-size:17px;border:0}
.rhero .pair .av{width:54px;height:54px;font-size:17px;border:2px solid var(--win)}
.rhero .pair .av:nth-child(1){left:0}
.rhero .pair .av:nth-child(2){left:38px}
.rhero b{font-size:13px;font-weight:600;text-align:center;line-height:1.3}
.rhero small{font-size:11px;color:var(--t2);margin-top:3px}
.rbtns{display:flex;gap:6px;margin:16px 0 20px;flex:none}
.rbtn{flex:1;height:25px;border-radius:6px;background:var(--chip);display:flex;align-items:center;justify-content:center;gap:6px;
      font-size:10.5px;font-weight:600;transition:background .15s}
.rbtn:hover{background:var(--chip-h)}
.rbtn .ic{width:12px;height:12px;stroke-width:2}
.ract{display:flex;align-items:center;height:31px;font-size:11.5px;font-weight:500;color:var(--t1);width:100%;
      border-top:1px solid var(--line);transition:color .15s}
.ract:first-of-type{border-top:0}
.ract span{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ract:hover{color:var(--blue)}
.ract .ic{width:14px;height:14px;color:var(--t2)}
.ract .swatch{width:13px;height:13px;border-radius:50%;background:var(--blue)}
.rlbl{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;color:var(--t1);margin:16px 0 9px;flex:none}
.rlbl .ic{width:13px;height:13px;color:var(--t2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;flex:none}
.tile{aspect-ratio:1;border-radius:4px;overflow:hidden;position:relative;transition:transform .15s var(--ease)}
.tile:hover{transform:scale(1.07);z-index:2}
.more{display:block;width:100%;text-align:center;font-size:11px;font-weight:500;color:var(--blue);margin:11px 0 0;flex:none}
.more:hover{text-decoration:underline}
.rfoot{margin-top:auto;padding:16px 0 14px;display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--t3);flex:none}
.rfoot .ic{width:11px;height:11px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);padding:9px 15px;border-radius:9px;background:#e4e6eb;color:#111;
       font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .22s,transform .3s var(--ease);white-space:nowrap;
       box-shadow:0 12px 34px -10px rgba(0,0,0,.6);z-index:300}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{font-style:normal;opacity:.55;margin-left:8px;font-weight:500}
</style>
</head>
<body>

<div class="stage">
 <div class="scaler" id="scaler">
  <div class="win">

    <!-- ========== TOP BAR ========== -->
    <div class="bar">
      <span class="logo"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.3 2 2 6.2 2 11.8c0 3.2 1.4 6 3.7 7.8v3.8l3.4-1.9c.9.3 1.9.4 2.9.4 5.7 0 10-4.2 10-9.8S17.7 2 12 2zm1 13.2l-2.6-2.7-5 2.7 5.5-5.8 2.6 2.7 4.9-2.7-5.4 5.8z"/></svg></span>
      <label class="gsearch">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20.2 20.2l-3.6-3.6"/></svg>
        <input id="search" type="text" placeholder="Search..." spellcheck="false" autocomplete="off" />
      </label>
      <button class="gear" id="btnGear" type="button" title="Settings">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.6 14H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7.5l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.6V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.5 1.5l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      </button>
      <span class="av me" id="barMe"></span>
    </div>

    <!-- ========== SIDEBAR ========== -->
    <aside class="side">
      <div class="threads" id="threads"></div>
      <button class="fab" id="btnNew" type="button" title="New message">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <span class="tip" id="tip">Light Mode</span>
      <button class="moon" id="btnTheme" type="button"></button>
    </aside>

    <!-- ========== MAIN ========== -->
    <main class="main">
      <header class="head">
        <h1 id="title">—</h1>
        <span class="stack" id="stack"></span>
      </header>
      <div class="msgs" id="msgs"></div>
      <div class="comp">
        <button class="cic" data-c="Record a clip" type="button"><svg class="ic" viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="3"/><path d="M15.5 11l6-3.5v9l-6-3.5z"/></svg></button>
        <button class="cic" data-c="Send a photo" type="button"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="8.5" cy="10" r="1.7"/><path d="M21 15.5l-5-5-6 6"/></svg></button>
        <button class="cic" data-c="Add to chat" type="button"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button>
        <button class="cic" data-c="Attach a file" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M21 11.5l-8.8 8.8a5 5 0 0 1-7.1-7.1l9-9a3.4 3.4 0 1 1 4.8 4.8l-8.9 8.9a1.8 1.8 0 0 1-2.5-2.5l8.2-8.2"/></svg></button>
        <label class="pill"><input id="input" type="text" placeholder="Type something here..." maxlength="400" spellcheck="false" autocomplete="off" /></label>
        <button class="cic" data-c="Emoji" type="button"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><circle cx="9" cy="9.8" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="9.8" r="1.1" fill="currentColor" stroke="none"/></svg></button>
        <button class="cic send" id="btnSend" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M7 11V5.8a1.8 1.8 0 0 1 3.5-.6l1.6 4.3h5.3a2 2 0 0 1 2 2.5l-1.4 5.6a2.6 2.6 0 0 1-2.5 2H7m0-8.6V20M7 11H4.6A1.6 1.6 0 0 0 3 12.6v5.8A1.6 1.6 0 0 0 4.6 20H7"/></svg></button>
      </div>
    </main>

    <!-- ========== RIGHT PANEL ========== -->
    <aside class="right" id="right"></aside>

  </div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   HELPERS
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed = s => { let a = 0; for (const c of s) a = (a * 31 + c.charCodeAt(0)) >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const pick = (rnd, arr) => arr[Math.floor(rnd() * arr.length)];
const M = 60000, H = 3600000, D = 86400000, now = () => Date.now();
const stamp = t => new Date(t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(' ', '').toLowerCase();
const ago = t => { const s = (now() - t) / 1000; return s < 60 ? '1m' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd'; };

const ME = { display: 'Nomvula D.', initials: 'ND' };
const PAL = [['#f5577f','#b6245a'],['#1f9df5','#0b5fc4'],['#36c48e','#0e7a56'],['#f0a23b','#c25f10'],
             ['#9b6cf0','#5a2bb8'],['#4fd2d6','#128a98'],['#ff7a59','#c43c23'],['#7a8aa0','#45526b']];
const pal = n => PAL[[...String(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % PAL.length];
function avEl(n, cls = '', extra = ''){
  const [a, b] = pal(n);
  const ini = n === 'You' ? ME.initials : String(n).replace(/[^A-Z0-9]/gi, '').slice(0, 2).toUpperCase();
  return `<span class="av ${cls}" style="background:linear-gradient(145deg,${a},${b});${extra}">${esc(ini)}</span>`;
}
const pairEl = (a, b, cls = '') => `<span class="pair two ${cls}">${avEl(a)}${avEl(b)}</span>`;
const oneEl = (n, extra = '') => `<span class="pair one">${avEl(n)}${extra}</span>`;
const GR = ['linear-gradient(140deg,#ff9e4a,#e4572e)','linear-gradient(140deg,#8fd97a,#2f8f4e)','linear-gradient(140deg,#4fc3f7,#1565c0)',
  'linear-gradient(140deg,#ff7a9c,#c2185b)','linear-gradient(140deg,#f8bbd0,#e58aa8)','linear-gradient(140deg,#ef5350,#b71c1c)',
  'linear-gradient(140deg,#f48fb1,#ec407a)','linear-gradient(140deg,#e8d5c0,#c0a183)','linear-gradient(140deg,#b388ff,#6a1b9a)',
  'linear-gradient(140deg,#42a5f5,#1a3f8f)','linear-gradient(140deg,#eceff1,#b0bec5)','linear-gradient(140deg,#81c784,#2e7d32)'];

const IC = {
  phone:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>',
  vid:'<svg class="ic" viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="3"/><path d="M15.5 11l6-3.5v9l-6-3.5z"/></svg>',
  search:'<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20.2 20.2l-3.6-3.6"/></svg>',
  thumb:'<svg class="ic" viewBox="0 0 24 24"><path d="M7 11V5.8a1.8 1.8 0 0 1 3.5-.6l1.6 4.3h5.3a2 2 0 0 1 2 2.5l-1.4 5.6a2.6 2.6 0 0 1-2.5 2H7m0-8.6V20M7 11H4.6A1.6 1.6 0 0 0 3 12.6v5.8A1.6 1.6 0 0 0 4.6 20H7"/></svg>',
  img:'<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="8.5" cy="10" r="1.7"/><path d="M21 15.5l-5-5-6 6"/></svg>',
  info:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  moon:'<svg class="ic" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
  sun:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>',
};

/* ============================================================
   DATA
   ============================================================ */
const RAW = [
  { id:'req',  name:'New Message Requests', line:'From Thabo and Lerato', kind:'req', unread:6, pair:['THABO_77','LERATO.GT'] },
  { id:'setup',name:'Setup Lab', kind:'team', pair:['YUKI_N','NOVA_K'], members:['YUKI_N','NOVA_K','HALO_M','TARIQ_F'],
    sub:'4 members · active now',
    msgs:[ { who:'YUKI_N', t:-2*D, text:'Posting the Suzuka baseline. Tyre pressures are the big change.' },
           { who:'NOVA_K', t:-1.4*D, text:'Ran it for 20 laps. Rear wear is way better, front is still graining.' },
           { who:'HALO_M', t:-9*H, text:'Try one click less front camber. Fixed it for me.' },
           { who:'TARIQ_F', t:-20*M, text:'Can confirm. Night and day difference.' } ] },
  { id:'mpho', name:'MPHO.R', kind:'dm', on:true, sub:'Active now',
    msgs:[ { who:'MPHO.R', t:-8*H, text:'That livery you made is unreal. Can I run it Sunday?' },
           { who:'You', t:-7.7*H, text:'Of course. Sending the decal pack over tonight.' },
           { who:'MPHO.R', t:-20*M, text:'Perfect. See you on the grid.' } ] },
  { id:'sipho',name:'SIPHO_X', kind:'dm', sub:'Active 20m ago',
    msgs:[ { who:'SIPHO_X', t:-1*D, text:'Did you ever get that wet setup working?' },
           { who:'You', t:-1*D+20*M, text:'Mostly. Softened the rear bar and it stopped snapping on me.' },
           { who:'SIPHO_X', t:-20*M, text:'Send it through when you get a chance, I am still spinning at Spa.' } ] },
  { id:'apex', name:'Apex Racing Crew', kind:'team', pair:['SIPHO_X','YUKI_N'],
    members:['SIPHO_X','MPHO.R','YUKI_N','LERATO.GT','THABO_77','KAI.SEVEN','NOVA_K'], sub:'active now',
    msgs:[
      { who:'SIPHO_X', t:-1*D-3*H, text:'Hey, so I can buy the coach today???' },
      { who:'SIPHO_X', t:-1*D-2.9*H, text:'Right so Kyalami practice is on tonight and I need everyone there early. Bring the long run fuel setup, we are not wasting another session guessing at pressures again' },
      { who:'You', t:-1*D-2.4*H, text:'Running the long stint fuel load from the Spa weekend' },
      { who:'You', t:-1*D-2.3*H, text:'I will take sector two first and then hand it over, give me ten minutes to warm the tyres and I should have a clean reference lap for everyone' },
      { who:'YUKI_N', t:-1*D-2*H, text:'Brake ten metres later into Crowthorne and roll the entry. That is the whole trick, it is costing all of you three tenths a lap right now' },
      { who:'You', t:-20*M, text:'Copy that, trying it tonight. Tyres are up to temp and the car finally feels planted' } ] },
  { id:'yuki', name:'YUKI_N', kind:'dm', on:true, sub:'Active now',
    msgs:[ { who:'YUKI_N', t:-1*D, text:'Good drive yesterday. You were quick in the wet.' },
           { who:'You', t:-1*D+10*M, text:'Thanks. Mostly just survived it honestly.' },
           { who:'YUKI_N', t:-20*M, text:'Surviving is the skill. Most of the grid did not.' } ] },
  { id:'kya',  name:'Sprint Series · Kyalami', kind:'lobby', pair:['VOSS_R','MIRA_T'], members:['VOSS_R','IKER_9','ANDI_B','MIRA_T','RAV3N'],
    sub:'Race in progress',
    msgs:[ { who:'VOSS_R', t:-48*M, text:'Grid is set. Clean racing please, no dive bombs into T1.' },
           { who:'MIRA_T', t:-28*M, text:'All good, no damage. Race on.' },
           { who:'You', t:-20*M, text:'Front left is going off, pitting next lap.' } ] },
  { id:'open', name:'FRONTIER Open · Grid B', kind:'lobby', pair:['KAI.SEVEN','RAV3N'], members:['KAI.SEVEN','TARIQ_F','HALO_M','JUNO.B','NOVA_K','RAV3N'],
    sub:'Qualifying in 2h',
    msgs:[ { who:'KAI.SEVEN', t:-1*D, text:'Grid B entry list is locked. Twelve cars confirmed.' },
           { who:'RAV3N', t:-6*H, text:'What is the tyre rule for quali?' },
           { who:'KAI.SEVEN', t:-20*M, text:'One set, free choice. No changes between runs.' } ] },
  { id:'thabo',name:'THABO_77', kind:'dm', on:true, sub:'Active now',
    msgs:[ { who:'THABO_77', t:-3*H, text:'First to do it, that lap 6 pass was clean' },
           { who:'You', t:-20*M, text:'Trail braking finally clicked.' } ] },
  { id:'lerato',name:'LERATO.GT', kind:'dm', sub:'Active 3h ago',
    msgs:[ { who:'LERATO.GT', t:-2*D, text:'Are we running the endurance race this weekend?' },
           { who:'You', t:-2*D+30*M, text:'I can do the first two stints.' },
           { who:'LERATO.GT', t:-20*M, text:'What time does your stint start?' } ] },
];
const CHATS = RAW.filter(r => r.kind !== 'req');

/* ============================================================
   STATE
   ============================================================ */
const KEY = 'frontier.chat.v4';
let S, drafts = {};
const build = () => { const b = now(); return {
  active:'apex', theme:'dark',
  threads: CHATS.map(t => ({ id:t.id, unread:0,
    msgs:t.msgs.map((m,i) => ({ id:t.id+'-'+i, who:m.who, text:m.text, t:b+m.t })) })) }; };
function load(){
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && r.v === 4 && r.threads?.length === CHATS.length) return r; } catch {}
  return { v:4, ...build() };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ v:4, ...S })); } catch {} };
const meta = id => RAW.find(t => t.id === id);
const thread = id => S.threads.find(t => t.id === id);
const cur = () => thread(S.active);
const curMeta = () => meta(S.active);
const last = t => t.msgs[t.msgs.length - 1];
const who = m => m.kind === 'dm' ? m.name : (m.members ? m.members[0] : m.name);

/* ============================================================
   RENDER
   ============================================================ */
function renderThreads(){
  const q = $('#search').value.trim().toLowerCase();
  const rows = RAW.filter(m => {
    if (!q) return true;
    const t = thread(m.id);
    return (m.name + ' ' + (t ? (last(t)?.text || '') : m.line)).toLowerCase().includes(q);
  });

  $('#threads').innerHTML = rows.map(m => {
    if (m.kind === 'req') return `<button class="th un" data-id="req" type="button">
      <span class="pair two">${avEl(m.pair[0])}${avEl(m.pair[1])}<i class="bdg">${m.unread}</i></span>
      <span class="tmain"><b>${esc(m.name)}</b><span>${esc(m.line)}</span></span></button>`;
    const t = thread(m.id), l = last(t);
    const pre = l ? (l.who === 'You' ? 'You: ' : (m.kind === 'dm' ? '' : l.who.split(/[._]/)[0] + ': ')) + l.text : '';
    return `<button class="th ${m.id === S.active ? 'on' : ''}" data-id="${m.id}" type="button">
      ${m.pair ? pairEl(m.pair[0], m.pair[1]) : oneEl(m.name, m.on ? '<i class="pres"></i>' : '')}
      <span class="tmain"><b>${esc(m.name)}</b><span>${esc(pre.slice(0, 30))}${pre.length > 30 ? '…' : ''} · ${l ? ago(l.t) : ''}</span></span>
    </button>`;
  }).join('');
}

function renderHead(){
  const m = curMeta();
  $('#title').textContent = m.name;
  const ppl = m.kind === 'dm' ? [m.name] : (m.members || []).slice(0, 2);
  $('#stack').innerHTML = ppl.map(p => avEl(p)).join('') + `<button class="add" id="sAdd" type="button" title="Add people"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>`;
  $('#sAdd').onclick = () => toast('Invite sent', 'EOS_Lobby_SendInvite');
}

function renderMsgs(keep){
  const box = $('#msgs'), t = cur(), m = curMeta();
  let html = '<div class="pad"></div>';
  t.msgs.forEach((msg, i) => {
    const out = msg.who === 'You';
    const nx = t.msgs[i + 1];
    const lastOf = !nx || nx.who !== msg.who || (nx.t - msg.t) >= 6 * M;
    const prev = t.msgs[i - 1];
    const grp = prev && prev.who === msg.who && (msg.t - prev.t) < 6 * M;
    html += `<div class="grp ${out ? 'out' : 'in'}" style="${grp ? 'margin-top:4px' : ''}">
      <span class="av ${lastOf ? '' : 'gh'}" style="background:linear-gradient(145deg,${pal(msg.who)[0]},${pal(msg.who)[1]})">${esc(msg.who === 'You' ? ME.initials : msg.who.replace(/[^A-Z0-9]/gi, '').slice(0, 2).toUpperCase())}</span>
      <div class="bcol">
        <div class="bubble">${esc(msg.text)}</div>
        ${lastOf ? `<div class="seen">${out ? (i === t.msgs.length - 1 ? 'Message sent' : 'Message seen') : 'Message seen'} ${stamp(msg.t)}</div>` : ''}
      </div></div>`;
  });
  if (t._typing) html += `<div class="grp in typing"><span class="av" style="background:linear-gradient(145deg,${pal(t._typing)[0]},${pal(t._typing)[1]})">${esc(t._typing.replace(/[^A-Z0-9]/gi,'').slice(0,2).toUpperCase())}</span><div class="bcol"><div class="bubble"><i></i><i></i><i></i></div></div></div>`;
  const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 70;
  box.innerHTML = html;
  if (!keep || atEnd) box.scrollTop = box.scrollHeight;
}

function renderRight(){
  const m = curMeta();
  const ppl = m.kind === 'dm' ? [m.name, m.name] : (m.pair || (m.members || []).slice(0, 2));
  $('#right').innerHTML = `
    <div class="rhero">
      ${m.kind === 'dm' ? `<span class="pair solo">${avEl(m.name)}</span>` : pairEl(ppl[0], ppl[1])}
      <b>${esc(m.name)}</b>
      <small>${esc(m.sub || 'active now')}</small>
    </div>
    <div class="rbtns">
      <button class="rbtn" data-r="call" type="button">${IC.phone} Call Group</button>
      <button class="rbtn" data-r="video" type="button">${IC.vid} Video Chat</button>
    </div>
    <button class="ract" data-r="find" type="button"><span>Search in Conversation</span>${IC.search}</button>
    <button class="ract" data-r="color" type="button"><span>Change Color</span><i class="swatch"></i></button>
    <button class="ract" data-r="emoji" type="button"><span>Change Emoji</span>${IC.thumb}</button>
    <div class="rlbl">${IC.img} Shared photos</div>
    <div class="grid">${GR.map((g, i) => `<button class="tile" data-p="${i + 1}" type="button" style="background:${g}"></button>`).join('')}</div>
    <button class="more" id="rMore" type="button">View More</button>
    <div class="rfoot">${IC.info} Privacy &amp; Support</div>`;
  $('#btnTheme').innerHTML = S.theme === 'dark' ? IC.moon : IC.sun;
  $('#tip').textContent = S.theme === 'dark' ? 'Light Mode' : 'Dark Mode';
  const bm = $('#barMe'), [c1, c2] = pal('You');
  bm.style.background = `linear-gradient(145deg,${c1},${c2})`;
  bm.style.fontSize = '9.5px';
  bm.textContent = ME.initials;
}

const renderAll = () => { renderThreads(); renderHead(); renderMsgs(); renderRight(); };

/* ============================================================
   ACTIONS
   ============================================================ */
function openThread(id){
  if (id === 'req'){ toast('6 message requests'); return; }
  if (S.active === id) return;
  drafts[S.active] = $('#input').value;
  S.active = id; cur()._typing = null;
  $('#input').value = drafts[id] || ''; syncSend();
  save(); renderAll();
}
const REPLIES = {
  apex:['Copy that.','See you on the grid.','Give me ten minutes and I am in.','Good shout, trying that now.'],
  kya:['Box this lap.','Yellow in sector 3, careful.','Nice pace, keep it up.'],
  sipho:['Sharp. Thanks.','Sending mine over too.'], setup:['Trying that next session.','Pressures or camber?'],
  mpho:['Looks unreal, thank you.','Running it Sunday for sure.'], yuki:['Exactly.','Practice makes it boring.'],
  lerato:['Works for me.','I will take the night stint.'], open:['Entry list is locked.','See you in quali.'],
  thabo:['Brave is the whole setup.','Clip is uploaded.'],
};
function send(){
  const v = $('#input').value.trim(); if (!v) return;
  const t = cur();
  t.msgs.push({ id: t.id + '-u' + now(), who: 'You', text: v, t: now() });
  $('#input').value = ''; drafts[t.id] = ''; syncSend(); save(); renderMsgs(); renderThreads();
  const m = meta(t.id), r = m.kind === 'dm' ? m.name : pick(seed('r' + now()), m.members);
  clearTimeout(t._tt);
  t._tt = setTimeout(() => {
    t._typing = r; renderMsgs();
    t._tt = setTimeout(() => {
      t._typing = null;
      t.msgs.push({ id: t.id + '-r' + now(), who: r, text: pick(seed('x' + now()), REPLIES[t.id] || ['Copy that.']), t: now() });
      save(); renderMsgs(); renderThreads();
    }, 1500 + Math.random() * 800);
  }, 520 + Math.random() * 450);
}
const syncSend = () => { $('#btnSend').disabled = false; };
function toast(msg, sub){
  const t = $('#toast');
  t.innerHTML = esc(msg) + (sub ? `<i>${esc(sub)}</i>` : '');
  t.classList.add('show'); clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   EVENTS
   ============================================================ */
$('#threads').addEventListener('click', e => { const b = e.target.closest('.th'); if (b) openThread(b.dataset.id); });
$('#right').addEventListener('click', e => {
  const r = e.target.closest('[data-r]');
  if (r){ const k = r.dataset.r;
    toast(k === 'call' ? 'Starting group call…' : k === 'video' ? 'Starting video chat…' : k === 'find' ? 'Search in conversation'
      : k === 'color' ? 'Theme colour updated' : 'Quick reaction updated', k === 'call' || k === 'video' ? 'EOS_RTC_JoinRoom' : ''); return; }
  const p = e.target.closest('[data-p]'); if (p) return toast('Opening photo ' + p.dataset.p);
  if (e.target.closest('#rMore')) toast('Loading more photos…');
});
$('.comp').addEventListener('click', e => { const c = e.target.closest('[data-c]'); if (c) toast(c.dataset.c); });
$('#search').addEventListener('input', renderThreads);
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
$('#btnSend').addEventListener('click', () => { $('#input').value.trim() ? send() : toast('👍 sent'); });
$('#btnNew').addEventListener('click', () => toast('New message'));
$('#btnGear').addEventListener('click', () => toast('Settings'));
$('#btnTheme').addEventListener('click', () => {
  S.theme = S.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = S.theme;
  save(); renderRight(); renderThreads();
});
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#input') && document.activeElement !== $('#search')){ e.preventDefault(); $('#search').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#search')){ $('#search').value = ''; renderThreads(); $('#search').blur(); }
});

/* scale the 1000×750 artboard to the viewport */
function fit(){
  const s = Math.min(innerWidth / 1000, innerHeight / 750);
  $('#scaler').style.transform = `scale(${s.toFixed(4)})`;
}
addEventListener('resize', fit); fit();

/* ============================================================
   BOOT
   ============================================================ */
S = load();
if (!thread(S.active)) S.active = S.threads[0].id;
if (!S.theme) S.theme = 'dark';
document.documentElement.dataset.theme = S.theme;
renderAll(); syncSend();
</script>
</body>
</html>
