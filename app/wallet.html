<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>FRONTIER · Wallet</title>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2')}
:root{
  --blue:#1f5eff; --blue-soft:#4d80ff;
  --bg:#060607; --card:#131315; --card2:#1b1b1e; --field:#000;
  --stroke:rgba(255,255,255,.08);
  --text:#f5f5f4; --dim:#a1a1aa; --faint:#5c5c60;
  --up:#4ade80; --down:#f87171;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#020203;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(50% 36% at 50% 0%,rgba(31,94,255,.22),transparent 65%),
             radial-gradient(44% 30% at 50% 108%,rgba(94,234,212,.07),transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:8px}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}

/* phone */
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:20px}
.phone{position:relative;width:392px;max-width:100%;height:min(830px,calc(100vh - 40px));background:var(--bg);
  border-radius:52px;padding:12px;box-shadow:0 60px 120px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.1),inset 0 0 0 2px #26262b}
.screen{position:relative;width:100%;height:100%;border-radius:42px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
/* status bar */
.status{display:flex;align-items:center;justify-content:space-between;padding:16px 26px 4px;font-size:13px;font-weight:600;flex:none}
.island{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:112px;height:30px;border-radius:15px;background:#000;
  box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.sicons{display:flex;align-items:center;gap:6px}
.sicons svg{width:16px;height:16px;fill:currentColor}
/* app bar */
.appbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 2px;flex:none}
.abtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.abtn:hover{background:var(--card);color:#fff}
.addr{display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:17px;background:var(--card);
  border:1px solid var(--stroke);font-size:12.5px;font-weight:600;transition:border-color .15s}
.addr:hover{border-color:#3a3a40}
.addr i{width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:8px;font-style:normal;font-weight:800;display:grid;place-items:center}
.addr .mono{font-family:var(--mono);font-size:11.5px}
.bell{position:relative}
.bell .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px var(--bg)}
/* balance */
.bal{text-align:center;padding:14px 20px 4px;flex:none}
.bal small{font-size:12.5px;color:var(--dim)}
.bal h2{font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1.15;font-variant-numeric:tabular-nums}
.bal h2 em{font-style:normal;font-size:17px;color:var(--dim);font-weight:600}
.bal h2.bump{animation:bump .5s var(--ease)}
.bal .pct{font-size:12.5px;font-weight:600}
.bal .pct.up{color:var(--up)} .bal .pct.down{color:var(--down)}
/* pay row */
.payrow{display:flex;align-items:center;gap:6px;margin:14px 16px 4px;background:var(--card);border-radius:22px;padding:6px;flex:none}
.payrow .side{flex:1;height:44px;border-radius:16px;font-size:13px;font-weight:600;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,color .15s}
.payrow .side:hover{background:var(--card2);color:#fff}
.payrow .side .ic{width:16px;height:16px}
.fab{width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;
  box-shadow:0 10px 26px -6px rgba(31,94,255,.7);transition:transform .15s var(--ease),background .15s}
.fab:hover{background:var(--blue-soft);transform:scale(1.07)}
.fab .ic{width:22px;height:22px;stroke-width:2.5}
/* section */
.sect{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border-radius:24px 24px 0 0;margin-top:12px;flex:none;height:100%}
.sect-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 2px;flex:none}
.sect-h b{font-size:15px;font-weight:600}
.sect-h span{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.pills{display:flex;gap:8px;padding:10px 14px 4px;overflow-x:auto;scrollbar-width:none;flex:none}
.pills::-webkit-scrollbar{display:none}
.pill{height:30px;padding:0 14px;border-radius:15px;background:var(--card2);border:1px solid transparent;font-size:12px;font-weight:600;color:var(--dim);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.pill .ic{width:12px;height:12px}
.pill.on{background:var(--blue);color:#fff}
.list{flex:1;min-height:0;overflow-y:auto;padding:4px 8px 12px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 10px;border-radius:16px;cursor:pointer;
  animation:rowIn .35s var(--ease) both;animation-delay:calc(var(--i) * 30ms)}
.row:hover{background:var(--card2)}
.coin{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;font-weight:800;font-size:11px}
.coin .ic{width:20px;height:20px}
.row .t{min-width:0}
.row .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small u{text-decoration:none;color:var(--blue-soft);font-weight:600}
.num{text-align:right}
.num b{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.num small{display:block;font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--dim)}
.num small.up{color:var(--up)} .num small.down{color:var(--down)}
.buy{height:30px;padding:0 14px;border-radius:15px;background:var(--blue);color:#fff;font-size:11.5px;font-weight:700;position:relative;transition:background .15s,transform .15s var(--ease)}
.buy:hover{background:var(--blue-soft);transform:translateY(-1px)}
.buy.owned{background:var(--card2);color:var(--dim)}
.buy.owned:hover{color:#fff;transform:none}
.buy.eq{background:#fff;color:#111}
.buyrow{display:flex;align-items:center;gap:8px}
.wish{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint);flex:none}
.wish .ic{width:15px;height:15px}
.wish.on{color:#fff} .wish.on .ic{fill:#fff}
.empty{padding:40px 16px;text-align:center;color:var(--faint);font-size:12.5px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .ic{width:24px;height:24px;stroke-width:1.5}
.loading{color:transparent!important;pointer-events:none}
.loading::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border:1.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
/* tab bar */
.tabbar{flex:none;display:flex;background:rgba(19,19,21,.92);backdrop-filter:blur(14px);border-top:1px solid var(--stroke);padding:10px 8px 20px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--faint);padding:4px 0;position:relative}
.tabbar button .ic{width:21px;height:21px}
.tabbar button.on{color:#fff}
.tabbar button.on::before{content:"";position:absolute;top:-11px;width:24px;height:3px;border-radius:2px;background:var(--blue)}
/* modal sheet */
.modal{position:absolute;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:88%;overflow-y:auto;scrollbar-width:none;background:#141416;border-radius:26px 26px 0 0;border:1px solid var(--stroke);border-bottom:0;
  transform:translateY(40px);transition:transform .35s var(--ease);padding-bottom:22px}
.sheet::-webkit-scrollbar{display:none}
.modal.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#3a3a40;margin:10px auto 2px}
.sheet-h{display:flex;align-items:center;gap:11px;padding:10px 18px 12px}
.sheet-h .phi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.sheet-h .phi .ic{width:18px;height:18px}
.sheet-h b{font-size:15px;display:block}
.sheet-h span{font-size:11px;color:var(--dim)}
.sheet-h .x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--dim);flex:none}
.sheet-b{padding:2px 18px;display:flex;flex-direction:column;gap:12px}
.sheet-f{display:flex;align-items:center;gap:8px;padding:14px 18px 0}
.sheet-f .eosline{flex:1;font-size:9.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-height:40px;padding:0 16px;border-radius:20px;background:var(--card2);color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;white-space:nowrap}
.btn.primary{background:var(--blue)}
.btn.white{background:#fff;color:#111}
.btn.ghost{background:transparent;color:var(--dim)}
.btn[disabled]{opacity:.45;pointer-events:none}
.crow{display:flex;align-items:center;gap:10px}
.crow>.clabel{width:86px;flex:none;color:var(--dim);font-size:12px}
.crow>.field{flex:1}
.field{height:40px;border-radius:20px;background:var(--field);border:1px solid var(--stroke);display:flex;align-items:center;gap:8px;padding:0 14px;min-width:0}
.field:focus-within{border-color:#3a3a40}
.field.err{border-color:#fff}
.field input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:13px}
.field input::placeholder{color:var(--faint)}
.field .unit{font-size:10px;font-weight:700;color:var(--dim)}
.mono{font-family:var(--mono)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{height:28px;padding:0 11px;border-radius:14px;background:var(--card2);font-size:11px;color:var(--dim)}
.quick button.on{color:#111;background:#fff;font-weight:700}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pack{position:relative;border:1px solid var(--stroke);background:var(--card);border-radius:16px;padding:24px 12px 12px;text-align:left;min-width:0}
.pack.on{border-color:var(--blue);background:rgba(31,94,255,.12)}
.pack b{font-size:17px;font-variant-numeric:tabular-nums}
.pack small{font-size:10px;color:var(--dim);display:block;margin-top:2px}
.pack .bonus{position:absolute;top:8px;right:10px;font-size:9px;font-weight:700;color:var(--blue-soft)}
.pack .flag{position:absolute;top:8px;left:12px;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sum{display:flex;gap:8px}
.sum div{flex:1;background:var(--field);border:1px solid var(--stroke);border-radius:14px;padding:9px 10px;min-width:0}
.sum small{display:block;font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.sum b{display:block;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum span{display:block;font-size:9px;color:var(--dim);margin-top:2px}
.sum div.warn{border-color:#fff}
.desc{font-size:12px;line-height:1.5;color:var(--dim)}
.desc b{color:#fff}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{min-height:24px;padding:3px 10px;border-radius:12px;border:1px solid #3a3a40;font-size:10px;font-weight:600;color:var(--dim);display:inline-flex;align-items:center;gap:5px}
.tag .ic{width:11px;height:11px}
.tag.hi{background:#fff;border-color:transparent;color:#111}
.earnrows{display:flex;flex-direction:column}
.earnrows div{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--stroke);font-size:12px}
.earnrows div:last-child{border-bottom:0}
.earnrows .coin{width:30px;height:30px}
.earnrows .coin .ic{width:14px;height:14px}
.earnrows small{display:block;font-size:10px;color:var(--faint);margin-top:2px}
.earnrows b{font-variant-numeric:tabular-nums;white-space:nowrap}
.done{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 10px 6px;text-align:center;animation:pop .3s var(--ease)}
.done .ok{width:48px;height:48px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff}
.done .ok .ic{width:22px;height:22px;stroke-width:2.5}
.done b{font-size:16px} .done span{font-size:11.5px;color:var(--dim)}
.errmsg{font-size:11px;color:#fff;padding-left:96px;min-height:14px}
.dd{position:relative;flex:1}
.dd-btn{display:flex;align-items:stretch;height:40px;border-radius:20px;overflow:hidden;border:1px solid var(--stroke);width:100%;text-align:left}
.dd-btn .cur{flex:1;background:var(--field);display:flex;align-items:center;padding:0 14px;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-btn .caret{width:40px;background:var(--card2);display:grid;place-items:center;color:var(--dim)}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:40;background:#1c1c20;border:1px solid #3a3a40;border-radius:16px;padding:5px;display:none;flex-direction:column;gap:2px}
.open>.dd-menu{display:flex;animation:menuIn .18s var(--ease)}
.opt{padding:9px 12px;border-radius:12px;color:var(--dim);font-size:12.5px;text-align:left}
.opt.sel{color:#fff;background:#2a2a30}
/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,10px);padding:10px 16px;border-radius:12px;background:#fff;color:#111;font-size:12.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--ease);white-space:nowrap;z-index:200;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{font-style:normal;color:#666;margin-left:8px;font-size:11px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen" id="screen">
      <div class="island"></div>
      <div class="status"><span id="stime">9:41</span>
        <span class="sicons">
          <svg viewBox="0 0 24 24"><path d="M3 17h4v4H3zM10 13h4v8h-4zM17 8h4v13h-4z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M12 18a1.5 1.5 0 1 0 0 .01M8.5 14.5a5 5 0 0 1 7 0M5 11a10 10 0 0 1 14 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 28 14"><rect x="1" y="2" width="22" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="3" y="4" width="15" height="6" rx="1.5"/><rect x="24.5" y="5" width="2.5" height="4" rx="1"/></svg>
        </span>
      </div>

      <div class="appbar">
        <button class="abtn" id="btnBrand" type="button" title="FRONTIER"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
        <button class="addr" id="btnAddr" type="button" title="Copy address"><i>₵</i><span class="mono">0x7F3A…3040</span></button>
        <button class="abtn bell" id="btnBell" type="button" title="Activity"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dot"></span></button>
      </div>

      <div class="bal">
        <small>Current Balance</small>
        <h2 id="balH"><span id="balN">0</span> <em id="balC">CR</em></h2>
        <span class="pct up" id="balP">▲ 0%</span>
      </div>

      <div class="payrow">
        <button class="side" id="btnSend" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M11 17l-5-5 5-5M6 12h12"/></svg>Send</button>
        <button class="fab" id="btnFab" type="button" title="Top up"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="side" id="btnReceive" type="button">Receive<svg class="ic" viewBox="0 0 24 24"><path d="M13 7l5 5-5 5M18 12H6"/></svg></button>
      </div>

      <section class="sect">
        <div class="sect-h"><b id="sectT">My Assets</b><span id="sectC"></span></div>
        <div class="pills" id="pills"></div>
        <div class="list" id="list"></div>
      </section>

      <nav class="tabbar" id="tabbar">
        <button data-t="assets" class="on" type="button"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Assets</button>
        <button data-t="market" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Market</button>
        <button data-t="activity" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Activity</button>
        <button data-t="earn" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Earn</button>
      </nav>

      <div class="modal" id="modal" aria-hidden="true"><div class="sheet" role="dialog" id="sheet"></div></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
/* ================= UTILS ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
const usd = n => '$' + n.toFixed(2);
const ago = ms => { const m = Math.round(ms / 60000); if (m < 1) return 'Just now'; if (m < 60) return `${m} min ago`; const h = Math.round(m / 60); if (h < 24) return `${h} h ago`; const d = Math.round(h / 24); return d === 1 ? 'Yesterday' : `${d} days ago`; };
const IC = {
  chev:'<svg class="ic" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  x:'<svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>',
  star:'<svg class="ic" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>',
  sent:'<svg class="ic" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg>',
  recv:'<svg class="ic" viewBox="0 0 24 24"><path d="M17 7 7 17M16 17H7V8"/></svg>',

function marketRows(){
  let list = [...ITEMS];

  else if (p === 'movers') list = list.filter(i => i.trend >= 10).sort((a, b) => b.trend - a.trend);
  else if (p === 'rated') list.sort((a, b) => b.rating - a.rating);
  else if (p !== 'all') list = list.filter(i => i.cat === p);
  if (p !== 'movers') list.sort((a, b) => b.rating - a.rating);
  return list.map((i, k) => {
    const c = catOf(i.cat), own = owned(i.id), eq = W.equipped[i.cat] === i.id;

  },
  gift(){
    sheet.innerHTML = mhead(IC.gift, '#4d80ff', '#fff', 'Send', 'Gift CR · instant, final') + `
      <div class="sheet-b">
        <div class="crow"><div class="clabel">To</div><div class="dd" id="gFriend"></div></div>
        <div class="crow"><div class="clabel">Amount</div><label class="field"><input id="gAmt" type="number" min="50" max="${W.balance}" step="50" value="${Mx.amount}" /><span class="unit">CR</span></label></div>
        <div class="quick">${[100,250,500,1000].map(v => `<button type="button" data-v="${v}" class="${v === Mx.amount ? 'on' : ''}">${fmt(v)}</button>`).join('')}</div>
        <div class="crow"><div class="clabel">Note</div><label class="field"><input id="gMsg" type="text" maxlength="60" placeholder="gg — see you on track" /></label></div>
        <div class="sum"><div><small>After</small><b id="gAfter">${fmt(W.balance - Mx.amount)} CR</b><span>Your balance</span></div><div><small>Fee</small><b>Free</b><span>Friends transfer</span></div></div>
      </div>` + mfoot('Backend transfer · EOS_Connect', 'Send gift', 'mSend');
    dropdown($('#gFriend'), { options:FRIENDS.map(f => ({ value:f, label:f })), value:Mx.friend, onChange:v => Mx.friend = v });
    const upd = () => { const v = Math.max(0, Math.min(W.balance, +$('#gAmt').value || 0)); Mx.amount = v;
      $('#gAfter').textContent = fmt(W.balance - v) + ' CR'; $('#mSend').disabled = v < 50;
      $$('.quick button', sheet).forEach(b => b.classList.toggle('on', +b.dataset.v === v)); };
    $('#gAmt').addEventListener('input', upd);
    $$('.quick button', sheet).forEach(b => b.addEventListener('click', () => { $('#gAmt').value = b.dataset.v; upd(); }));
    $('#mSend').addEventListener('click', async e => {
      const b = e.currentTarget; b.classList.add('loading'); await wait(800);
      W.balance -= Mx.amount; W.history.unshift({ kind:'out', title:`Sent to ${Mx.friend}`, sub:$('#gMsg').value.trim() || 'Gift', amt:-Mx.amount, cur:'CR', t:Date.now() }); save();
      closeModal(); renderAll(true); toast(`Sent ${fmt(Mx.amount)} CR to ${Mx.friend}`);
    });
  },
  redeem(){
    sheet.innerHTML = mhead(IC.ticket, '#fff', '#111', 'Receive', 'Redeem a code · try FRNT-S3-WELCOME') + `
      <div class="sheet-b">
        <div class="crow"><div class="clabel">Code</div><label class="field" id="rField"><input id="rCode" class="mono" type="text" placeholder="FRNT-XXXX-XXXX" maxlength="20" spellcheck="false" /></label></div>
        <div class="errmsg" id="rErr"></div>
        <p class="desc">One redemption per account. Rewards land immediately.</p>
      </div>` + mfoot('Backend · code redemption', 'Redeem', 'mRedeem');
    const inp = $('#rCode');
    inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9-]/g, ''); $('#rField').classList.remove('err'); $('#rErr').textContent = ''; });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') $('#mRedeem').click(); });
    $('#mRedeem').addEventListener('click', async e => {
      const code = inp.value.trim(), b = e.currentTarget; if (!code) return;
      b.classList.add('loading'); await wait(700); b.classList.remove('loading');
      if (!/^FRNT-/.test(code)){ $('#rField').classList.add('err'); $('#rErr').textContent = 'Code not recognised.'; return; }
      if (W.history.some(h => h.kind === 'in' && h.sub === `Code ${code}`)){ $('#rField').classList.add('err'); $('#rErr').textContent = 'Already redeemed.'; return; }
      W.balance += 500; W.history.unshift({ kind:'in', title:'Code redeemed', sub:`Code ${code}`, amt:500, cur:'CR', t:Date.now() }); save();
      closeModal(); renderAll(true); toast('+500 CR · code redeemed');
    });
  },
  earn(){
    const rows = [
      [IC.flag, 'Finish a race', 'Per race', '+150 RP', '#2a2a2e', '#fff'],
      [IC.trophy, 'Win a race', 'P1 · any mode', '+400 RP', '#c8f04a', '#111'],
      [IC.spark, 'Clean race', 'No contact', '+50 RP', '#4d80ff', '#fff'],
      [IC.clock, 'Daily first race', 'Resets 00:00 UTC', '+100 RP', '#3a3a3e', '#fff'],
      [IC.bolt, 'Season pass', 'Tier rewards', '+1,000 CR', '#1f5eff', '#fff'],
      [IC.gift, 'Refer a friend', 'After 5 races', '+500 CR', '#123fb8', '#fff'],
    ];
    sheet.innerHTML = mhead(IC.bolt, '#1f5eff', '#fff', 'Earn', 'RP from racing · CR from pass + referrals') + `
      <div class="sheet-b"><div class="earnrows">${rows.map(([ic, t, s, v, bg, fg]) => `<div><span class="coin" style="background:${bg};color:${fg}">${ic}</span><div>${t}<small>${s}</small></div><b>${v}</b></div>`).join('')}</div></div>
      <div class="sheet-f"><span class="eosline">Stats · Achievements</span><button class="btn white" data-close type="button" style="flex:1">Close</button></div>`;
  },
  detail(){
    const i = Mx.data, c = catOf(i.cat), own = owned(i.id), short = i.price - W.balance, wish = W.wish.includes(i.id);
    const pack = PACKS.findIndex(p => p.cr >= short);
    sheet.innerHTML = mhead(IC[i.cat], c.bg, c.fg, esc(i.name), `${c.one} · ${i.rarity}`) + `
      <div class="sheet-b">
        <div class="tags"><span class="tag">${IC.star}${i.rating.toFixed(1)}</span>${i.trend >= 10 ? `<span class="tag">▲ ${i.trend}%</span>` : ''}${i.age <= 14 ? `<span class="tag hi">New</span>` : ''}<span class="tag">${c.label}</span></div>
        <p class="desc">${esc(i.sub)}. ${i.cat === 'level' ? 'Hand-built track variant — lighting, weather, leaderboards. <b>Unlocks for every race you host.</b>' : 'Purely cosmetic — <b>no performance effect</b>.'}</p>
        <div class="sum">
          <div><small>Price</small><b>${fmt(i.price)} CR</b><span>≈ ${usd(i.price * CUR.usd)}</span></div>
          <div class="${short > 0 && !own ? 'warn' : ''}"><small>${own ? 'Status' : short > 0 ? 'Short' : 'After'}</small><b>${own ? (W.equipped[i.cat] === i.id ? 'On car' : 'Owned') : short > 0 ? fmt(short) : fmt(W.balance - i.price)}</b><span>${own ? c.one : short > 0 ? 'CR needed' : 'CR left'}</span></div>
        </div>
      </div>
      <div class="sheet-f">
        <button class="wishbtn ${wish ? 'on' : ''}" id="mWish" type="button" style="width:40px;height:40px">${IC.star}</button>
        ${own ? `<button class="btn white" id="mEquip" type="button" style="flex:1">${W.equipped[i.cat] === i.id ? 'Unequip' : 'Equip'}</button>`
              : short > 0 ? `<button class="btn primary" id="mTop" type="button" style="flex:1">Top up ${pack >= 0 ? fmt(PACKS[pack].cr) : ''}</button>`
                          : `<button class="btn primary" id="mBuy" type="button" style="flex:1">Buy · ${fmt(i.price)}</button>`}
      </div>`;
    $('#mWish').addEventListener('click', e => {
      const on = W.wish.includes(i.id);
      W.wish = on ? W.wish.filter(x => x !== i.id) : [...W.wish, i.id];
      save(); e.currentTarget.classList.toggle('on', !on); renderList(); toast(on ? 'Unwatched' : 'Watching · price alerts on');
    });
    $('#mEquip')?.addEventListener('click', () => { equip(i.id); closeModal(); });
    $('#mTop')?.addEventListener('click', () => { openModal('topup'); Mx.pack = Math.max(0, pack); R.topup(); });
    $('#mBuy')?.addEventListener('click', async e => {
      const b = e.currentTarget; b.classList.add('loading'); await wait(900);
      W.balance -= i.price; W.owned.push(i.id); if (!W.equipped[i.cat]) W.equipped[i.cat] = i.id; W.wish = W.wish.filter(x => x !== i.id);
      W.history.unshift({ kind:'buy', title:i.name, sub:c.one, amt:-i.price, cur:'CR', t:Date.now() }); save();
      $('.sheet-b', sheet).innerHTML = `<div class="done"><span class="ok">${IC.check}</span><b>${esc(i.name)} is yours</b><span>Balance ${fmt(W.balance)} CR</span></div>`;
      $('.sheet-f', sheet).innerHTML = `<span class="eosline">Entitlement granted</span><button class="btn white" data-close type="button" style="flex:1">Done</button>`;
      renderAll(true); toast(`Bought ${i.name}`, `−${fmt(i.price)} CR`);
    });
  },
};

/* ================= MISC · INIT ================= */
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '');
  if (e.key === 'Escape'){ if (modal.classList.contains('open')) closeModal(); else if ($('.open')) closeDD(); else if (typing) document.activeElement.blur(); return; }
  if (typing || modal.classList.contains('open')) return;
  if (e.key === 't' || e.key === 'T') openModal('topup');
  if (e.key === 'g' || e.key === 'G') openModal('gift');
  if (e.key === 'r' || e.key === 'R') openModal('redeem');
  if (e.key === '1' || e.key === '2' || e.key === '3') switchTab(['assets', 'market', 'activity'][+e.key - 1]);
});
function toast(msg, sub){ const t = $('#toast'); t.innerHTML = esc(msg) + (sub ? `<i>${esc(sub)}</i>` : ''); t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); }
function renderAll(animate){ renderBal(animate); renderPills(); renderList(); }
$('#sectC').textContent = '';
renderAll(false);
</script>
</body>
</html>
