<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>FRONTIER · Wallet</title>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2')}

/* ============================================================
   TOKENS  (palette: blue · black · white · dark grey)
   ============================================================ */
:root{
  --blue:#1f5eff; --blue-soft:#4d80ff; --blue-deep:#1a4fe0;
  --bg:#0a0a0a; --panel:#121212; --inset:#1a1a1a; --field:#000; --raised:#222; --selected:#1c1c1c; --row:#161616;
  --stroke:rgba(255,255,255,.06); --stroke-strong:#2e2e2e;
  --text:#fff; --dim:#8a8a8a; --faint:#5c5c5c;
  --up:#4ade80; --down:#f87171;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  --shadow-pop:0 24px 60px rgba(0,0,0,.75);
  --r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--blue);font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:6px}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translate(-4%,-3%) rotate(0deg) scale(1)}to{transform:translate(5%,4%) rotate(10deg) scale(1.1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}

/* ============================================================
   STAGE / DEVICE
   ============================================================ */
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:4vh 4vw}
.device{position:relative;width:min(1180px,100%,calc((100vh - 8vh) * 1.5));aspect-ratio:4/3;border-radius:38px;background:#111;padding:14px;box-shadow:0 60px 120px -30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08),inset 0 0 0 2px #2b2b2b}
.device::before,.device::after{content:"";position:absolute;left:-3px;width:3px;height:9%;border-radius:2px 0 0 2px;background:#1b1b1b}
.device::before{top:18%}.device::after{top:31%}
.screen{position:relative;width:100%;height:100%;border-radius:26px;background:var(--bg);overflow:hidden}
.ui{position:absolute;inset:0;width:1000px;height:750px;transform-origin:0 0;transform:scale(var(--s,1));overflow:hidden;display:flex;flex-direction:column}

/* ============================================================
   HERO
   ============================================================ */
.hero{position:relative;flex:none;height:196px;background:var(--blue);padding:20px 24px 18px;display:flex;flex-direction:column}
.nav{display:flex;align-items:center;gap:14px;height:32px}
.logo{height:32px;padding:0 14px;border-radius:16px;background:#fff;color:var(--blue);font-weight:800;font-size:12px;letter-spacing:.14em;display:flex;align-items:center}
.tabs{height:32px;padding:3px;border-radius:16px;background:rgba(255,255,255,.14);display:flex;align-items:center;gap:2px;position:relative}
.tab{position:relative;height:26px;padding:0 14px;border-radius:13px;font-size:12px;font-weight:500;color:#fff;white-space:nowrap;z-index:1;transition:color .2s;display:inline-flex;align-items:center}
.tab.is-on{color:var(--blue)}
.tab-ink{position:absolute;top:3px;height:26px;border-radius:13px;background:#fff;transition:left .35s var(--ease),width .35s var(--ease)}
.hero-body{flex:1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;min-width:0}
.hero h1{font-size:72px;font-weight:400;letter-spacing:-.045em;line-height:.85;margin-bottom:-6px;white-space:nowrap}
.hero-actions{display:flex;gap:8px;align-items:center;flex:none}
.hbtn{height:32px;padding:0 6px 0 14px;border-radius:16px;background:#fff;color:#111;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:transform .2s var(--ease),box-shadow .2s;white-space:nowrap}
.hbtn i{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.hbtn i .ic{width:12px;height:12px;stroke-width:2.5}
.hbtn.ghost{background:rgba(255,255,255,.14);color:#fff;padding:0 14px}
.hbtn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.hbtn:active{transform:none}

/* ============================================================
   CONTENT
   ============================================================ */
.content{flex:1;min-height:0;display:grid;grid-template-columns:372px 1fr;gap:16px;padding:16px 24px 18px}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}

/* profile */
.profile{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--panel);border:1px solid var(--stroke);border-radius:16px;flex:none}
.dot{border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;letter-spacing:.02em}
.profile .dot{width:44px;height:44px;font-size:14px;background:#fff;color:var(--blue)}
.profile .who{min-width:0;flex:1}
.profile .who b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile .who small{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile .who small i{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:none}
.xp{height:4px;border-radius:2px;background:var(--raised);margin-top:8px;overflow:hidden}
.xp i{display:block;height:100%;width:var(--p);background:var(--blue);border-radius:2px;transition:width .8s var(--ease)}
.pstats{display:flex;gap:14px;text-align:right;flex:none}
.pstats div{display:flex;flex-direction:column;gap:3px}
.pstats small{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.pstats b{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}

/* balance card — aurora finish */
.card{position:relative;height:190px;border-radius:20px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.08);padding:16px 18px;display:flex;flex-direction:column;color:#fff;isolation:isolate;flex:none;box-shadow:0 30px 60px -30px rgba(31,94,255,.6)}
.card .glow{position:absolute;inset:-40%;z-index:-2;background:radial-gradient(40% 48% at 70% 34%,#5eead4 0%,#1f5eff 26%,rgba(26,79,224,.85) 46%,transparent 70%),radial-gradient(36% 46% at 20% 84%,rgba(77,128,255,.95),transparent 64%),radial-gradient(62% 62% at 50% 50%,#0a2a9a,transparent 76%);filter:blur(16px) saturate(1.25);animation:drift 16s ease-in-out infinite alternate}
.card .grain{position:absolute;inset:0;z-index:-1;opacity:.16;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.card-top-r{display:flex;gap:8px;align-items:center}
.card-top small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:600}
.sym{height:24px;padding:0 10px 0 6px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.14);font-size:10px;font-weight:700;letter-spacing:.08em;display:inline-flex;align-items:center;gap:6px}
.sym i{width:14px;height:14px;border-radius:50%;background:#fff;color:var(--blue);font-size:7px;font-style:normal;display:grid;place-items:center}
.card-cta{height:24px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);font-size:10.5px;font-weight:600;color:#fff;display:inline-flex;align-items:center;gap:5px;transition:background .15s,transform .15s var(--ease)}
.card-cta:hover{background:rgba(255,255,255,.3);transform:translateY(-1px)}
.card .amt{margin-top:auto;font-size:36px;font-weight:500;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
.card .amt em{font-style:normal;font-size:15px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.85)}
.card .amt.bump{animation:bump .5s var(--ease)}
.card .sub{display:flex;gap:14px;align-items:center;margin-top:9px;font-size:10.5px;color:rgba(255,255,255,.72);white-space:nowrap}
.card .sub b{color:#fff;font-weight:600}
.up{color:#fff}
.up::before{content:"▲";font-size:7px;margin-right:4px;vertical-align:1px}

/* quick actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:none}
.act{height:66px;border-radius:14px;background:var(--panel);border:1px solid var(--stroke);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:11px 12px 10px;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);transition:background .15s,color .15s,transform .15s var(--ease)}
.act .ic{width:16px;height:16px;color:#fff}
.act:hover{background:var(--inset);color:#fff;transform:translateY(-1px)}
.act:active{transform:none}

/* portfolio tiles */
.port{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.ptile{background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.ptile .h{display:flex;align-items:center;gap:7px;font-size:9.5px;color:var(--dim);font-weight:600;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptile .h i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:7px;font-weight:800;color:#fff;background:var(--blue);font-style:normal;flex:none}
.ptile .h i.rp{background:#fff;color:#111}
.ptile b{font-size:15px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ptile small{font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptile small.up{color:var(--up)}
.ptile small.down{color:var(--down)}
.note{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px}
.eos{font-size:9.5px;color:var(--faint);letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{font-size:9.5px;color:var(--faint);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.link:hover{color:#fff}

/* ============================================================
   RIGHT PANEL · store / owned / history
   ============================================================ */
.panel{background:var(--panel);border:1px solid var(--stroke);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.col>.panel{flex:1}
.ptabs{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.02);flex:none;position:relative;z-index:5}
.seg{display:flex;background:var(--field);border:1px solid var(--stroke);border-radius:var(--r-pill);padding:3px;gap:3px;height:32px}
.seg button{color:var(--dim);font-size:11.5px;font-weight:500;border-radius:var(--r-pill);padding:0 14px;transition:background .15s,color .15s;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:#fff}
.seg button.active{background:#fff;color:#111;font-weight:600}
.seg button em{font-style:normal;font-size:9px;font-weight:700;color:var(--faint)}
.seg button.active em{color:#666}
.pcount{font-size:10px;color:var(--faint);margin-left:auto;white-space:nowrap}
.pcount b{color:var(--dim);font-weight:600}
.pills{display:flex;gap:6px;padding:10px 12px 6px;overflow:auto;scrollbar-width:none;flex:none}
.pills::-webkit-scrollbar{display:none}
.pill{height:26px;padding:0 11px;border-radius:13px;background:var(--inset);border:1px solid var(--stroke);font-size:11px;font-weight:500;color:var(--dim);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:background .15s,color .15s;flex:none}
.pill .ic{width:11px;height:11px}
.pill:hover{color:#fff}
.pill.on{background:#fff;color:#111;border-color:transparent;font-weight:600}
.list{flex:1;min-height:0;overflow:auto;padding:2px 8px 8px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.item{display:grid;grid-template-columns:36px minmax(0,1fr) auto 78px;gap:12px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--stroke);animation:rowIn .35s var(--ease) both;animation-delay:calc(var(--i) * 22ms);cursor:pointer;transition:background .15s;border-radius:10px}
.item:hover{background:var(--inset)}
.item:last-child{border-bottom:0}
.ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.ico .ic{width:16px;height:16px}
.item .t{min-width:0}
.item .t b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;font-size:9.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small u{text-decoration:none;color:var(--blue-soft);font-weight:600}
.item .t small s{text-decoration:none;color:var(--faint)}
.price{text-align:right;white-space:nowrap}
.price b{display:block;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.price b.plus{color:#fff}.price b.minus{color:var(--dim)}
.price small{display:block;font-size:9.5px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
.price small.up{color:var(--up)}
.price small.down{color:var(--down)}
.buy{height:26px;padding:0 12px;border-radius:13px;background:var(--blue);color:#fff;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px;position:relative;justify-self:end;min-width:66px;white-space:nowrap;transition:background .15s,transform .15s var(--ease)}
.buy .ic{width:11px;height:11px}
.buy:hover{background:var(--blue-soft);transform:translateY(-1px)}
.buy.owned{background:transparent;border:1px solid var(--stroke-strong);color:var(--dim)}
.buy.owned:hover{color:#fff;transform:none}
.buy.eq{background:#fff;color:#111}
.buy.eq:hover{background:#e6e6e6}
.wish{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--faint);transition:color .15s,background .15s}
.wish:hover{background:var(--raised);color:#fff}
.wish.on{color:#fff}
.wish.on .ic{fill:#fff}
.empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .ic{width:22px;height:22px;stroke-width:1.5}
.loading{color:transparent!important;pointer-events:none}
.loading::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.buy.loading::after{border-color:rgba(255,255,255,.35);border-top-color:#fff}

/* ============================================================
   DROPDOWN (Slate split-caret pill)
   ============================================================ */
.dd{position:relative;flex:none}
.dd-btn{display:flex;align-items:stretch;height:32px;border-radius:var(--r-pill);overflow:hidden;border:1px solid var(--stroke);width:100%;text-align:left}
.dd-btn .cur{flex:1;background:var(--field);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-btn .caret{width:32px;background:var(--inset);border-left:1px solid var(--stroke);display:grid;place-items:center;color:var(--dim);transition:background .15s}
.dd-btn:hover .caret{background:var(--raised)}
.dd-btn .caret .ic{transition:transform .2s var(--ease)}
.open>.dd-btn .caret .ic{transform:rotate(180deg)}
.dd-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:100%;z-index:40;background:var(--field);border:1px solid var(--stroke-strong);border-radius:16px;padding:5px;display:none;flex-direction:column;gap:2px;box-shadow:var(--shadow-pop)}
.open>.dd-menu{display:flex;animation:menuIn .18s var(--ease)}
.opt{padding:7px 12px;border-radius:var(--r-pill);color:var(--dim);font-size:12px;font-weight:500;text-align:left;white-space:nowrap;transition:background .12s,color .12s}
.opt:hover{background:#141414;color:#fff}
.opt.sel{color:#fff;background:#181818}
.dd.sm .dd-btn{height:28px}.dd.sm .cur{font-size:11px}.dd.sm .caret{width:28px}

/* ============================================================
   BUTTONS / FIELDS / MODAL
   ============================================================ */
.btn{height:34px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--stroke);background:var(--inset);color:#fff;font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .12s var(--ease),color .15s;position:relative;white-space:nowrap}
.btn:hover{background:var(--raised)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);border-color:transparent;font-weight:600;box-shadow:0 8px 24px -8px rgba(31,94,255,.6)}
.btn.primary:hover{background:var(--blue-soft)}
.btn.white{background:#fff;color:#111;border-color:transparent;font-weight:600}
.btn.white:hover{background:#e6e6e6}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--inset);color:#fff}
.btn.icon{width:34px;padding:0}
.btn.sm{height:30px;width:30px}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{height:32px;border-radius:var(--r-pill);background:var(--field);border:1px solid var(--stroke);display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0;transition:border-color .15s}
.field:focus-within{border-color:var(--stroke-strong)}
.field.err{border-color:#fff}
.field .ic{color:var(--faint)}
.field input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:12px}
.field input::placeholder{color:var(--faint)}
.field .unit{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--dim)}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:0}

.modal{position:absolute;inset:0;z-index:100;display:grid;place-items:center;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.modal .panel{width:560px;transform:translateY(14px) scale(.98);transition:transform .35s var(--ease);overflow:visible;box-shadow:var(--shadow-pop)}
.modal.open .panel{transform:none}
.panel-header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.02);border-radius:20px 20px 0 0}
.ph-icon{width:28px;height:28px;border-radius:9px;background:var(--inset);border:1px solid var(--stroke);display:grid;place-items:center;color:var(--dim);flex:none}
.ph-icon.ico{border-radius:50%;width:34px;height:34px;border:0}
.ph-title{font-size:13.5px;font-weight:600}
.ph-sub{font-size:10.5px;color:var(--faint);margin-top:1px}
.spacer{flex:1}
.panel-body{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.panel-footer{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--stroke);background:rgba(255,255,255,.02);border-radius:0 0 20px 20px}
.panel-footer .eos{flex:1}
.crow{display:flex;align-items:center;gap:12px;min-height:32px}
.crow>.clabel{width:120px;flex:none;color:var(--dim);font-size:12px;font-weight:500}
.crow>.clabel small{display:block;font:500 9px/1.2 var(--mono);color:var(--faint);margin-top:2px;white-space:nowrap}
.crow>.field,.crow>.dd{flex:1}
.crow .hint{font-size:10px;color:var(--faint);flex:none}
.quick{display:flex;gap:6px}
.quick button{height:26px;padding:0 10px;border-radius:13px;background:var(--inset);border:1px solid var(--stroke);font-size:10.5px;font-weight:500;color:var(--dim);transition:background .15s,color .15s}
.quick button:hover,.quick button.on{color:#fff;background:var(--raised)}
.packs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pack{position:relative;border:1px solid var(--stroke);background:var(--inset);border-radius:14px;padding:22px 10px 10px;display:flex;flex-direction:column;gap:4px;text-align:left;transition:border-color .15s,background .15s;min-width:0}
.pack:hover{background:var(--raised)}
.pack.on{border-color:var(--blue);background:rgba(31,94,255,.12)}
.pack b{font-size:15px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pack small{font-size:9.5px;color:var(--dim)}
.pack .bonus{position:absolute;top:8px;right:9px;font-size:8.5px;font-weight:700;color:var(--blue-soft);letter-spacing:.06em}
.pack .flag{position:absolute;top:8px;left:10px;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pack.on .flag{color:#fff}
.summary{display:flex;gap:8px}
.summary div{flex:1;background:var(--field);border:1px solid var(--stroke);border-radius:14px;padding:10px 12px;min-width:0}
.summary small{display:block;font-size:8.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.summary b{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary span{display:block;font-size:9.5px;color:var(--dim);margin-top:3px}
.summary div.warn{border-color:#fff}
.summary div.warn b{color:#fff}
.desc{font-size:11.5px;line-height:1.45;color:var(--dim)}
.desc b{color:#fff;font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{height:22px;padding:0 9px;border-radius:11px;border:1px solid var(--stroke-strong);font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--dim);display:inline-flex;align-items:center;gap:5px}
.tag .ic{width:10px;height:10px}
.tag.hi{border-color:transparent;background:#fff;color:#111}
.earn{display:flex;flex-direction:column;gap:2px}
.earn div{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--stroke);font-size:11.5px}
.earn div:last-child{border-bottom:0}
.earn .ico{width:28px;height:28px}
.earn .ico .ic{width:13px;height:13px}
.earn small{display:block;font-size:9.5px;color:var(--faint);margin-top:2px}
.earn b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.done{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 10px 10px;text-align:center;animation:pop .3s var(--ease)}
.done .ok{width:44px;height:44px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff}
.done .ok .ic{width:20px;height:20px;stroke-width:2.5}
.done b{font-size:15px;font-weight:600}
.done span{font-size:11px;color:var(--dim)}
.errmsg{font-size:10.5px;color:#fff;padding-left:132px;min-height:14px}

/* ============================================================
   TOAST
   ============================================================ */
.toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,10px);padding:9px 14px;border-radius:10px;background:#fff;color:#111;font-size:11.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);white-space:nowrap;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);z-index:200}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{font-style:normal;color:#666;margin-left:8px;font-size:10.5px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}

const SORTS = [['rated','Top rated'],['trend','Trending'],['new','Newest'],['low','Price · low to high'],['high','Price · high to low']];
dropdown($('#sort'), { options: SORTS.map(([v, l]) => ({ value: v, label: l })), value: view.sort, onChange: v => { view.sort = v; renderList(); } });
$('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; view.tab = b.dataset.t; $$('#seg button').forEach(x => x.classList.toggle('active', x === b)); renderPills(); renderList(); });
function renderPills(){
  const el = $('#pills');
  if (view.tab === 'history'){ el.innerHTML = ''; el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = [['all','All'],['wish',`${IC.star}`],['new','New'],...CATS.map(c => [c.k, c.label])].map(([k, l]) => `<button class="pill ${view.cat === k ? 'on' : ''}" data-c="${k}" type="button" ${k === 'wish' ? 'title="Wishlist"' : ''}>${l}</button>`).join('');
}
$('#pills').addEventListener('click', e => { const p = e.target.closest('.pill'); if (!p) return; view.cat = p.dataset.c; renderPills(); renderList(); });

function sorted(list){
  const s = view.sort;
  return [...list].sort((a, b) => s === 'rated' ? b.rating - a.rating : s === 'trend' ? b.trend - a.trend : s === 'new' ? a.age - b.age : s === 'low' ? a.price - b.price : b.price - a.price);
}
function filtered(){
  return ITEMS.filter(i => view.cat === 'all' ? true : view.cat === 'wish' ? W.wish.includes(i.id) : view.cat === 'new' ? i.age <= 14 : i.cat === view.cat);
}
function itemRow(i, idx){
  const c = catOf(i.cat), own = owned(i.id), eq = W.equipped[i.cat] === i.id;
  const btn = view.tab === 'owned'
    ? `<button class="buy ${eq ? 'eq' : 'owned'}" type="button" data-a="equip" data-id="${i.id}">${eq ? IC.check + 'Equipped' : 'Equip'}</button>`
    : own ? `<button class="buy owned" type="button" data-a="detail" data-id="${i.id}">${IC.check}Owned</button>` : `<button class="buy" type="button" data-a="buy" data-id="${i.id}">Buy</button>`;
  const mv = i.trend >= 10 ? `<small class="up">▲ ${i.trend}% this week</small>` : i.trend < 0 ? `<small class="down">▼ ${Math.abs(i.trend)}% this week</small>` : `<small>≈ ${usd(i.price * CUR.usd)}</small>`;
  return `<div class="item" style="--i:${Math.min(idx, 14)}" data-id="${i.id}">
    <span class="ico" style="background:${c.bg};color:${c.fg}">${IC[i.cat]}</span>
    <div class="t"><b>${esc(i.name)}</b><small>${c.one} · ${i.rarity} · <s>★ ${i.rating.toFixed(1)}</s>${i.age <= 14 ? ' · <u>New</u>' : ''}${esc(i.sub) ? ' · ' + esc(i.sub) : ''}</small></div>
    <div class="price"><b>${fmt(i.price)} ${CUR.code}</b>${mv}</div>
    ${btn}
  </div>`;
}
function historyRow(h, idx){
  const plus = h.amt > 0, ic = h.kind === 'topup' ? IC.topup : h.kind === 'buy' ? IC.bag : h.kind === 'earn' ? IC.trophy : h.kind === 'out' ? IC.sent : IC.recv;
  const bg = h.kind === 'topup' ? '#1f5eff' : h.kind === 'earn' ? '#fff' : h.kind === 'out' ? '#3a3a3a' : h.kind === 'in' ? '#4d80ff' : '#2a2a2a', fg = h.kind === 'earn' ? '#111' : '#fff';
  return `<div class="item" style="--i:${Math.min(idx, 14)};cursor:default">
    <span class="ico" style="background:${bg};color:${fg}">${ic}</span>
    <div class="t"><b>${esc(h.title)}</b><small>${esc(h.sub)}${h.usd ? ` · ${usd(h.usd)}` : ''}</small></div>
    <div class="price"><b class="${plus ? 'plus' : 'minus'}">${plus ? '+' : '−'}${fmt(Math.abs(h.amt))} ${h.cur}</b><small>${ago(Date.now() - h.t)}</small></div>
    <span class="tag" style="justify-self:end">${IC.check}Confirmed</span>
  </div>`;
}
function renderList(){
  const el = $('#list'); let rows = '', count = '';
  if (view.tab === 'history'){ rows = W.history.map(historyRow).join(''); count = `<b>${W.history.length}</b> transactions`; }
  else {
    let list = filtered(); if (view.tab === 'owned') list = list.filter(i => owned(i.id));
    list = sorted(list); rows = list.map(itemRow).join('');
    count = view.tab === 'owned' ? `<b>${W.owned.length}</b> of ${ITEMS.length} owned` : `<b>${list.length}</b> items`;
    if (!list.length) rows = `<div class="empty">${IC.bag}<span>${view.tab === 'owned' ? 'Nothing owned in this category yet.' : view.cat === 'wish' ? 'Your wishlist is empty — tap ★ on an item.' : 'No items here.'}</span></div>`;
  }
  el.innerHTML = rows; $('#pcount').innerHTML = count; $('#ownedN').textContent = W.owned.length;
}
$('#list').addEventListener('click', e => {
  const b = e.target.closest('.buy'), row = e.target.closest('.item');
  if (b){ e.stopPropagation(); if (b.dataset.a === 'equip') equip(b.dataset.id); else openModal('buy', itemOf(b.dataset.id)); return; }
  if (row && row.dataset.id) openModal('buy', itemOf(row.dataset.id));
});
function equip(id){ const i = itemOf(id); if (W.equipped[i.cat] === id) delete W.equipped[i.cat]; else W.equipped[i.cat] = id; save(); renderList(); toast(W.equipped[i.cat] === id ? `${i.name} equipped` : `${i.name} unequipped`, 'EOS_PlayerDataStorage · loadout.json'); }

/* ============================================================
   DROPDOWN
   ============================================================ */
function dropdown(root, { options, value, onChange }){
  const label = v => (options.find(o => o.value === v) || { label: v }).label;
  const render = () => { root.innerHTML = `<button class="dd-btn" type="button"><span class="cur">${esc(label(value))}</span><span class="caret">${IC.chev}</span></button><div class="dd-menu">${options.map(o => `<button class="opt ${o.value === value ? 'sel' : ''}" data-v="${esc(o.value)}" type="button">${esc(o.label)}</button>`).join('')}</div>`; };
  render();
  root.addEventListener('click', e => {
    if (e.target.closest('.dd-btn')){ const open = root.classList.contains('open'); closeMenus(); root.classList.toggle('open', !open); return; }
    const o = e.target.closest('.opt'); if (!o) return; value = o.dataset.v; render(); root.classList.remove('open'); onChange?.(value);
  });
  return { get value(){ return value; } };
}
function closeMenus(){ $$('.open').forEach(x => x.classList.remove('open')); }
document.addEventListener('pointerdown', e => { if (!e.target.closest('.dd')) closeMenus(); });

/* ============================================================
   MODALS · top up · gift · redeem · earn · buy
   ============================================================ */
const modal = $('#modal'), mp = $('#mpanel');
let M = null;
function header(icon, title, sub, iconStyle){ return `<div class="panel-header"><div class="ph-icon ${iconStyle ? 'ico' : ''}" ${iconStyle ? `style="${iconStyle}"` : ''}>${icon}</div><div><div class="ph-title">${title}</div><div class="ph-sub">${sub}</div></div><div class="spacer"></div><button class="btn ghost icon sm" data-close type="button" aria-label="Close">${IC.x}</button></div>`; }
function footer(eos, primary, primaryId, extra = ''){ return `<div class="panel-footer"><span class="eos">${eos}</span>${extra}<button class="btn ghost" data-close type="button">Cancel</button>${primary ? `<button class="btn primary" id="${primaryId}" type="button">${primary}</button>` : ''}</div>`; }

function openModal(kind, data){
  M = { kind, data, pack: 2, amount: 250, friend: FRIENDS[0] };
  render[kind]();
  modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false');
  setTimeout(() => $('input', mp)?.focus(), 80);
}
function closeModal(){ modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); closeMenus(); M = null; }
modal.addEventListener('pointerdown', e => { if (e.target === modal) closeModal(); });
mp.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });

const render = {
  topup(){
    const p = PACKS[M.pack], base = Math.round(p.cr / (1 + p.bonus / 100));
    mp.innerHTML = header(IC.topup, 'Top up Credits', 'Real money → CR · processed by the Epic Games Store') + `
      <div class="panel-body">
        <div class="packs">${PACKS.map((k, i) => `<button class="pack ${i === M.pack ? 'on' : ''}" type="button" data-p="${i}">${k.flag ? `<span class="flag">${k.flag}</span>` : ''}${k.bonus ? `<span class="bonus">+${k.bonus}%</span>` : ''}<b>${fmt(k.cr)}</b><small>${CUR.code} · ${usd(k.usd)}</small></button>`).join('')}</div>
        <div class="summary">
          <div><small>You pay</small><b>${usd(p.usd)}</b><span>Epic Games Store checkout</span></div>
          <div><small>You receive</small><b>${fmt(p.cr)} ${CUR.code}</b><span>${p.bonus ? `${fmt(base)} + ${fmt(p.cr - base)} bonus` : 'No bonus on this pack'}</span></div>
          <div><small>Balance after</small><b>${fmt(W.balance + p.cr)} ${CUR.code}</b><span>≈ ${usd((W.balance + p.cr) * CUR.usd)}</span></div>
        </div>
        <p class="desc">Payment methods, taxes and receipts are handled by Epic. The game only receives an <b>entitlement</b> for the pack, redeems it once and credits your wallet.</p>
      </div>` + footer('EOS_Ecom_Checkout · EOS_Ecom_QueryEntitlements · EOS_Ecom_RedeemEntitlements', `Pay ${usd(p.usd)} with Epic`, 'mPay');
    $$('.pack', mp).forEach(b => b.addEventListener('click', () => { M.pack = +b.dataset.p; render.topup(); }));
    $('#mPay').addEventListener('click', async e => {
      const b = e.currentTarget; b.classList.add('loading'); $('.panel-footer .eos', mp).textContent = 'EOS_Ecom_Checkout · waiting for the Epic overlay…';
      await wait(1300);
      W.balance += p.cr; W.history.unshift({ kind: 'topup', title: 'Top up', sub: `${fmt(p.cr)} CR pack · Epic Games Store`, amt: p.cr, cur: 'CR', usd: p.usd, t: Date.now() }); save();
      $('.panel-body', mp).innerHTML = `<div class="done"><span class="ok">${IC.check}</span><b>${fmt(p.cr)} ${CUR.code} added</b><span>Entitlement redeemed · new balance ${fmt(W.balance)} ${CUR.code}</span></div>`;
      $('.panel-footer', mp).innerHTML = `<span class="eos">EOS_Ecom_RedeemEntitlements → EOS_Success</span><button class="btn white" data-close type="button">Done</button>`;
      renderAll(true); toast(`Top up complete · +${fmt(p.cr)} ${CUR.code}`, 'EOS_Ecom_RedeemEntitlements → EOS_Success');
    });
  },
  gift(){
    mp.innerHTML = header(IC.gift, 'Gift Credits', 'Send CR to a friend on your Epic friends list') + `
      <div class="panel-body">
        <div class="crow"><div class="clabel">Friend<small>EOS_Friends_GetFriendAtIndex</small></div><div class="dd" id="gFriend"></div></div>
        <div class="crow"><div class="clabel">Amount</div><label class="field"><input id="gAmt" type="number" min="50" max="${W.balance}" step="50" value="${M.amount}" /><span class="unit">${CUR.code}</span></label><div class="quick">${[100,250,500,1000].map(v => `<button type="button" data-v="${v}" class="${v === M.amount ? 'on' : ''}">${fmt(v)}</button>`).join('')}</div></div>
        <div class="crow"><div class="clabel">Message</div><label class="field"><input id="gMsg" type="text" maxlength="60" placeholder="gg — see you on track" /></label></div>
        <div class="summary"><div><small>Your balance after</small><b id="gAfter">${fmt(W.balance - M.amount)} ${CUR.code}</b><span>Gifts are final</span></div><div><small>Delivery</small><b>Instant</b><span>Shown in their wallet + a notification</span></div></div>
      </div>` + footer('Game backend · transfer · EOS_Connect token', 'Send gift', 'mSend');
    dropdown($('#gFriend'), { options: FRIENDS.map(f => ({ value: f, label: f })), value: M.friend, onChange: v => M.friend = v });
    const upd = () => { const v = Math.max(0, Math.min(W.balance, +$('#gAmt').value || 0)); M.amount = v; $('#gAfter').textContent = `${fmt(W.balance - v)} ${CUR.code}`; $('#mSend').disabled = v < 50; $$('.quick button', mp).forEach(b => b.classList.toggle('on', +b.dataset.v === v)); };
    $('#gAmt').addEventListener('input', upd);
    $$('.quick button', mp).forEach(b => b.addEventListener('click', () => { $('#gAmt').value = b.dataset.v; upd(); }));
    $('#mSend').addEventListener('click', async e => {
      const b = e.currentTarget; b.classList.add('loading'); await wait(800);
      const amount = M.amount, friend = M.friend, msg = $('#gMsg').value.trim();
      W.balance -= amount; W.history.unshift({ kind: 'out', title: `Gift to ${friend}`, sub: msg ? `"${msg}"` : 'Gift', amt: -amount, cur: 'CR', t: Date.now() }); save();
      closeModal(); renderAll(true); toast(`Sent ${fmt(amount)} ${CUR.code} to ${friend}`, 'Game backend · transfer confirmed');
    });
  },
  redeem(){
    mp.innerHTML = header(IC.ticket, 'Redeem a code', 'Promo, creator or event codes · try FRNT-S3-WELCOME') + `
      <div class="panel-body">
        <div class="crow"><div class="clabel">Code</div><label class="field" id="rField"><input id="rCode" class="mono" type="text" placeholder="FRNT-XXXX-XXXX" maxlength="20" spellcheck="false" autocapitalize="characters" /></label></div>
        <div class="errmsg" id="rErr"></div>
        <p class="desc">Codes are validated server-side and can only be redeemed once per Epic account. Rewards land in your wallet immediately.</p>
      </div>` + footer('Game backend · code redemption · EOS_Connect ProductUserId', 'Redeem', 'mRedeem');
    const inp = $('#rCode');
    inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9-]/g, ''); $('#rField').classList.remove('err'); $('#rErr').textContent = ''; });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') $('#mRedeem').click(); });
    $('#mRedeem').addEventListener('click', async e => {
      const code = inp.value.trim(), b = e.currentTarget; if (!code) return;
      b.classList.add('loading'); await wait(700); b.classList.remove('loading');
      if (!/^FRNT-/.test(code)){ $('#rField').classList.add('err'); $('#rErr').textContent = 'Code not recognised — check the letters and dashes.'; return; }
      if (W.history.some(h => h.kind === 'in' && h.sub === `Code ${code}`)){ $('#rField').classList.add('err'); $('#rErr').textContent = 'This code has already been redeemed on your account.'; return; }
      const amt = 500; W.balance += amt; W.history.unshift({ kind: 'in', title: 'Code redeemed', sub: `Code ${code}`, amt, cur: 'CR', t: Date.now() }); save();
      closeModal(); renderAll(true); toast(`Code redeemed · +${fmt(amt)} ${CUR.code}`);
    });
  },
  earn(){
    const rows = [
      [IC.flag, 'Finish a race', 'Any online lobby · once per race', '+150 RP', '#2a2a2a', '#fff'],
      [IC.trophy, 'Win a race', 'P1 in a ranked or casual lobby', '+400 RP', '#fff', '#111'],
      [IC.spark, 'Clean race bonus', 'No contact, no track limits', '+50 RP', '#4d80ff', '#fff'],
      [IC.clock, 'Daily first race', 'Resets 00:00 UTC', '+100 RP', '#3a3a3a', '#fff'],
      [IC.bolt, 'Season pass · tiers 10 / 20 / 30', `${ME.season} · next CR reward at tier 20`, `+1,000 ${CUR.code}`, '#1f5eff', '#fff'],
      [IC.gift, 'Refer a friend', 'When they finish their first 5 races', `+500 ${CUR.code}`, '#123fb8', '#fff'],
    ];
    mp.innerHTML = header(IC.bolt, 'Ways to earn', `${RP.name} come from racing · ${CUR.name} from the season pass and referrals`) + `
      <div class="panel-body"><div class="earn">${rows.map(([ic, t, s, v, bg, fg]) => `<div><span class="ico" style="background:${bg};color:${fg}">${ic}</span><div>${t}<small>${s}</small></div><b>${v}</b></div>`).join('')}</div></div>
      <div class="panel-footer"><span class="eos">EOS_Stats_IngestStat · EOS_Achievements_UnlockAchievements</span><button class="btn ghost" data-close type="button">Close</button><a class="btn primary" href="lobby.html">Go race</a></div>`;
  },
  buy(){
    const i = M.data, c = catOf(i.cat), own = owned(i.id), short = i.price - W.balance, wish = W.wish.includes(i.id);
    const pack = PACKS.findIndex(p => p.cr >= short);
    mp.innerHTML = header(IC[i.cat], esc(i.name), `${c.one} · ${i.rarity}`, `background:${c.bg};color:${c.fg}`) + `
      <div class="panel-body">
        <div class="tags"><span class="tag">${IC.star}${i.rating.toFixed(1)}</span>${i.trend >= 10 ? `<span class="tag">▲ ${i.trend}% this week</span>` : ''}${i.age <= 14 ? `<span class="tag hi">New</span>` : ''}<span class="tag">${c.label}</span>${i.cat === 'level' ? `<span class="tag">Premium designed level</span>` : `<span class="tag">Applies to GT-X · GT-X R</span>`}</div>
        <p class="desc">${esc(i.sub)}. ${i.cat === 'level' ? 'A hand-built track variant with its own lighting, weather and leaderboards. <b>Unlocks for every lobby you host</b> — drivers who join do not need to own it.' : `Purely cosmetic — <b>no effect on performance</b>. Equip it from the Owned tab or in the Garage.`}</p>
        <div class="summary">
          <div><small>Price</small><b>${fmt(i.price)} ${CUR.code}</b><span>≈ ${usd(i.price * CUR.usd)}</span></div>
          <div class="${short > 0 && !own ? 'warn' : ''}"><small>${own ? 'Status' : short > 0 ? 'Short by' : 'Balance after'}</small><b>${own ? 'Owned' : short > 0 ? `${fmt(short)} ${CUR.code}` : `${fmt(W.balance - i.price)} ${CUR.code}`}</b><span>${own ? (W.equipped[i.cat] === i.id ? 'Equipped' : 'Not equipped') : short > 0 ? `You have ${fmt(W.balance)} ${CUR.code}` : `≈ ${usd((W.balance - i.price) * CUR.usd)}`}</span></div>
        </div>
      </div>
      <div class="panel-footer">
        <span class="eos">${own ? 'EOS_PlayerDataStorage · loadout.json' : 'Game backend · debit CR · grant item · EOS_Connect token'}</span>
        <button class="btn icon wish ${wish ? 'on' : ''}" id="mWish" type="button" title="Wishlist" style="width:34px;height:34px">${IC.star}</button>
        <button class="btn ghost" data-close type="button">Cancel</button>
        ${own ? `<button class="btn white" id="mEquip" type="button">${W.equipped[i.cat] === i.id ? 'Unequip' : 'Equip'}</button>` : short > 0 ? `<button class="btn primary" id="mTop" type="button">Top up ${pack >= 0 ? fmt(PACKS[pack].cr) + ' ' + CUR.code : ''}</button>` : `<button class="btn primary" id="mBuy" type="button">Buy for ${fmt(i.price)} ${CUR.code}</button>`}
      </div>`;
    $('#mWish').addEventListener('click', e => { const on = W.wish.includes(i.id); W.wish = on ? W.wish.filter(x => x !== i.id) : [...W.wish, i.id]; save(); e.currentTarget.classList.toggle('on', !on); if (view.cat === 'wish') renderList(); toast(on ? 'Removed from wishlist' : 'Added to wishlist'); });
    $('#mEquip')?.addEventListener('click', () => { equip(i.id); closeModal(); });
    $('#mTop')?.addEventListener('click', () => { openModal('topup'); M.pack = Math.max(0, pack); render.topup(); });
    $('#mBuy')?.addEventListener('click', async e => {
      const b = e.currentTarget; b.classList.add('loading'); $('.panel-footer .eos', mp).textContent = 'Backend · reserving item · verifying balance…';
      await wait(900);
      W.balance -= i.price; W.owned.push(i.id); if (!W.equipped[i.cat]) W.equipped[i.cat] = i.id; W.wish = W.wish.filter(x => x !== i.id);
      W.history.unshift({ kind: 'buy', title: i.name, sub: `${c.one}${i.cat === 'level' ? '' : ' · ' + i.sub.split(' · ')[0].toLowerCase()}`, amt: -i.price, cur: 'CR', t: Date.now() }); save();
      $('.panel-body', mp).innerHTML = `<div class="done"><span class="ok">${IC.check}</span><b>${esc(i.name)} is yours</b><span>${W.equipped[i.cat] === i.id ? 'Equipped automatically' : 'Find it in the Owned tab'} · balance ${fmt(W.balance)} ${CUR.code}</span></div>`;
      $('.panel-footer', mp).innerHTML = `<span class="eos">Purchase confirmed · entitlement granted</span><button class="btn white" data-close type="button">Done</button>`;
      renderAll(true); toast(`Bought ${i.name}`, `−${fmt(i.price)} ${CUR.code}`);
    });
  },
};

/* ============================================================
   KEYBOARD · TOAST · INIT
   ============================================================ */
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '');
  if (e.key === 'Escape'){ if (modal.classList.contains('open')) closeModal(); else if ($('.open')) closeMenus(); else if (typing) document.activeElement.blur(); return; }
  if (typing || modal.classList.contains('open')) return;
  if (e.key === 't' || e.key === 'T') openModal('topup');
  if (e.key === 'g' || e.key === 'G') openModal('gift');
  if (e.key === 'r' || e.key === 'R') openModal('redeem');
  if (e.key === '1' || e.key === '2' || e.key === '3') $$('#seg button')[+e.key - 1].click();
});
function toast(msg, sub){ const t = $('#toast'); t.innerHTML = esc(msg) + (sub ? `<i>${esc(sub)}</i>` : ''); t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); }
function renderAll(animate){ renderProfile(); renderCard(animate); renderActions(); renderPort(); renderPills(); renderList(); }
renderAll(false);
</script>
</body>
</html>
