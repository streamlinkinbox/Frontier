<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>FRONTIER · Wallet</title>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2')}
:root{
  --blue:#1f5eff; --blue-soft:#4d80ff;
  --bg:#0a0a0a; --panel:#121212; --inset:#1a1a1a; --field:#000; --raised:#232323;
  --stroke:rgba(255,255,255,.07); --stroke-strong:#2e2e2e;
  --text:#fff; --dim:#8a8a8a; --faint:#5c5c5c;
  --up:#4ade80; --down:#f87171;
  --oct:#f59e0b; --ntr:#38bdf8;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  --r:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--blue);font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:6px}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translate(-4%,-3%) rotate(0deg) scale(1)}to{transform:translate(5%,4%) rotate(10deg) scale(1.1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}

/* tablet device backdrop */
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:4vh 4vw}
.device{position:relative;width:min(1180px,100%,calc((100vh - 8vh) * 1.5));aspect-ratio:4/3;border-radius:38px;background:#111;padding:14px;box-shadow:0 60px 120px -30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08),inset 0 0 0 2px #2b2b2b}
.device::before,.device::after{content:"";position:absolute;left:-3px;width:3px;height:9%;border-radius:2px 0 0 2px;background:#1b1b1b}
.device::before{top:18%}.device::after{top:31%}
.screen{position:relative;width:100%;height:100%;border-radius:26px;background:var(--bg);overflow:hidden}
.ui{position:absolute;inset:0;width:1000px;height:750px;transform-origin:0 0;transform:scale(var(--s,1));overflow:hidden;display:flex;flex-direction:column;padding:22px 24px 18px;gap:14px}

/* header */
.head{display:flex;align-items:flex-end;justify-content:space-between;flex:none}
.head h1{font-size:34px;font-weight:600;letter-spacing:-.03em}
.head h1 em{font-style:normal;color:var(--oct)}
.head p{font-size:12px;color:var(--dim);margin-top:3px}
.head-r{display:flex;align-items:center;gap:8px}
.addr{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:18px;background:var(--panel);border:1px solid var(--stroke);font-size:12.5px;font-weight:600}
.addr:hover{border-color:var(--stroke-strong)}
.addr i{width:18px;height:18px;border-radius:50%;background:var(--oct);color:#111;font-size:8px;font-style:normal;font-weight:800;display:grid;place-items:center}
.addr .mono{font-family:var(--mono);font-size:11.5px}
.ibtn{width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--stroke);display:grid;place-items:center;color:var(--dim);position:relative}
.ibtn:hover{color:#fff;border-color:var(--stroke-strong)}
.ibtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.topup-pill{height:36px;padding:0 18px;border-radius:18px;background:var(--blue);color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 24px -8px rgba(31,94,255,.7);transition:transform .15s var(--ease),background .15s}
.topup-pill:hover{background:var(--blue-soft);transform:translateY(-1px)}

/* body */
.body{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr;gap:14px}
.col{min-height:0;display:flex;flex-direction:column;gap:12px}

/* aurora card */
.card{position:relative;border-radius:22px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.09);
  padding:20px;min-height:236px;display:flex;flex-direction:column;isolation:isolate;flex:none;
  box-shadow:0 30px 60px -30px rgba(31,94,255,.65)}
.card .glow{position:absolute;inset:-45%;z-index:-2;
  background:radial-gradient(42% 50% at 72% 32%,#5eead4 0%,#1f5eff 26%,rgba(26,79,224,.85) 46%,transparent 70%),
             radial-gradient(38% 48% at 18% 86%,rgba(77,128,255,.95),transparent 64%),
             radial-gradient(64% 64% at 50% 50%,#0a2a9a,transparent 76%);
  filter:blur(18px) saturate(1.3);animation:drift 16s ease-in-out infinite alternate}
.card .grain{position:absolute;inset:0;z-index:-1;opacity:.16;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.5))}
.card .dots{display:flex;align-items:center}
.card .dots i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.9)}
.card .dots i+i{background:rgba(255,255,255,.35);margin-left:-13px}
.card .bal{margin-top:auto}
.card .bal small{display:block;font-size:11px;color:rgba(255,255,255,.75);margin-bottom:5px}
.card .bal h2{font-size:46px;font-weight:500;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.card .bal h2 em{font-style:normal;font-size:19px;color:rgba(255,255,255,.65)}
.card .bal h2.bump{animation:bump .5s var(--ease)}
.card .bal .pct{display:inline-block;font-size:12px;font-weight:700;margin-top:6px}
.card .bal .pct.up{color:var(--up)} .card .bal .pct.down{color:var(--down)}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:rgba(255,255,255,.75)}
.card .foot .mono{font-family:var(--mono);letter-spacing:.12em}

/* send / + / receive */
.payrow{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--stroke);border-radius:20px;padding:8px;gap:8px;flex:none}
.payrow button.side{flex:1;border-radius:14px;font-size:12.5px;font-weight:600;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,color .15s}
.payrow button.side:hover{background:var(--inset);color:#fff}
.payrow button.side .ic{width:15px;height:15px}
.fab{width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 10px 26px -8px rgba(31,94,255,.8);transition:transform .15s var(--ease),background .15s}
.fab:hover{background:var(--blue-soft);transform:scale(1.06)}
.fab .ic{width:20px;height:20px;stroke-width:2.5}

/* holdings */
.holdings{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.hold{background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:12px 14px;min-width:0}
.hold .h{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--dim);text-transform:uppercase}
.hold .h i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.hold .h i .ic{width:11px;height:11px;stroke-width:2.4}
.hold b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.hold small{display:block;font-size:10px;margin-top:3px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hold small.up{color:var(--up)} .hold small.down{color:var(--down)}
.note{margin-top:auto;font-size:9.5px;color:var(--faint);display:flex;justify-content:space-between;gap:8px;padding:0 4px}
.note button{color:var(--faint);text-decoration:underline;text-underline-offset:3px;font-size:9.5px}
.note button:hover{color:#fff}

/* right panel */
.panel{background:var(--panel);border:1px solid var(--stroke);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;min-height:0;flex:1;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03)}
.segbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.02);flex:none}
.seg{display:flex;background:var(--field);border:1px solid var(--stroke);border-radius:var(--r);padding:3px;gap:3px;height:32px}
.seg button{color:var(--dim);font-size:11.5px;font-weight:500;border-radius:var(--r);padding:0 14px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.seg button:hover{color:#fff}
.seg button.active{background:#fff;color:#111;font-weight:600}
.pcount{font-size:10px;color:var(--faint);margin-left:auto;white-space:nowrap}
.pcount b{color:var(--dim)}
.earnbtn{height:30px;padding:0 14px;border-radius:15px;background:var(--blue);color:#fff;font-size:11.5px;font-weight:700;flex:none}
.earnbtn:hover{background:var(--blue-soft)}
.pills{display:flex;gap:6px;padding:10px 12px 6px;overflow:auto;scrollbar-width:none;flex:none}
.pills::-webkit-scrollbar{display:none}
.pill{height:26px;padding:0 11px;border-radius:13px;background:var(--inset);border:1px solid var(--stroke);font-size:11px;font-weight:500;color:var(--dim);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;flex:none;transition:background .15s,color .15s}
.pill .ic{width:11px;height:11px}
.pill:hover{color:#fff}
.pill.on{background:var(--blue);border-color:transparent;color:#fff;font-weight:700}
.list{flex:1;min-height:0;overflow:auto;padding:2px 8px 10px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto 78px;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--stroke);border-radius:10px;cursor:pointer;transition:background .15s;animation:rowIn .35s var(--ease) both;animation-delay:calc(var(--i) * 22ms)}
.row:hover{background:var(--inset)}
.row:last-child{border-bottom:0}
.coin{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.coin .ic{width:19px;height:19px;stroke-width:1.9}
.row .t{min-width:0}
.row .t b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:9.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small u{text-decoration:none;color:var(--blue-soft);font-weight:600}
.num{text-align:right;white-space:nowrap}
.num b{display:block;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.num small{display:block;font-size:9.5px;margin-top:3px;color:var(--dim);font-variant-numeric:tabular-nums}
.num small.up{color:var(--up)} .num small.down{color:var(--down)}
.buy{height:28px;padding:0 12px;border-radius:14px;background:var(--blue);color:#fff;font-size:10.5px;font-weight:600;justify-self:end;min-width:70px;position:relative;white-space:nowrap;transition:background .15s,transform .15s var(--ease)}
.buy:hover{background:var(--blue-soft);transform:translateY(-1px)}
.buy.owned{background:transparent;border:1px solid var(--stroke-strong);color:var(--dim)}
.buy.owned:hover{color:#fff;transform:none}
.buy.eq{background:#fff;color:#111}
.wish{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--faint);flex:none}
.wish .ic{width:14px;height:14px}
.wish:hover{color:#fff;background:var(--raised)}
.wish.on{color:#fff} .wish.on .ic{fill:#fff}
.buyrow{display:flex;align-items:center;gap:6px;justify-self:end}
.tagok{justify-self:end;font-size:10px;color:var(--dim);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tagok .ic{width:11px;height:11px}
.empty{padding:44px 20px;text-align:center;color:var(--faint);font-size:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .ic{width:22px;height:22px;stroke-width:1.5}
.loading{color:transparent!important;pointer-events:none}
.loading::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}

/* modal */
.modal{position:absolute;inset:0;z-index:100;display:grid;place-items:center;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.sheet{width:560px;max-height:94%;overflow-y:auto;scrollbar-width:none;background:var(--panel);border:1px solid var(--stroke-strong);border-radius:20px;transform:translateY(14px) scale(.98);transition:transform .35s var(--ease);box-shadow:0 24px 60px rgba(0,0,0,.75)}
.sheet::-webkit-scrollbar{display:none}
.modal.open .sheet{transform:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.02)}
.sheet-h .phi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.sheet-h b{font-size:13.5px;font-weight:600;display:block}
.sheet-h span{font-size:10.5px;color:var(--faint)}
.sheet-h .x{margin-left:auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--dim);flex:none}
.sheet-h .x:hover{background:var(--inset);color:#fff}
.sheet-b{padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.sheet-f{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--stroke);background:rgba(255,255,255,.02)}
.sheet-f .eosline{flex:1;font-size:9.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{height:34px;padding:0 16px;border-radius:var(--r);border:1px solid var(--stroke);background:var(--inset);color:#fff;font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;white-space:nowrap;transition:background .15s,transform .12s var(--ease)}
.btn:hover{background:var(--raised)} .btn:active{transform:scale(.97)}
.btn.primary{background:#fff;border-color:transparent;color:#111;font-weight:700}
.btn.blue{background:var(--blue);border-color:transparent;font-weight:600}
.btn.blue:hover{background:var(--blue-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--inset);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.crow{display:flex;align-items:center;gap:12px;min-height:32px}
.crow>.clabel{width:110px;flex:none;color:var(--dim);font-size:12px;font-weight:500}
.crow>.clabel small{display:block;font:500 9px/1.2 var(--mono);color:var(--faint);margin-top:2px}
.crow>.field,.crow>.dd{flex:1}
.field{height:32px;border-radius:var(--r);background:var(--field);border:1px solid var(--stroke);display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0;transition:border-color .15s}
.field:focus-within{border-color:var(--stroke-strong)}
.field.err{border-color:#fff}
.field input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:12px}
.field input::placeholder{color:var(--faint)}
.field .unit{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--dim)}
.mono{font-family:var(--mono)}
.packs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pack{position:relative;border:1px solid var(--stroke);background:var(--inset);border-radius:14px;padding:22px 10px 10px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0;transition:border-color .15s,background .15s}
.pack:hover{background:var(--raised)}
.pack.on{border-color:var(--oct);background:rgba(245,158,11,.1)}
.pack b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.pack small{font-size:9.5px;color:var(--dim)}
.pack .bonus{position:absolute;top:8px;right:9px;font-size:8.5px;font-weight:700;color:var(--oct)}
.pack .flag{position:absolute;top:8px;left:10px;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sum{display:flex;gap:8px}
.sum div{flex:1;background:var(--field);border:1px solid var(--stroke);border-radius:14px;padding:10px 12px;min-width:0}
.sum small{display:block;font-size:8.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.sum b{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum span{display:block;font-size:9.5px;color:var(--dim);margin-top:3px}
.sum div.warn{border-color:#fff}
.desc{font-size:11.5px;line-height:1.45;color:var(--dim)}
.desc b{color:#fff}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{height:22px;padding:0 9px;border-radius:11px;border:1px solid var(--stroke-strong);font-size:9.5px;font-weight:600;color:var(--dim);display:inline-flex;align-items:center;gap:5px}
.tag .ic{width:10px;height:10px}
.tag.hi{background:#fff;border-color:transparent;color:#111}
.earnrows{display:flex;flex-direction:column}
.earnrows div{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--stroke);font-size:11.5px}
.earnrows div:last-child{border-bottom:0}
.earnrows .coin{width:28px;height:28px}
.earnrows .coin .ic{width:14px;height:14px}
.earnrows small{display:block;font-size:9.5px;color:var(--faint);margin-top:2px}
.earnrows b{font-variant-numeric:tabular-nums;white-space:nowrap}
.done{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 10px 10px;text-align:center;animation:pop .3s var(--ease)}
.done .ok{width:44px;height:44px;border-radius:50%;background:var(--up);color:#06130b;display:grid;place-items:center}
.done .ok .ic{width:20px;height:20px;stroke-width:2.5}
.done b{font-size:15px} .done span{font-size:11px;color:var(--dim)}
.errmsg{font-size:10.5px;color:#fff;padding-left:122px;min-height:14px}
.wishbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--stroke);display:grid;place-items:center;color:var(--faint);flex:none}
.wishbtn:hover{color:#fff;background:var(--raised)}
.wishbtn.on{color:#fff} .wishbtn.on .ic{fill:#fff}
.dd{position:relative;flex:none}
.dd-btn{display:flex;align-items:stretch;height:32px;border-radius:var(--r);overflow:hidden;border:1px solid var(--stroke);width:100%;text-align:left}
.dd-btn .cur{flex:1;background:var(--field);display:flex;align-items:center;padding:0 12px;font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-btn .caret{width:32px;background:var(--inset);border-left:1px solid var(--stroke);display:grid;place-items:center;color:var(--dim)}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;z-index:40;background:var(--field);border:1px solid var(--stroke-strong);border-radius:16px;padding:5px;display:none;flex-direction:column;gap:2px;box-shadow:0 24px 60px rgba(0,0,0,.75)}
.open>.dd-menu{display:flex;animation:menuIn .18s var(--ease)}
.opt{padding:7px 12px;border-radius:var(--r);color:var(--dim);font-size:12px;text-align:left;white-space:nowrap}
.opt:hover{background:#141414;color:#fff}
.opt.sel{color:#fff;background:#181818}

/* ---- send flow: keypad ---- */
.sendto{display:flex;align-items:center;gap:12px}
.sendto .clabel{width:110px;flex:none;color:var(--dim);font-size:12px}
.sendto .dd{flex:1}
.assetrow{display:flex;align-items:center;gap:10px;background:var(--field);border:1px solid var(--stroke);border-radius:16px;padding:10px 12px}
.assetrow .coin{width:34px;height:34px}
.assetrow .coin .ic{width:17px;height:17px}
.assetrow b{font-size:13px;display:block}
.assetrow small{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.assetrow .max{margin-left:auto;height:28px;padding:0 14px;border-radius:14px;background:var(--inset);border:1px solid var(--stroke);font-size:11px;font-weight:700}
.assetrow .max:hover{color:#111;background:#fff;border-color:transparent}
.bigamt{text-align:center;padding:6px 0 0}

.kv small{color:var(--dim)}

.kv .who{display:inline-flex;align-items:center;gap:7px}

.bigbtn{width:100%;height:46px;border-radius:23px;background:#fff;color:#111;font-size:14px;font-weight:700;transition:transform .12s var(--ease)}
.bigbtn:hover{transform:translateY(-1px)}

.bigbtn[disabled]{opacity:.35;pointer-events:none}

.toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,10px);padding:9px 14px;border-radius:10px;background:#fff;color:#111;font-size:11.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);white-space:nowrap;z-index:200}

  el.style.display = '';
  el.innerHTML = [...MPILLS, ...CATS.map(c => [c.k, c.label])].map(([k, l]) =>
    `<button class="pill ${view.pill === k ? 'on' : ''}" data-p="${k}" type="button">${l === '★' ? IC.star : esc(l)}</button>`).join('');
}
$('#pills').addEventListener('click', e => { const p = e.target.closest('.pill'); if (!p) return; view.pill = p.dataset.p; renderPills(); renderList(); });
function marketList(){
  let list = [...ITEMS];
  const p = view.pill;
  if (p === 'wish') list = list.filter(i => W.wish.includes(i.id));
  else if (p === 'movers') list = list.filter(i => i.trend >= 10).sort((a, b) => b.trend - a.trend);
  else if (p === 'rated') list.sort((a, b) => b.rating - a.rating);
  else if (p !== 'all') list = list.filter(i => i.cat === p);
  if (p !== 'movers') list.sort((a, b) => b.rating - a.rating);
  return list;
}
function crow({ coin, bg, fg, name, sub, value, trend, id, idx, right }){
  return `<div class="row" style="--i:${Math.min(idx, 14)}" ${id ? `data-id="${id}"` : 'style="cursor:default"'}>
    <span class="coin" style="background:${bg};color:${fg}">${coin}</span>
    <div class="t"><b>${name}</b><small>${sub}</small></div>
    <div class="num"><b>${value}</b>${trend || ''}</div>
    ${right || '<span></span>'}
  </div>`;
}
function renderList(){
  const el = $('#list'); let rows = [];
  if (view.tab === 'assets'){
    const ntrW = W.history.filter(h => h.cur === 'NTR' && Date.now() - h.t < 7 * D).reduce((a, h) => a + h.amt, 0);
    const e = weekEarned(), pct = W.balance ? Math.round(e / W.balance * 100) : 0;
    rows.push(crow({ coin:IC.octane, bg:'var(--oct)', fg:'#111', name:'Octane', sub:'OCT · premium · real money in', value:fmt(W.balance), trend:mover(pct), idx:0 }));
    rows.push(crow({ coin:IC.nitro, bg:'var(--ntr)', fg:'#06283a', name:'Nitro', sub:`NTR · earned racing · +${fmt(ntrW)} wk`, value:fmt(W.rp), trend:'<small>not purchasable</small>', idx:1 }));
    W.owned.map(itemOf).filter(Boolean).forEach((i, k) => {
      const c = catOf(i.cat), eq = W.equipped[i.cat] === i.id;
      rows.push(crow({ coin:IC[i.cat], bg:c.bg, fg:c.fg, id:i.id, name:esc(i.name),
        sub:`${c.one} · ${i.rarity}${eq ? ' · <u>Equipped</u>' : ''}`, value:`${fmt(i.price)} ${CUR.code}`, trend:mover(i.trend), idx:k + 2,
        right: eq ? `<span class="tagok">${IC.check}On car</span>` : `<button class="buy owned" type="button" data-a="equip" data-id="${i.id}">Equip</button>` }));
    });
    $('#pcount').innerHTML = `<b>${W.owned.length + 2}</b> holdings`;
  } else if (view.tab === 'market'){
    rows = marketList().map((i, k) => {
      const c = catOf(i.cat), own = owned(i.id), eq = W.equipped[i.cat] === i.id;
      const btn = own ? (eq ? `<button class="buy eq" type="button" data-a="detail" data-id="${i.id}">On car</button>`
                            : `<button class="buy owned" type="button" data-a="detail" data-id="${i.id}">Owned</button>`)
                      : `<div class="buyrow"><button class="wish ${W.wish.includes(i.id) ? 'on' : ''}" type="button" data-a="wish" data-id="${i.id}">${IC.star}</button><button class="buy" type="button" data-a="buy" data-id="${i.id}">Buy</button></div>`;
      return crow({ coin:IC[i.cat], bg:c.bg, fg:c.fg, id:i.id, name:esc(i.name),
        sub:`${esc(i.sub)} · ★ ${i.rating.toFixed(1)}`, value:`${fmt(i.price)} ${CUR.code}`, trend:mover(i.trend), idx:k, right:btn });
    });
    $('#pcount').innerHTML = `<b>${rows.length}</b> listed`;
  } else {
    rows = W.history.map((h, k) => {
      const plus = h.amt > 0;
      const ic = h.kind === 'topup' ? IC.topup : h.kind === 'buy' ? IC.bag : h.kind === 'earn' ? IC.trophy : h.kind === 'out' ? IC.sent : IC.recv;
      const bg = h.kind === 'topup' ? '#f59e0b' : h.kind === 'earn' ? '#4ade80' : h.kind === 'out' ? '#3a3a3e' : '#38bdf8';
      return `<div class="row" style="--i:${Math.min(k, 14)};cursor:default">
        <span class="coin" style="background:${bg};color:${h.kind === 'earn' ? '#06130b' : '#fff'}">${ic}</span>
        <div class="t"><b>${esc(h.title)}</b><small>${esc(h.sub)}</small></div>
        <div class="num"><b>${plus ? '+' : '−'}${fmt(Math.abs(h.amt))} ${h.cur}</b><small>${ago(Date.now() - h.t)}</small></div>
        <span class="tagok">${IC.check}</span>
      </div>`;
    });
    $('#pcount').innerHTML = `<b>${rows.length}</b> txns`;
  }
  el.innerHTML = rows.join('') || `<div class="empty">${IC.bag}<span>Nothing here yet.</span></div>`;
  el.scrollTop = 0;
}
$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b){
    e.stopPropagation();
    if (b.dataset.a === 'equip') equip(b.dataset.id);
    else if (b.dataset.a === 'wish') toggleWish(b.dataset.id);
    else openModal('detail', itemOf(b.dataset.id));
    return;
  }
  const row = e.target.closest('.row[data-id]');
  if (row && view.tab !== 'history') openModal('detail', itemOf(row.dataset.id));
});
function equip(id){
  const i = itemOf(id); if (!i) return;
  if (W.equipped[i.cat] === id) delete W.equipped[i.cat]; else W.equipped[i.cat] = id;
  save(); renderList(); toast(W.equipped[i.cat] === id ? `${i.name} equipped` : `${i.name} unequipped`, 'loadout.json');
}
function toggleWish(id){
  const on = W.wish.includes(id);
  W.wish = on ? W.wish.filter(x => x !== id) : [...W.wish, id];
  save(); renderList(); toast(on ? 'Removed from watchlist' : 'Watching · alerts on');
}

/* ================= MODALS ================= */
const modal = $('#modal'), sheet = $('#sheet');
let Mx = null;
const mhead = (icon, bg, fg, title, sub) =>
  `<div class="sheet-h"><span class="phi" style="background:${bg};color:${fg}">${icon}</span><div><b>${title}</b><span>${sub}</span></div><button class="x" data-close type="button">${IC.x}</button></div>`;
const mfoot = (eos, primary, pid) =>
  `<div class="sheet-f"><span class="eosline">${eos}</span>${primary ? `<button class="btn primary" id="${pid}" type="button">${primary}</button>` : `<button class="btn white" data-close type="button">Done</button>`}</div>`;
function openModal(kind, data){
  Mx = { kind, data, pack:2, friend:FRIENDS[0], sendAmt:'', sendTo:FRIENDS[0] };
  R[kind]();
  modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false');
  setTimeout(() => $('input', sheet)?.focus(), 120);
}
function closeModal(){ modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); closeDD(); Mx = null; }
modal.addEventListener('pointerdown', e => { if (e.target === modal) closeModal(); });
sheet.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
function dropdown(root, { options, value, onChange }){
  const label = v => (options.find(o => o.value === v) || { label:v }).label;
  const paint = () => { root.innerHTML = `<button class="dd-btn" type="button"><span class="cur">${esc(label(value))}</span><span class="caret">${IC.chev}</span></button><div class="dd-menu">${options.map(o => `<button class="opt ${o.value === value ? 'sel' : ''}" data-v="${esc(o.value)}" type="button">${esc(o.label)}</button>`).join('')}</div>`; };
  paint();
  root.addEventListener('click', e => {
    if (e.target.closest('.dd-btn')){ const o = root.classList.contains('open'); closeDD(); root.classList.toggle('open', !o); return; }
    const o = e.target.closest('.opt'); if (!o) return;
    value = o.dataset.v; paint(); root.classList.remove('open'); onChange?.(value);
  });
}
function closeDD(){ $$('.open').forEach(x => x.classList.remove('open')); }
document.addEventListener('pointerdown', e => { if (!e.target.closest('.dd')) closeDD(); });

/* ---- send flow state ---- */
function sendNum(){ const n = parseFloat(Mx.sendAmt); return isNaN(n) ? 0 : n; }
function paintSend(){
  const n = sendNum();
  $('#sendN').textContent = Mx.sendAmt === '' ? '0' : Mx.sendAmt;
  $('#sendUsd').textContent = '≈ ' + usd(n * CUR.usd);
  const ok = n > 0 && n <= W.balance;
  $('#sendNext').disabled = !ok;
  $('#sendWarn').textContent = Mx.sendAmt !== '' && n > W.balance ? `Exceeds balance · you hold ${fmt(W.balance)} OCT` : '';
}
function keypadHTML(){
  const keys = ['1','2','3','4','5','6','7','8','9','.', '0','back'];
  return `<div class="kpad">${keys.map(k => k === 'back'
    ? `<button type="button" class="fn" data-k="back">⌫</button>`
    : `<button type="button" data-k="${k}">${k}</button>`).join('')}</div>`;
}
function bindKeypad(){
  $$('.kpad button', sheet).forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    if (k === 'back'){ Mx.sendAmt = Mx.sendAmt.slice(0, -1); }
    else if (k === '.'){ if (!Mx.sendAmt.includes('.')) Mx.sendAmt = (Mx.sendAmt === '' ? '0' : Mx.sendAmt) + '.'; }
    else {
      const [ip, dp] = Mx.sendAmt.split('.');
      if (dp !== undefined && dp.length >= 2) return;
      if (ip.replace('.', '').length >= 7 && dp === undefined) return;
      Mx.sendAmt = (Mx.sendAmt === '0' && k === '0') ? Mx.sendAmt : Mx.sendAmt + k;
      if (Mx.sendAmt.length > 1 && Mx.sendAmt[0] === '0' && Mx.sendAmt[1] !== '.') Mx.sendAmt = Mx.sendAmt.slice(1);
    }
    paintSend();
  }));
}

const R = {
  topup(){
    const p = PACKS[Mx.pack], base = Math.round(p.oct / (1 + p.bonus / 100));
    sheet.innerHTML = mhead(IC.topup, '#f59e0b', '#111', 'Top up Octane', 'Real money → OCT · Epic Games Store') + `
      <div class="sheet-b">
        <div class="packs">${PACKS.map((k, i) => `<button class="pack ${i === Mx.pack ? 'on' : ''}" type="button" data-p="${i}">${k.flag ? `<span class="flag">${k.flag}</span>` : ''}${k.bonus ? `<span class="bonus">+${k.bonus}%</span>` : ''}<b>${fmt(k.oct)}</b><small>OCT · ${usd(k.usd)}</small></button>`).join('')}</div>
        <div class="sum">
          <div><small>You pay</small><b>${usd(p.usd)}</b><span>Epic checkout</span></div>
          <div><small>You get</small><b>${fmt(p.oct)} OCT</b><span>${p.bonus ? `+${fmt(p.oct - base)} bonus` : 'No bonus'}</span></div>
          <div><small>After</small><b>${fmt(W.balance + p.oct)} OCT</b><span>Balance</span></div>
        </div>
      </div>` + mfoot('EOS_Ecom_Checkout · RedeemEntitlements', `Pay ${usd(p.usd)}`, 'mPay');
    $$('.pack', sheet).forEach(b => b.addEventListener('click', () => { Mx.pack = +b.dataset.p; R.topup(); }));
    $('#mPay').addEventListener('click', async e => {
      const b = e.currentTarget; b.classList.add('loading'); await wait(1300);
      W.balance += p.oct; W.history.unshift({ kind:'topup', title:'Top up Octane', sub:`${fmt(p.oct)} OCT pack`, amt:p.oct, cur:'OCT', usd:p.usd, t:Date.now() }); save();
      $('.sheet-b', sheet).innerHTML = `<div class="done"><span class="ok">${IC.check}</span><b>+${fmt(p.oct)} OCT</b><span>Balance ${fmt(W.balance)} OCT</span></div>`;
      $('.sheet-f', sheet).innerHTML = `<span class="eosline">RedeemEntitlements → Success</span><button class="btn white" data-close type="button">Done</button>`;
      renderAll(true); toast(`+${fmt(p.oct)} OCT added`);
    });
  },
  /* ---- step 1: amount (keypad) ---- */
  send(){
    sheet.innerHTML = mhead(IC.sent, '#1f5eff', '#fff', 'Send Octane', 'Step 1 of 2 · amount') + `
      <div class="sheet-b">
        <div class="sendto"><div class="clabel">To</div><div class="dd" id="sFriend"></div></div>
        <div class="assetrow">
          <span class="coin" style="background:var(--oct);color:#111">${IC.octane}</span>
          <div><b>Octane</b><small>${fmt(W.balance)} OCT available</small></div>
          <button class="max" id="sMax" type="button">Use Max</button>
        </div>
        <div class="bigamt"><h3><span id="sendN">0</span><em> OCT</em></h3><small id="sendUsd">≈ $0.00</small></div>
        <div class="errmsg" id="sendWarn" style="padding-left:0;text-align:center"></div>
        ${keypadHTML()}
        <button class="bigbtn" id="sendNext" type="button" disabled>Continue</button>
      </div>`;
    dropdown($('#sFriend'), { options:FRIENDS.map(f => ({ value:f, label:f })), value:Mx.sendTo, onChange:v => Mx.sendTo = v });
    $('#sMax').addEventListener('click', () => { Mx.sendAmt = String(W.balance); paintSend(); });
    bindKeypad(); paintSend();
    $('#sendNext').addEventListener('click', () => R.confirmTxn());
  },
  /* ---- step 2: confirm ---- */
  confirmTxn(){
    const n = sendNum();
    sheet.innerHTML = mhead(IC.sent, '#1f5eff', '#fff', 'Review transaction', 'Step 2 of 2 · irreversible') + `
      <div class="sheet-b">
        <div class="ctxn">
          <h3>Confirm transaction to <span>${esc(Mx.sendTo)}</span></h3>
          <div style="height:8px"></div>
          <div class="kv"><small>Total Value</small><b>${usd(n * CUR.usd)}</b></div>
          <div class="kv"><small>Send OCT</small><b><span class="coin" style="background:var(--oct);color:#111">${IC.octane}</span>${fmt(n)} OCT</b></div>
          <div class="kv" style="border-bottom:0"><small>From</small><b><span class="who"><i>Y</i>YOU_77</span></b></div>
          <div class="feebox">
            <div><b>Free</b><small>Fee estimate ⓘ</small></div>
            <div class="spd"><b>Instant</b><small>~5 secs · friends transfer</small></div>
          </div>
          <p class="irrev">Review the above before confirming.<br>Once made, your transaction is irreversible.</p>
          <div style="height:12px"></div>
          <button class="bigbtn" id="cfGo" type="button">◈ Confirm</button>
        </div>
      </div>`;
    $('#cfGo').addEventListener('click', async e => {
      const b = e.currentTarget; b.classList.add('loading'); await wait(1200);
      W.balance -= n; W.history.unshift({ kind:'out', title:`Sent to ${Mx.sendTo}`, sub:`${fmt(n)} OCT · confirmed`, amt:-n, cur:'OCT', t:Date.now() }); save();
      $('.sheet-b', sheet).innerHTML = `<div class="done"><span class="ok">${IC.check}</span><b>Sent ${fmt(n)} OCT</b><span>${esc(Mx.sendTo)} · balance ${fmt(W.balance)} OCT</span></div>`;
      $('.sheet-f', sheet).innerHTML = `<span class="eosline">Backend transfer confirmed</span><button class="btn white" data-close type="button">Done</button>`;
      renderAll(true); toast(`Sent ${fmt(n)} OCT to ${Mx.sendTo}`);
    });
  },
  redeem(){
    sheet.innerHTML = mhead(IC.ticket, '#fff', '#111', 'Receive', 'Redeem a code · try FRNT-S3-WELCOME') + `
      <div class="sheet-b">
        <div class="crow"><div class="clabel">Code</div><label class="field" id="rField"><input id="rCode" class="mono" type="text" placeholder="FRNT-XXXX-XXXX" maxlength="20" spellcheck="false" /></label></div>
        <div class="errmsg" id="rErr"></div>
        <p class="desc">One redemption per account. Octane lands immediately.</p>
      </div>` + mfoot('Backend · code redemption', 'Redeem', 'mRedeem');
    const inp = $('#rCode');
    inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9-]/g, ''); $('#rField').classList.remove('err'); $('#rErr').textContent = ''; });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') $('#mRedeem').click(); });
    $('#mRedeem').addEventListener('click', async e => {
      const code = inp.value.trim(), b = e.currentTarget; if (!code) return;
      b.classList.add('loading'); await wait(700); b.classList.remove('loading');
      if (!/^FRNT-/.test(code)){ $('#rField').classList.add('err'); $('#rErr').textContent = 'Code not recognised.'; return; }
      if (W.history.some(h => h.kind === 'in' && h.sub === `Code ${code}`)){ $('#rField').classList.add('err'); $('#rErr').textContent = 'Already redeemed.'; return; }
      W.balance += 500; W.history.unshift({ kind:'in', title:'Code redeemed', sub:`Code ${code}`, amt:500, cur:'OCT', t:Date.now() }); save();
      closeModal(); renderAll(true); toast('+500 OCT · code redeemed');
    });
  },
  earn(){
    const rows = [
      [IC.flag, 'Finish a race', 'Per race', '+150 NTR', '#2a2a2e', '#fff'],
      [IC.trophy, 'Win a race', 'P1 · any mode', '+400 NTR', '#4ade80', '#06130b'],
      [IC.spark, 'Clean race', 'No contact', '+50 NTR', '#38bdf8', '#06283a'],
      [IC.clock, 'Daily first race', 'Resets 00:00 UTC', '+100 NTR', '#3a3a3e', '#fff'],
      [IC.bolt, 'Season pass', 'Tier rewards', '+1,000 OCT', '#f59e0b', '#111'],
      [IC.gift, 'Refer a driver', 'After 5 races', '+500 OCT', '#123fb8', '#fff'],
    ];
    sheet.innerHTML = mhead(IC.bolt, '#38bdf8', '#06283a', 'Earn', 'Nitro from racing · Octane from pass + referrals') + `
      <div class="sheet-b"><div class="earnrows">${rows.map(([ic, t, s, v, bg, fg]) => `<div><span class="coin" style="background:${bg};color:${fg}">${ic}</span><div>${t}<small>${s}</small></div><b>${v}</b></div>`).join('')}</div></div>
      <div class="sheet-f"><span class="eosline">Stats · Achievements</span><button class="btn white" data-close type="button">Close</button></div>`;
  },
  detail(){
    const i = Mx.data, c = catOf(i.cat), own = owned(i.id), short = i.price - W.balance, wish = W.wish.includes(i.id);
    const pack = PACKS.findIndex(p => p.oct >= short);
    sheet.innerHTML = mhead(IC[i.cat], c.bg, c.fg, esc(i.name), `${c.one} · ${i.rarity}`) + `
      <div class="sheet-b">
        <div class="tags"><span class="tag">${IC.star}${i.rating.toFixed(1)}</span>${i.trend >= 10 ? `<span class="tag">▲ ${i.trend}%</span>` : ''}${i.age <= 14 ? `<span class="tag hi">New</span>` : ''}<span class="tag">${c.label}</span></div>
        <p class="desc">${esc(i.sub)}. ${i.cat === 'level' ? 'Hand-built track variant — lighting, weather, leaderboards. <b>Unlocks for every race you host.</b>' : 'Purely cosmetic — <b>no performance effect</b>.'}</p>
        <div class="sum">
          <div><small>Price</small><b>${fmt(i.price)} OCT</b><span>≈ ${usd(i.price * CUR.usd)}</span></div>
          <div class="${short > 0 && !own ? 'warn' : ''}"><small>${own ? 'Status' : short > 0 ? 'Short' : 'After'}</small><b>${own ? (W.equipped[i.cat] === i.id ? 'On car' : 'Owned') : short > 0 ? fmt(short) : fmt(W.balance - i.price)}</b><span>${own ? c.one : short > 0 ? 'OCT needed' : 'OCT left'}</span></div>
        </div>
      </div>
      <div class="sheet-f">
        <button class="wishbtn ${wish ? 'on' : ''}" id="mWish" type="button">${IC.star}</button>
        ${own ? `<button class="btn white" id="mEquip" type="button">${W.equipped[i.cat] === i.id ? 'Unequip' : 'Equip'}</button>`
              : short > 0 ? `<button class="btn blue" id="mTop" type="button">Top up ${pack >= 0 ? fmt(PACKS[pack].oct) : ''}</button>`
                          : `<button class="btn primary" id="mBuy" type="button">Buy · ${fmt(i.price)}</button>`}
      </div>`;
    $('#mWish').addEventListener('click', e => {
      const on = W.wish.includes(i.id);
      W.wish = on ? W.wish.filter(x => x !== i.id) : [...W.wish, i.id];
      save(); e.currentTarget.classList.toggle('on', !on); renderList(); toast(on ? 'Unwatched' : 'Watching · alerts on');
    });
    $('#mEquip')?.addEventListener('click', () => { equip(i.id); closeModal(); });
    $('#mTop')?.addEventListener('click', () => { openModal('topup'); Mx.pack = Math.max(0, pack); R.topup(); });
    $('#mBuy')?.addEventListener('click', async e => {
      const b = e.currentTarget; b.classList.add('loading'); await wait(900);
      W.balance -= i.price; W.owned.push(i.id); if (!W.equipped[i.cat]) W.equipped[i.cat] = i.id; W.wish = W.wish.filter(x => x !== i.id);
      W.history.unshift({ kind:'buy', title:i.name, sub:c.one, amt:-i.price, cur:'OCT', t:Date.now() }); save();
      $('.sheet-b', sheet).innerHTML = `<div class="done"><span class="ok">${IC.check}</span><b>${esc(i.name)} is yours</b><span>Balance ${fmt(W.balance)} OCT</span></div>`;
      $('.sheet-f', sheet).innerHTML = `<span class="eosline">Entitlement granted</span><button class="btn white" data-close type="button">Done</button>`;
      renderAll(true); toast(`Bought ${i.name}`, `−${fmt(i.price)} OCT`);
    });
  },
};

/* ================= MISC · INIT ================= */
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '');
  if (e.key === 'Escape'){ if (modal.classList.contains('open')) closeModal(); else if ($('.open')) closeDD(); else if (typing) document.activeElement.blur(); return; }
  if (typing || modal.classList.contains('open')) return;
  if (e.key === 't' || e.key === 'T') openModal('topup');
  if (e.key === 'g' || e.key === 'G') openModal('send');
  if (e.key === 'r' || e.key === 'R') openModal('redeem');
  if (e.key === '1' || e.key === '2' || e.key === '3') switchTab(['assets', 'market', 'history'][+e.key - 1]);
});
function toast(msg, sub){ const t = $('#toast'); t.innerHTML = esc(msg) + (sub ? `<i>${esc(sub)}</i>` : ''); t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); }
function renderAll(animate){ renderCard(animate); renderHoldings(); renderPills(); renderList(); }
renderAll(false);
</script>
