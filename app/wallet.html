<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRONTIER — Wallet</title>
<style>
  /* ============ FRONTIER WALLET · "BLACKOUT" UI (from confirm-screen ref) ============ */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --s:1;
    --bg:#000000; --panel:#0b0b0d; --key:#1c1c1e;
    --line:rgba(255,255,255,.13); --hair:rgba(255,255,255,.08);
    --txt:#ffffff; --dim:#9a9aa0; --faint:#636366;
    --up:#30d158; --down:#ff453a; --gold:#ffd60a;
    --oct:#ffb340; --ntr:#5ac8fa;
    --r:22px;
  }
  html,body{height:100%}
  body{
    background:#0a0a0c;color:var(--txt);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;overflow:hidden;
  }
  /* ---- tablet device (kept) ---- */
  .device{
    width:calc(1000px * var(--s));height:calc(750px * var(--s));
    background:#101012;border-radius:calc(34px * var(--s));
    padding:calc(14px * var(--s));
    box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 0 1px #2c2c2e,inset 0 0 0 2px #000;
    position:relative;flex:0 0 auto;
  }
  .device::before{ /* camera dot */
    content:'';position:absolute;top:calc(5px * var(--s));left:50%;transform:translateX(-50%);
    width:calc(7px * var(--s));height:calc(7px * var(--s));border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#2e4a5f,#05070a 70%);
  }
  .stage{width:100%;height:100%;overflow:hidden;border-radius:calc(22px * var(--s));background:#000;position:relative}
  #screen{width:calc(1000px * var(--s));height:calc(722px * var(--s));transform-origin:top left;position:absolute;top:0;left:0}
  #ui{width:1000px;height:722px;transform:scale(var(--s));transform-origin:top left;background:#000;color:#fff;position:relative;display:flex;font-size:15px}
  button{font-family:inherit}

  /* ================= LEFT : account ================= */
  .left{flex:1.28;display:flex;flex-direction:column;padding:30px 30px 24px;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .backpill{
    display:flex;align-items:center;gap:9px;background:none;border:0;color:#fff;
    font-size:16px;font-weight:600;cursor:pointer;padding:6px 4px;
  }
  .backpill .chev{font-size:22px;font-weight:300;color:var(--dim);line-height:1}
  .iconbtn{
    width:40px;height:40px;border-radius:50%;background:var(--key);border:0;color:#fff;
    font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;
  }
  .iconbtn .dot{position:absolute;top:9px;right:11px;width:8px;height:8px;border-radius:50%;background:#ff453a;border:1.5px solid #000}

  .eyebrow{font-size:12.5px;color:var(--dim);font-weight:500;margin-bottom:8px}
  .bignum{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
  .bignum small{font-size:22px;font-weight:700;color:var(--dim);letter-spacing:0;margin-left:8px}
  .subline{margin-top:10px;font-size:13.5px;color:var(--dim);display:flex;align-items:center;gap:10px}
  .subline b{font-weight:700}
  .up{color:var(--up)} .down{color:var(--down)}

  /* white pill action row — like the ref's Confirm button */
  .payrow{display:flex;gap:12px;margin:24px 0 6px}
  .paybtn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    background:#fff;color:#000;border:0;border-radius:999px;padding:15px 0;
    font-size:15.5px;font-weight:700;cursor:pointer;
  }
  .paybtn.ghost{background:var(--key);color:#fff}
  .paybtn:active{transform:scale(.97);opacity:.92}

  .holdings{margin-top:18px;border-top:1px solid var(--line)}
  .hrow{
    display:flex;align-items:center;gap:13px;padding:15px 2px;
    border-bottom:1px solid var(--hair);
  }
  .hrow .nm{font-size:14.5px;font-weight:600}
  .hrow .nm span{display:block;font-size:12px;color:var(--faint);font-weight:500;margin-top:2px}
  .hrow .vl{margin-left:auto;text-align:right;font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .hrow .vl span{display:block;font-size:12px;color:var(--faint);font-weight:500;margin-top:2px}
  .coin{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .coin svg{width:24px;height:24px}

  .resetrow{margin-top:auto;padding-top:16px;display:flex;align-items:center;justify-content:space-between}
  .resetrow p{font-size:12px;color:var(--faint)}
  .resetbtn{background:none;border:0;color:var(--faint);font-size:12.5px;font-weight:600;text-decoration:underline;cursor:pointer}

  /* ================= RIGHT : panel ================= */
  .right{
    flex:1;display:flex;flex-direction:column;min-width:0;
    border-left:1px solid var(--line);padding:30px 26px 24px;background:#000;
  }
  .seg{display:flex;background:var(--key);border-radius:999px;padding:4px;margin-bottom:18px}
  .seg button{flex:1;border:0;background:none;color:var(--dim);font-size:13.5px;font-weight:600;padding:9px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#3a3a3c;color:#fff}
  .earnbtn{
    display:flex;align-items:center;gap:12px;width:100%;background:none;color:#fff;cursor:pointer;
    border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px;text-align:left;
  }
  .earnbtn .t{font-size:14.5px;font-weight:700}
  .earnbtn .s{font-size:12px;color:var(--dim);margin-top:2px}
  .earnbtn .go{margin-left:auto;font-size:20px;color:var(--dim);font-weight:300}
  .pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:6px;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{
    flex:0 0 auto;border:1px solid var(--line);background:none;color:var(--dim);
    font-size:12.5px;font-weight:600;border-radius:999px;padding:8px 15px;cursor:pointer;white-space:nowrap;
  }
  .pill.on{background:#fff;border-color:#fff;color:#000}
  #list{flex:1;overflow-y:auto;scrollbar-width:none}
  #list::-webkit-scrollbar{display:none}
  .row{
    display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#fff;cursor:pointer;
    padding:13px 2px;border-bottom:1px solid var(--hair);text-align:left;
  }
  .row .coin{width:38px;height:38px}
  .row .coin svg{width:22px;height:22px}
  .row .nm{font-size:14px;font-weight:600}
  .row .nm span{display:block;font-size:11.5px;color:var(--faint);font-weight:500;margin-top:2px}
  .row .pr{margin-left:auto;text-align:right;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .row .pr span{display:block;font-size:11.5px;font-weight:600;margin-top:2px}
  .row .go{color:var(--faint);font-size:18px;font-weight:300;margin-left:6px}
  .star{background:none;border:0;color:var(--faint);font-size:17px;cursor:pointer;padding:4px}
  .star.on{color:var(--gold)}
  .hist{padding:13px 2px;border-bottom:1px solid var(--hair);display:flex;gap:12px;align-items:center}
  .hist .t{font-size:13.5px;font-weight:600}
  .hist .s{font-size:11.5px;color:var(--faint);margin-top:2px}
  .hist .a{margin-left:auto;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{color:var(--faint);font-size:13px;text-align:center;padding:34px 10px;line-height:1.6}

  /* ================= modal sheet (blackout style) ================= */
  .modal{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40}
  .modal.open{display:flex}
  .sheet{
    width:472px;max-height:672px;overflow-y:auto;background:#000;color:#fff;
    border:1px solid var(--line);border-radius:26px;padding:30px 30px 26px;scrollbar-width:none;
  }
  .sheet::-webkit-scrollbar{display:none}
  .sheet h2{font-size:27px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
  .sheet .lede{font-size:13.5px;color:var(--dim);margin-top:8px;line-height:1.5}
  .xrow{display:flex;justify-content:flex-end;margin:-8px -8px 0}
  .xbtn{background:var(--key);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer}
  .kv{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--hair);font-size:14.5px}
  .kv .k{color:var(--dim);font-weight:500;display:flex;align-items:center;gap:6px}
  .kv .v{font-weight:700;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
  .kv .v.dimv{color:var(--dim);font-weight:600}
  .divider{border:0;border-top:1px solid var(--line);margin:6px 0}
  .feebox{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
  .feebox .amt{font-size:19px;font-weight:800}
  .feebox .lbl{font-size:12.5px;color:var(--dim);margin-top:2px;display:flex;align-items:center;gap:5px}
  .feebox .spd{text-align:right;font-size:15.5px;font-weight:700}
  .feebox .spd span{display:block;font-size:12.5px;color:var(--dim);font-weight:500;margin-top:2px}
  .note{font-size:12.5px;color:var(--faint);text-align:center;line-height:1.6;margin:22px 8px}
  .cta{
    width:100%;background:#fff;color:#000;border:0;border-radius:999px;padding:17px 0;
    font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
  }
  .cta:active{transform:scale(.98)}
  .cta.dark{background:var(--key);color:#fff}
  .cta:disabled{opacity:.3;cursor:default}
  .cta-row{display:flex;gap:10px;margin-top:14px}
  .info{width:15px;height:15px;border-radius:50%;background:#3a3a3c;color:#c7c7cc;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-style:normal}
  .homebar{width:120px;height:4.5px;border-radius:99px;background:rgba(255,255,255,.85);margin:20px auto 0}

  /* send amount screen */
  .tofield{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin:20px 0 4px;cursor:pointer}
  .tofield .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff9f0a,#ff375f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .tofield .n{font-size:15px;font-weight:700}
  .tofield .c{margin-left:auto;color:var(--faint);font-size:18px}
  .assetrow{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--hair)}
  .assetrow .b{margin-left:auto;text-align:right;font-size:13px;color:var(--dim)}
  .assetrow .b b{display:block;color:#fff;font-size:14.5px}
  .maxbtn{background:none;border:1px solid var(--line);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:7px 14px;cursor:pointer;margin-top:6px}
  .bigamt{font-size:56px;font-weight:800;letter-spacing:-1.5px;text-align:center;margin:20px 0 2px;font-variant-numeric:tabular-nums;min-height:66px}
  .bigamt .cur{font-size:20px;color:var(--dim);font-weight:700}
  .usdline{text-align:center;color:var(--dim);font-size:14px;margin-bottom:8px;font-variant-numeric:tabular-nums}
  .warn{display:none;text-align:center;color:var(--down);font-size:12.5px;font-weight:600;margin-bottom:4px}
  .warn.show{display:block}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 18px}
  .key{
    background:var(--key);border:0;color:#fff;border-radius:16px;padding:15px 0;
    font-size:21px;font-weight:600;cursor:pointer;
  }
  .key:active{background:#2c2c2e}
  .key.fn{font-size:16px;color:var(--dim)}

  .pack{display:flex;align-items:center;gap:13px;width:100%;background:none;border:0;border-bottom:1px solid var(--hair);color:#fff;padding:15px 0;cursor:pointer;text-align:left}
  .pack .t{font-size:15px;font-weight:700}
  .pack .t span{display:block;font-size:12px;color:var(--dim);font-weight:500;margin-top:2px}
  .pack .p{margin-left:auto;font-size:15.5px;font-weight:800}
  .pack .tag{font-size:10.5px;font-weight:800;background:#fff;color:#000;border-radius:99px;padding:3px 9px;margin-left:8px;vertical-align:2px}
  .addrbox{border:1px solid var(--line);border-radius:14px;padding:15px;margin:18px 0 6px;font-size:12.5px;color:var(--dim);line-height:1.7;word-break:break-all}
  .addrbox b{color:#fff}
  .etab{width:100%;border:0;background:none;color:#fff;display:flex;gap:13px;align-items:center;padding:15px 0;border-bottom:1px solid var(--hair);cursor:pointer;text-align:left}
  .etab .coin{width:40px;height:40px}
  .etab .t{font-size:14.5px;font-weight:700}
  .etab .t span{display:block;font-size:12px;color:var(--dim);font-weight:500;margin-top:2px}
  .etab .r{margin-left:auto;font-size:13.5px;font-weight:700;color:var(--up)}
  #toast{
    position:absolute;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#fff;color:#000;font-size:13.5px;font-weight:700;border-radius:999px;padding:12px 22px;
    opacity:0;transition:.3s;z-index:99;pointer-events:none;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:1060px){ body{overflow:auto} }
</style>
</head>
<body>
<div class="device">
  <div class="stage">
    <div id="screen">
      <div id="ui">
        <!-- LEFT -->
        <div class="left">
          <div class="topbar">
            <button class="backpill" id="btnHome"><span class="chev">‹</span> Wallet</button>
            <button class="iconbtn" id="btnBell">◔<span class="dot" id="bellDot"></span></button>
          </div>
          <div class="eyebrow">Total Balance</div>
          <div class="bignum"><span id="balH">0.00</span><small>OCT</small></div>
          <div class="subline"><b class="up" id="balW">▲ 0.0%</b><span>this week</span><span>·</span><span id="balUsd">$0.00</span></div>
          <div class="payrow">
            <button class="paybtn" id="btnSend">↑ Send</button>
            <button class="paybtn ghost" id="btnFab">+</button>
            <button class="paybtn ghost" id="btnReceive">↓ Receive</button>
          </div>
          <div class="holdings" id="holdings"></div>
          <div class="resetrow">
            <p id="pcount"></p>
            <button class="resetbtn" id="reset">Reset demo data</button>
          </div>
        </div>
        <!-- RIGHT -->
        <div class="right">
          <div class="seg">
            <button data-t="assets" class="on">Assets</button>
            <button data-t="market">Market</button>
            <button data-t="hist">History</button>
          </div>
          <button class="earnbtn" id="btnEarn">
            <span class="coin" data-coin="ntr" style="width:38px;height:38px"></span>
            <span><span class="t">Earn NITRO racing</span><div class="s">Payouts in NTR + OCT · instant</div></span>
            <span class="go">›</span>
          </button>
          <div class="pills" id="pills"></div>
          <div id="list"></div>
        </div>

        <!-- MODALS -->
        <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
        <div id="toast"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= fit tablet ================= */
function fit(){
  var pad=48, s=Math.min((window.innerWidth-pad)/1000,(window.innerHeight-pad)/750,1.15);
  document.documentElement.style.setProperty('--s', s);
  var sc=document.getElementById('screen');
  sc.style.transform='scale('+s+')';
  sc.style.left=((1000*s)>document.querySelector('.stage').clientWidth?'0':'50%');
  sc.style.marginLeft=((1000*s)>document.querySelector('.stage').clientWidth?'0':(-500*s)+'px');
}
window.addEventListener('resize',fit);

/* ================= ICONS — engineered coin set ================= */
var IC = {
  oct:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5S6 10.2 6 14.3a6 6 0 0 0 12 0C18 10.2 12 2.5 12 2.5Z" fill="#ffb340"/><path d="M9.4 14.5a2.7 2.7 0 0 0 2.4 2.8" stroke="#7a4a00" stroke-width="1.6" stroke-linecap="round"/><path d="M12 7.2l-2.3 4.1h4.6L12 7.2Z" fill="#fff3dd"/></svg>',
  ntr:'<svg viewBox="0 0 24 24" fill="none"><path d="M13.2 2.3S5.8 12.4 5.8 15.7a6.2 6.2 0 0 0 12.4.4c0-.9-.3-1.9-.8-3l-2.6 2.1.9-5.5-2.4 1.8.9-5.2-1-1.4Z" fill="#5ac8fa"/><path d="M13.2 2.3l-1.6 5.3 2.5-1.6-.8 4.9 2.7-2.2c.3.8.5 1.6.5 2.4" stroke="#0a84ff" stroke-width="1" stroke-linecap="round" opacity=".7"/></svg>',
  spray:'<svg viewBox="0 0 24 24" fill="none"><rect x="7" y="10" width="7" height="10" rx="2" fill="#bf5af2"/><rect x="8.5" y="4" width="4" height="6" rx="1" fill="#d9a7f5"/><rect x="13" y="6.5" width="5" height="2.4" rx="1.2" fill="#efeff4"/><circle cx="19.5" cy="14" r="1" fill="#bf5af2"/><circle cx="18" cy="17" r="1" fill="#bf5af2"/><circle cx="20" cy="18.5" r="1" fill="#bf5af2"/></svg>',
  vinyl:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 16.5 16.5 4l3.5 3.5L7.5 20 4 16.5Z" fill="#64d2ff"/><path d="M7 19.5 13.5 13" stroke="#0a84ff" stroke-width="1.6" stroke-linecap="round"/><path d="M4 16.5 16.5 4" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".7"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none"><path d="M3 15l1.6-4.7A2 2 0 0 1 6.5 9h9.9a2 2 0 0 1 1.8 1.1L20 14l1.5.4V18h-2.2M3 15h2.3m0 0a2 2 0 1 0 4 0m-4 0h4m8.4 0a2 2 0 1 0 4 0m-4 0h4M3 15v3h2.3m14.2-3H21v3h-1.6" stroke="#ff9f0a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.3" cy="18" r="1.4" fill="#ff9f0a"/><circle cx="16.7" cy="18" r="1.4" fill="#ff9f0a"/></svg>',
  wheel:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#c7c7cc" stroke-width="2"/><circle cx="12" cy="12" r="2.2" fill="#c7c7cc"/><path d="M12 3.5v6.3M12 14.2v6.3M3.5 12h6.3M14.2 12h6.3M6 6l4.4 4.4M13.6 13.6 18 18M18 6l-4.4 4.4M10.4 13.6 6 18" stroke="#8e8e93" stroke-width="1.7" stroke-linecap="round"/></svg>',
  audio:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2" stroke="#30d158" stroke-width="2.2" stroke-linecap="round"/></svg>',
  bulb:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.2 1.3 2h4.6c.2-.8.7-1.5 1.3-2A6 6 0 0 0 12 3Z" fill="#ffd60a"/><rect x="9.6" y="17.5" width="4.8" height="1.6" rx=".8" fill="#a1a1a6"/><rect x="10.4" y="20" width="3.2" height="1.4" rx=".7" fill="#6e6e73"/></svg>',
  piston:'<svg viewBox="0 0 24 24" fill="none"><rect x="8" y="3" width="8" height="6" rx="1.4" fill="#ff6482"/><rect x="10.8" y="9" width="2.4" height="7" fill="#c7c7cc"/><path d="M7 19.5h10" stroke="#8e8e93" stroke-width="2" stroke-linecap="round"/><path d="M9.5 16v3.5M14.5 16v3.5" stroke="#8e8e93" stroke-width="1.6" stroke-linecap="round"/></svg>',
  lvl:'<svg viewBox="0 0 24 24" fill="none"><path d="M3 19 10 6l4 7 2.5-3.5L21 19H3Z" fill="#30d158"/><circle cx="17.5" cy="5.5" r="1.8" fill="#ffd60a"/></svg>'
};
var RING = {oct:'#ffb340',ntr:'#5ac8fa',spray:'#bf5af2',vinyl:'#64d2ff',car:'#ff9f0a',wheel:'#c7c7cc',audio:'#30d158',bulb:'#ffd60a',piston:'#ff6482',lvl:'#30d158'};
function coin(k,st){
  st = st || '';
  return '<span class="coin" style="background:rgba(255,255,255,.07);border:1.5px solid '+RING[k]+';'+st+'">'+IC[k]+'</span>';
}
document.querySelectorAll('[data-coin]').forEach(function(el){ el.outerHTML = coin(el.getAttribute('data-coin'),'width:38px;height:38px'); });

/* ================= DATA ================= */
var LS='frontier.wallet.v3';
var CATALOG=[
  {id:'oct', name:'OCTANE', eng:'RON-98 race fuel · premium', type:'cur', rate:1,   icon:'oct'},
  {id:'ntr', name:'NITRO',  eng:'N₂O charge credit · earned',  type:'cur', rate:.4,  icon:'ntr'},
  {id:'paint',  name:'Paint',         eng:'base / metallic / flip', type:'cos', price:180, icon:'spray',  cat:'Paint'},
  {id:'decals', name:'Decal kits',    eng:'vinyl layers · rally / GT', type:'cos', price:320, icon:'vinyl', cat:'Decals'},
  {id:'livery', name:'Livery packs',  eng:'full-body works schemes', type:'cos', price:650, icon:'car',   cat:'Liveries'},
  {id:'wheels', name:'Forged wheels', eng:'flow-formed · 18–20 in',  type:'cos', price:900, icon:'wheel', cat:'Wheels'},
  {id:'sonics', name:'Engine notes',  eng:'exhaust + intake samples', type:'cos', price:240, icon:'audio', cat:'Audio'},
  {id:'glow',   name:'Underglow',     eng:'RGB diffuser bars',        type:'cos', price:410, icon:'bulb',  cat:'Lights'},
  {id:'piston', name:'Piston Charm',  eng:'forged charm · dash mount', type:'cos', price:150, icon:'piston', cat:'Charms'},
  {id:'levels', name:'Level passes',  eng:'unlock tiers 4–10',        type:'cos', price:500, icon:'lvl',    cat:'Levels'}
];
var MARKET=[
  {id:'paint', chg:8.2, rate:5},{id:'decals', chg:-3.1, rate:4},{id:'livery', chg:12.4, rate:5},
  {id:'wheels', chg:5.6, rate:4},{id:'sonics', chg:-1.2, rate:3},{id:'glow', chg:21.7, rate:5},
  {id:'piston', chg:2.3, rate:3},{id:'levels', chg:6.9, rate:4}
];
var EARN=[
  {t:'Win a race', s:'1st place · any event', r:'+120 NTR', icon:'ntr'},
  {t:'Podium finish', s:'2nd – 3rd place', r:'+60 NTR', icon:'ntr'},
  {t:'Daily login', s:'crate · streak bonus', r:'+25 OCT', icon:'oct'},
  {t:'Beat a rival', s:'rivals mode · per duel', r:'+40 NTR', icon:'ntr'},
  {t:'Clean lap', s:'no contact · qualifier', r:'+15 OCT', icon:'oct'}
];
var FRIENDS=['John Smith','Ava Reyes','Dario Kim','Mia Novak'];
var FEED=[
  {t:'Weekly crate landed', s:'Season payout · just now', a:'+150 OCT', up:1},
  {t:'Rival beaten: KAI_9', s:'duel · 2h ago', a:'+40 NTR', up:1},
  {t:'New drop: Neon Tide livery', s:'store · yesterday', a:'650 OCT', up:0}
];
function byId(id){ return CATALOG.find(function(c){return c.id===id;}); }
function def(){
  return { oct:23688, ntr:4510, owned:['paint'], watch:['glow'], equip:null, week:4.2, hist:[
    {t:'Welcome bonus', s:'onboarding · created', a:'+500 OCT'},
    {t:'First podium', s:'earn · NTR', a:'+60 NTR'}
  ]};
}
var S;
try{ S = JSON.parse(localStorage.getItem(LS)) || def(); }catch(e){ S = def(); }
function save(){ localStorage.setItem(LS, JSON.stringify(S)); }
function fmt(n){ return n.toLocaleString('en-US',{maximumFractionDigits:n<100?2:0}); }
function usdOct(n){ return '$'+(n*0.11).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ================= LEFT ================= */
function renderLeft(){
  document.getElementById('balH').textContent = fmt(S.oct);
  document.getElementById('balUsd').textContent = usdOct(S.oct);
  var w = document.getElementById('balW');
  w.textContent = (S.week>=0?'▲ ':'▼ ')+Math.abs(S.week).toFixed(1)+'%';
  w.className = S.week>=0?'up':'down';
  document.getElementById('holdings').innerHTML =
    holdRow('oct', byId('oct').name, byId('oct').eng, fmt(S.oct)+' OCT', usdOct(S.oct)) +
    holdRow('ntr', byId('ntr').name, byId('ntr').eng, fmt(S.ntr)+' NTR', '≈ '+fmt(S.ntr*.4)+' OCT');
  document.getElementById('pcount').textContent = S.owned.length+' item'+(S.owned.length===1?'':'s')+' in garage';
}
function holdRow(icon, nm, sub, v, vs){
  return '<div class="hrow">'+coin(icon)+'<div class="nm">'+nm+'<span>'+sub+'</span></div>'+
         '<div class="vl">'+v+'<span>'+vs+'</span></div></div>';
}

/* ================= RIGHT ================= */
var tab='assets', pill='All';
var PILLS=['All','★ Watched','Top movers','Top rated','Paint','Decals','Liveries','Wheels','Audio','Lights','Charms','Levels'];
function renderPills(){
  document.getElementById('pills').style.display = tab==='market'?'flex':'none';
  document.getElementById('pills').innerHTML = PILLS.map(function(p){
    return '<button class="pill'+(p===pill?' on':'')+'" data-p="'+p+'">'+p+'</button>';
  }).join('');
  document.querySelectorAll('.pill').forEach(function(b){
    b.onclick = function(){ pill=b.getAttribute('data-p'); renderPills(); renderList(); };
  });
}
function stars(n){ var s=''; for(var i=1;i<=5;i++) s+=(i<=n?'★':'☆'); return s; }
function renderList(){
  var el = document.getElementById('list'), h='';
  if(tab==='assets'){
    h += '<div style="padding:4px 2px 10px;font-size:12px;color:var(--faint);font-weight:600">Currencies</div>';
    h += assetRow('oct', fmt(S.oct)+' OCT', usdOct(S.oct));
    h += assetRow('ntr', fmt(S.ntr)+' NTR', '≈ '+fmt(S.ntr*.4)+' OCT');
    h += '<div style="padding:16px 2px 10px;font-size:12px;color:var(--faint);font-weight:600">My items'+(S.equip?' · equipped: '+byId(S.equip).name:'')+'</div>';
    if(!S.owned.length) h += '<div class="empty">Garage is empty.<br>Grab something from Market.</div>';
    S.owned.forEach(function(id){
      var c=byId(id);
      h += '<button class="row" data-buy="'+id+'">'+coin(c.icon)+
           '<div class="nm">'+c.name+'<span>'+c.eng+'</span></div>'+
           '<div class="pr" style="font-size:12.5px;color:var(--dim)">'+(S.equip===id?'● Equipped':'Tap to equip')+'</div><span class="go">›</span></button>';
    });
  } else if(tab==='market'){
    var items = MARKET.map(function(m){ var c=byId(m.id); return {c:c,chg:m.chg,rate:m.rate}; });
    if(pill==='★ Watched') items = items.filter(function(x){return S.watch.includes(x.c.id);});
    if(pill==='Top movers') items = items.slice().sort(function(a,b){return Math.abs(b.chg)-Math.abs(a.chg);}).slice(0,4);
    if(pill==='Top rated') items = items.filter(function(x){return x.rate>=4;});
    if(PILLS.slice(4).includes(pill)) items = items.filter(function(x){return x.c.cat===pill;});
    if(!items.length) h += '<div class="empty">Nothing here yet.<br>Tap ☆ on any item to watch it.</div>';
    items.forEach(function(x){
      var w = S.watch.includes(x.c.id);
      h += '<div class="row" style="cursor:default">'+coin(x.c.icon)+
        '<div class="nm">'+x.c.name+'<span>'+x.c.eng+'</span></div>'+
        '<button class="star'+(w?' on':'')+'" data-w="'+x.c.id+'">★</button>'+
        '<button class="pr" data-buy="'+x.c.id+'" style="background:none;border:0;color:#fff;cursor:pointer">'+x.c.price+' OCT<span class="'+(x.chg>=0?'up':'down')+'">'+(x.chg>=0?'+':'')+x.chg+'%</span></button><span class="go">›</span></div>';
    });
  } else {
    if(!S.hist.length) h += '<div class="empty">No activity yet.</div>';
    S.hist.slice().reverse().forEach(function(x){
      h += '<div class="hist"><div><div class="t">'+x.t+'</div><div class="s">'+x.s+'</div></div>'+
           '<div class="a" style="color:'+(x.a[0]==='+'?'var(--up)':'#fff')+'">'+x.a+'</div></div>';
    });
  }
  el.innerHTML = h;
  el.querySelectorAll('[data-w]').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var id=b.getAttribute('data-w'), i=S.watch.indexOf(id);
      if(i>=0) S.watch.splice(i,1); else S.watch.push(id);
      save(); renderPills(); renderList(); toast(i>=0?'Removed from watchlist':'★ Watching');
    };
  });
  el.querySelectorAll('[data-buy]').forEach(function(b){ b.onclick = function(){ openBuy(b.getAttribute('data-buy')); }; });
}
function assetRow(id, v, vs){
  var c = byId(id);
  return '<div class="hrow">'+coin(c.icon)+'<div class="nm">'+c.name+'<span>'+c.eng+'</span></div>'+
         '<div class="vl">'+v+'<span>'+vs+'</span></div></div>';
}
document.querySelectorAll('.seg button').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('.seg button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); tab=b.getAttribute('data-t'); renderPills(); renderList();
  };
});

/* ================= modal plumbing ================= */
var modal=document.getElementById('modal'), sheet=document.getElementById('sheet');
function open(h){ sheet.innerHTML=h; modal.classList.add('open'); }
function close(){ modal.classList.remove('open'); }
modal.addEventListener('click',function(e){ if(e.target===modal) close(); });
var toastT;
function toast(m){
  var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},2200);
}
function xBtn(){ return '<div class="xrow"><button class="xbtn" onclick="close()">✕</button></div>'; }
function homeBar(){ return '<div class="homebar"></div>'; }
function feeRow(){
  return '<div class="feebox"><div><div class="amt">Free</div><div class="lbl">Network fee <i class="info">i</i></div></div>'+
         '<div class="spd">Instant<span>~ 5 Secs</span></div></div>';
}
function irreversible(){
  return '<p class="note">Review the above before confirming.<br>Once made, your transaction is irreversible.</p>';
}

/* ================= BUY ================= */
function openBuy(id){
  var c = byId(id), owned = S.owned.includes(id);
  open(xBtn()+'<h2>'+c.name+'</h2><p class="lede">'+c.eng+' · rated '+stars((MARKET.find(function(m){return m.id===id;})||{rate:4}).rate)+'</p>'+
    '<div style="display:flex;justify-content:center;margin:22px 0"><span class="coin" style="width:84px;height:84px;border-width:2.5px">'+IC[c.icon].replace('viewBox','width="44" height="44" viewBox')+'</span></div>'+
    '<div class="kv"><span class="k">Total Value</span><span class="v">'+(owned?'Owned':'≈ '+usdOct(c.price))+'</span></div>'+
    '<div class="kv"><span class="k">Pay with</span><span class="v">'+coin('oct','width:24px;height:24px')+' '+c.price+' OCT</span></div>'+
    '<div class="kv"><span class="k">Balance after</span><span class="v dimv">'+fmt(S.oct-c.price)+' OCT</span></div>'+
    '<hr class="divider">'+feeRow()+irreversible()+
    (owned
      ? '<button class="cta" onclick="equip(\''+id+'\')"><span style="font-size:15px">◈</span> '+(S.equip===id?'Equipped':'Equip')+'</button>'
      : '<button class="cta" onclick="buy(\''+id+'\')"><span style="font-size:15px">◈</span> Confirm — '+c.price+' OCT</button>')+
    homeBar());
}
function buy(id){
  var c=byId(id);
  if(S.oct<c.price){ toast('Not enough OCT — top up first'); return; }
  S.oct-=c.price; S.owned.push(id); S.equip=id;
  S.hist.push({t:c.name, s:'store · just now', a:'−'+c.price+' OCT'});
  save(); renderLeft(); renderList(); close(); toast('◈ '+c.name+' equipped');
}
function equip(id){ S.equip=id; save(); renderList(); close(); toast('◈ '+byId(id).name+' equipped'); }

/* ================= SEND — keypad amount → confirm ================= */
var sendAmt='0', sendTo=FRIENDS[0];
function openSend(){
  sendAmt='0';
  open(xBtn()+'<h2>Send to<br>'+sendTo+'</h2>'+
    '<div class="tofield" onclick="pickFriend()"><div class="av">'+sendTo[0]+'</div><div class="n">'+sendTo+'</div><div class="c">›</div></div>'+
    '<div class="assetrow">'+coin('oct')+'<div><div style="font-size:14.5px;font-weight:700">OCTANE</div><div style="font-size:12px;color:var(--dim)">RON-98 · premium</div></div>'+
    '<div class="b"><b>'+fmt(S.oct)+' OCT</b>balance<button class="maxbtn" onclick="sendMax()">Use Max</button></div></div>'+
    '<div class="bigamt" id="sendN">0 <span class="cur">OCT</span></div>'+
    '<div class="usdline" id="sendUsd">≈ $0.00</div>'+
    '<div class="warn" id="sendWarn">Amount exceeds balance</div>'+
    '<div class="keys">'+
      ['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(function(k){
        return '<button class="key'+(k==='⌫'||k==='.'?' fn':'')+'" onclick="key(\''+k+'\')">'+(k==='⌫'?'⌫':k)+'</button>';
      }).join('')+'</div>'+
    '<button class="cta" id="sendNext" onclick="openConfirm()" disabled>Continue →</button>'+homeBar());
  drawAmt();
}
function pickFriend(){
  open(xBtn()+'<h2>Send to</h2><p class="lede">Choose a driver</p><div style="margin-top:14px">'+
    FRIENDS.map(function(f){
      return '<button class="etab" onclick="setFriend(\''+f+'\')"><span class="av2" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff9f0a,#ff375f);display:flex;align-items:center;justify-content:center;font-weight:800">'+f[0]+'</span><span class="t">'+f+'<span>driver · online</span></span><span class="go" style="margin-left:auto;color:var(--faint)">›</span></button>';
    }).join('')+'</div>'+homeBar());
}
function setFriend(f){ sendTo=f; openSend(); }
function sendMax(){ sendAmt=String(Math.floor(S.oct*100)/100); drawAmt(); }
function key(k){
  if(k==='⌫') sendAmt = sendAmt.length>1?sendAmt.slice(0,-1):'0';
  else if(k==='.'){ if(!sendAmt.includes('.')) sendAmt+='.'; }
  else { sendAmt = sendAmt==='0'?k:(sendAmt.replace('.','').length>=9?sendAmt:sendAmt+k); }
  drawAmt();
}
function drawAmt(){
  var v=parseFloat(sendAmt)||0;
  document.getElementById('sendN').innerHTML = fmt(v)+' <span class="cur">OCT</span>';
  document.getElementById('sendUsd').textContent = '≈ '+usdOct(v);
  var over = v>S.oct;
  document.getElementById('sendWarn').classList.toggle('show', over);
  document.getElementById('sendNext').disabled = !(v>0) || over;
}
function openConfirm(){
  var v=parseFloat(sendAmt)||0;
  open(xBtn()+'<h2>Confirm transaction to<br>'+sendTo+'</h2><div style="height:18px"></div>'+
    '<div class="kv"><span class="k">Total Value</span><span class="v">'+usdOct(v)+'</span></div>'+
    '<div class="kv"><span class="k">Send OCTANE</span><span class="v">'+coin('oct','width:24px;height:24px')+' '+fmt(v)+'</span></div>'+
    '<div class="kv"><span class="k">From</span><span class="v"><span style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#ffd60a,#ff9f0a);display:inline-flex;align-items:center;justify-content:center;font-size:12px">◈</span> YOU_77</span></div>'+
    '<hr class="divider">'+feeRow()+irreversible()+
    '<button class="cta" onclick="doSend('+v+')"><span style="font-size:15px">◈</span> Confirm</button>'+homeBar());
}
function doSend(v){
  S.oct=Math.round((S.oct-v)*100)/100;
  S.hist.push({t:'Sent to '+sendTo, s:'transfer · just now', a:'−'+fmt(v)+' OCT'});
  save(); renderLeft(); renderList(); tab='hist';
  document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-t')==='hist');});
  renderPills(); renderList(); close(); toast('◈ Sent '+fmt(v)+' OCT to '+sendTo);
}

/* ================= RECEIVE / EARN / TOP-UP / NOTIFS ================= */
function openReceive(){
  open(xBtn()+'<h2>Receive</h2><p class="lede">Share your tag — transfers land instantly, no fee.</p>'+
    '<div class="addrbox"><b>YOU_77</b><br>oct:frontier·you77·98fa · ntr:charge·you77·c41d</div>'+
    '<div class="cta-row"><button class="cta" onclick="toast(\'Tag copied\');close()">Copy tag</button></div>'+homeBar());
}
function openEarn(){
  open(xBtn()+'<h2>Earn NITRO</h2><p class="lede">Payouts credit instantly after each event.</p><div style="margin-top:12px">'+
    EARN.map(function(e,i){
      return '<button class="etab" onclick="claim('+i+')">'+coin(e.icon)+'<span class="t">'+e.t+'<span>'+e.s+'</span></span><span class="r">'+e.r+'</span></button>';
    }).join('')+'</div>'+homeBar());
}
function claim(i){
  var e=EARN[i], n=parseInt(e.r.match(/\d+/)[0],10);
  if(e.r.includes('NTR')) S.ntr+=n; else S.oct+=n;
  S.hist.push({t:e.t, s:'earn · just now', a:'+'+n+(e.r.includes('NTR')?' NTR':' OCT')});
  save(); renderLeft(); renderList(); close(); toast('◈ +'+n+(e.r.includes('NTR')?' NTR':' OCT'));
}
var PACKS=[{n:500,p:'$4.99'},{n:1200,p:'$9.99',tag:'POPULAR'},{n:3000,p:'$19.99'},{n:8000,p:'$49.99',tag:'VALUE'}];
function openTopup(){
  open(xBtn()+'<h2>Top up OCTANE</h2><p class="lede">Real money in · 1 OCT ≈ $0.11 · NITRO can only be earned.</p><div style="margin-top:12px">'+
    PACKS.map(function(k,i){
      return '<button class="pack" onclick="topup('+i+')"><span class="t">'+fmt(k.n)+' OCT'+(k.tag?'<span class="tag">'+k.tag+'</span>':'')+'<span>≈ '+usdOct(k.n)+'</span></span><span class="p">'+k.p+'</span></button>';
    }).join('')+'</div>'+homeBar());
}
function topup(i){
  S.oct+=PACKS[i].n;
  S.hist.push({t:'OCTANE top-up', s:'store · just now', a:'+'+fmt(PACKS[i].n)+' OCT'});
  save(); renderLeft(); renderList(); close(); toast('◈ +'+fmt(PACKS[i].n)+' OCT');
}
function openBell(){
  document.getElementById('bellDot').style.display='none';
  open(xBtn()+'<h2>Notifications</h2><div style="margin-top:12px">'+
    FEED.map(function(f){
      return '<div class="hist"><div><div class="t">'+f.t+'</div><div class="s">'+f.s+'</div></div><div class="a" style="color:'+(f.up?'var(--up)':'#fff')+'">'+f.a+'</div></div>';
    }).join('')+'</div>'+homeBar());
}

/* ================= wire + boot ================= */
document.getElementById('btnHome').onclick=function(){ window.location.href='index.html'; };
document.getElementById('btnSend').onclick=openSend;
document.getElementById('btnFab').onclick=openTopup;
document.getElementById('btnReceive').onclick=openReceive;
document.getElementById('btnEarn').onclick=openEarn;
document.getElementById('btnBell').onclick=openBell;
document.getElementById('reset').onclick=function(){ S=def(); save(); renderLeft(); renderPills(); renderList(); toast('Demo data reset'); };
renderLeft(); renderPills(); renderList(); fit();
</script>
