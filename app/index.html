<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>FRONTIER · Home</title>
<style>
:root{
  --blue:#1f5eff; --blue-soft:#4d80ff;
  --bg:#05070d; --panel:#121212; --inset:#1a1a1a;
  --stroke:rgba(255,255,255,.08);
  --text:#fff; --dim:#8a8a8a; --faint:#5c5c5c;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;-webkit-user-select:none}
.wall{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(46% 34% at 78% 12%,rgba(31,94,255,.35),transparent 65%),
    radial-gradient(40% 32% at 12% 88%,rgba(94,234,212,.12),transparent 60%),
    radial-gradient(60% 50% at 50% 55%,rgba(31,94,255,.10),transparent 70%),
    #05070d}
.shell{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:18px 22px 26px}
/* status bar */
.status{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--dim)}
.status .sicons{display:flex;align-items:center;gap:6px;color:#fff}
.status svg{width:15px;height:15px;fill:currentColor}
/* clock widget */
.clock{margin:34px 0 6px}
.clock .date{font-size:14px;color:var(--dim);font-weight:500}
.clock .time{font-size:64px;font-weight:400;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.clock .sub{font-size:12px;color:var(--faint);margin-top:6px}
.clock .sub b{color:var(--blue-soft)}
/* search */
.search{margin:20px 0 8px;height:44px;border-radius:22px;background:rgba(255,255,255,.07);
  border:1px solid var(--stroke);display:flex;align-items:center;gap:10px;padding:0 16px;backdrop-filter:blur(8px)}
.search svg{width:16px;height:16px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round}
.search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:14px;font-family:inherit}
.search input::placeholder{color:var(--faint)}
/* app grid */
.apps-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:18px 2px 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.app.hide{display:none}
.icon{width:62px;height:62px;border-radius:17px;display:grid;place-items:center;position:relative;
  background:linear-gradient(145deg,#232323,#141414);border:1px solid var(--stroke);
  box-shadow:0 10px 24px -10px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .15s var(--ease),box-shadow .15s}
.app:active .icon{transform:scale(.9)}
.app.live .icon{background:linear-gradient(145deg,var(--blue-soft),var(--blue) 60%,#123fb8)}
.app.live:active .icon{box-shadow:0 0 0 6px rgba(31,94,255,.25)}
.icon svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app.soon{cursor:default}
.app.soon .icon{background:#101010;border-style:dashed}
.app.soon .icon svg{stroke:var(--faint)}
.app small{font-size:11.5px;font-weight:500;color:#ddd}
.app.soon small{color:var(--faint)}
.badge{position:absolute;top:-6px;right:-8px;font-size:8px;font-weight:800;letter-spacing:.08em;
  background:#fff;color:#111;border-radius:8px;padding:2px 6px}
.badge.soon-b{background:#2a2a2a;color:var(--dim)}
.dot-new{position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%;background:#fff}
/* dock */
.dock{margin-top:auto;background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:26px;
  padding:14px 18px;display:flex;justify-content:space-around;backdrop-filter:blur(12px)}
/* toast */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,10px);padding:10px 16px;border-radius:12px;
  background:#fff;color:#111;font-size:12.5px;font-weight:500;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .3s var(--ease);white-space:nowrap;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:10px;letter-spacing:.14em;color:var(--faint);margin-top:14px}
.foot b{color:var(--dim)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake .icon{animation:shake .3s}
</style>
</head>
<body>
<div class="wall"></div>
<div class="shell">
  <div class="status">
    <span id="stime">9:41</span>
    <span class="sicons">
      <svg viewBox="0 0 24 24"><path d="M3 17h4v4H3zM10 13h4v8h-4zM17 8h4v13h-4z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 18a1.5 1.5 0 1 0 0 .01M8.5 14.5a5 5 0 0 1 7 0M5 11a10 10 0 0 1 14 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 28 14"><rect x="1" y="2" width="22" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="3" y="4" width="15" height="6" rx="1.5"/><rect x="24.5" y="5" width="2.5" height="4" rx="1"/></svg>
    </span>
  </div>

  <div class="clock">
    <div class="date" id="date">—</div>
    <div class="time" id="clock">--:--</div>
    <div class="sub">FRONTIER OS · <b>2 apps</b> installed · mock build</div>
  </div>

  <label class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" placeholder="Search apps" autocomplete="off" />
  </label>

  <div class="apps-label">Apps</div>
  <div class="grid" id="grid">
    <button class="app live" data-name="lobby" data-href="lobby.html">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg><span class="dot-new"></span></span>
      <small>Lobby</small>
    </button>
    <button class="app live" data-name="wallet" data-href="wallet.html">
      <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/></svg><span class="dot-new"></span></span>
      <small>Wallet</small>
    </button>
    <button class="app soon" data-name="leaderboard">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/></svg><span class="badge soon-b">SOON</span></span>
      <small>Leaderboard</small>
    </button>
    <button class="app soon" data-name="garage">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5.6 4.8L4 16.2V20h3.8l4.9-4.9a4 4 0 0 0 4.8-5.6l-2.9 2.9-2.5-.6-.6-2.5z"/></svg><span class="badge soon-b">SOON</span></span>
      <small>Garage</small>
    </button>
  </div>

  <div class="dock" id="dock">
    <button class="app live" data-name="lobby" data-href="lobby.html" style="flex:1">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg></span>
      <small>Lobby</small>
    </button>
    <button class="app live" data-name="wallet" data-href="wallet.html" style="flex:1">
      <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/></svg></span>
      <small>Wallet</small>
    </button>
  </div>
  <div class="foot">FRONTIER OS · <b>EOS MOCK</b></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function tick(){
  const d = new Date();
  $('#clock').textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
  $('#stime').textContent = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  $('#date').textContent = d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
}
tick(); setInterval(tick, 10000);
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
}
$$('.app.live').forEach(b => b.addEventListener('click', () => {
  b.querySelector('.icon').style.transform = 'scale(.88)';
  setTimeout(() => location.href = b.dataset.href, 140);
}));
$$('.app.soon').forEach(b => b.addEventListener('click', () => {
  b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  toast(b.querySelector('small').textContent + ' — coming soon');
}));
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  $$('#grid .app').forEach(a => a.classList.toggle('hide', q && !a.dataset.name.includes(q)));
});
</script>
</body>
</html>
