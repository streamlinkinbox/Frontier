<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tread editor, quad tyre</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root { color-scheme: dark; --bg:#0b0f14; --panel:#131a22; --line:#243040; --text:#dbe4ee; --dim:#8fa3b8; --accent:#7fd1ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  header label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  input[type=text], input[type=number], select { background: #0b1017; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
  input[type=number] { width: 72px; }
  input[type=text] { width: 180px; }
  button { background: #1b2632; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: #24445a; border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  main { display: grid; grid-template-columns: 56px 1fr 300px; min-height: 0; }
  .tools { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-right: 1px solid var(--line); background: var(--panel); }
  .tools button { width: 40px; height: 40px; padding: 0; font-weight: 600; }
  .stage { position: relative; min-width: 0; min-height: 0; }
  #tread { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #hint { position: absolute; left: 10px; top: 8px; color: var(--dim); background: rgba(11,15,20,.7); padding: 4px 8px; border-radius: 4px; pointer-events: none; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 12px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 6px; font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
  .row label { color: var(--dim); min-width: 74px; }
  #selpanel[hidden] { display: none; }
  #selpanel { border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin: 0; }
  dt { color: var(--dim); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #topo { padding: 6px 8px; border-radius: 4px; font-weight: 600; }
  #topo.ok { background: #13331f; color: #8be3a6; }
  #topo.bad { background: #3a1717; color: #ffa0a0; }
  #view3d { position: relative; width: 100%; height: 260px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  #view3d canvas { display: block; }
  #view3dMsg { color: #f0c674; font-size: 12px; }
  .note { color: var(--dim); font-size: 12px; }
  @media (max-width: 900px) { main { grid-template-columns: 56px 1fr; } aside { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Tread editor</h1>
  <label>Name <input id="name" type="text"></label>
  <label>Pitch mm <input id="pitch" type="number" min="20" max="2000" step="1"></label>
  <label><input id="mirror" type="checkbox"> Mirror about centre</label>
  <label>Snap <select id="snap"><option value="0">off</option><option value="1">1 mm</option><option value="2" selected>2 mm</option><option value="5">5 mm</option></select></label>
  <label>Preset <select id="presets"><option value="">choose…</option></select></label>
  <button id="undo" title="Ctrl+Z">Undo</button>
  <button id="redo" title="Ctrl+Shift+Z">Redo</button>
  <button id="fit">Fit view</button>
  <button id="save">Save JSON</button>
  <label class="button">Load JSON <input id="load" type="file" accept=".json,application/json" hidden></label>
  <label>Mesh budget <select id="resolution"></select></label>
  <button id="exportObj">Export quad OBJ</button>
</header>
<main>
  <nav class="tools">
    <button data-tool="select" title="Select (V)">▲</button>
    <button data-tool="groove" title="Groove polyline (G)">/</button>
    <button data-tool="fill" title="Filled polygon (F)">■</button>
    <button data-tool="dimple" title="Dimple circle (D)">●</button>
    <button id="del" title="Delete selected (Del)">✕</button>
  </nav>
  <section class="stage">
    <canvas id="tread"></canvas>
    <div id="hint"></div>
  </section>
  <aside>
    <div>
      <h2>New shape</h2>
      <div class="row"><label>Width mm</label><input id="width" type="number" min="0.5" step="0.5" value="8"></div>
      <div class="row"><label>Depth %</label><input id="depth" type="number" min="1" max="100" step="1" value="100"></div>
      <div class="row"><label><input id="closed" type="checkbox"> Closed loop</label></div>
    </div>
    <div id="selpanel" hidden>
      <h2>Selected</h2>
      <div id="selinfo" class="note"></div>
      <div class="row"><label>Depth</label><input id="seldepth" type="range" min="1" max="100" step="1"><span id="seldepthOut"></span></div>
      <div class="row"><label>Width mm</label><input id="selwidth" type="number" min="0.5" step="0.5"></div>
      <div class="row"><label><input id="selclosed" type="checkbox"> Closed loop</label></div>
      <div class="row"><button id="selDelete">Delete shape</button></div>
    </div>
    <div>
      <h2>Mesh</h2>
      <div id="topo"></div>
      <dl id="stats" style="margin-top:8px"></dl>
    </div>
    <div>
      <h2>3D preview <label style="text-transform:none;letter-spacing:0"><input id="wire" type="checkbox"> wire</label></h2>
      <div id="view3d"></div>
      <div id="view3dMsg" class="note"></div>
    </div>
    <div class="note">
      <span id="count"></span><br>
      Tools: V select, G groove, F fill, D dimple. Enter finishes a shape, Esc cancels. Ctrl+Z / Ctrl+Shift+Z undo and redo. Wheel zooms, Alt-drag pans.
    </div>
  </aside>
</main>
<script type="module" src="./src/editor/app.js"></script>
</body>
</html>
